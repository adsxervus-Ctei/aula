function ghCfg(){
  try{ return JSON.parse(lsG('gh_cfg')||'{}'); }catch(e){ return {}; }
}
function ghGuardar(o){ lsS('gh_cfg',JSON.stringify(o)); }
async function publicarCfg(){
  const g=ghCfg();
  const repo=(document.getElementById('ghRepo')||{}).value||g.repo||'';
  const ruta=(document.getElementById('ghRuta')||{}).value||g.ruta||'config.json';
  const tok=(document.getElementById('ghTok')||{}).value||g.tok||'';
  const res=document.getElementById('ghRes');
  const di=t=>{ if(res) res.innerHTML=t; };
  if(!repo.includes('/')){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta el repositorio.</b> Escríbalo así: <code>usuario/repositorio</code></div>'); return; }
  if(!tok){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta la llave de acceso.</b></div>'); return; }
  ghGuardar({repo,ruta,tok});
  di('<div class="av2">Publicando…</div>');
  const api='https://api.github.com/repos/'+repo+'/contents/'+ruta;
  const cab={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'};
  try{
    let sha=null;
    const r1=await fetch(api+'?t='+Date.now(),{headers:cab});
    if(r1.status===200){ sha=(await r1.json()).sha; }
    else if(r1.status===404){ sha=null; }
    else if(r1.status===401||r1.status===403){ throw new Error('La llave no tiene permiso sobre ese repositorio.'); }
    else { throw new Error('GitHub respondió '+r1.status); }

    const texto=textoCfg();
    const cuerpo={message:'Actualizar configuración del aula',
      content:btoa(unescape(encodeURIComponent(texto)))};
    if(sha) cuerpo.sha=sha;
    const r2=await fetch(api,{method:'PUT',headers:{...cab,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)});
    if(!r2.ok){ const j=await r2.json().catch(()=>({})); throw new Error(j.message||('GitHub respondió '+r2.status)); }
    di('<div class="av2" style="background:#E9F9F0;color:#0A5B31"><b>✅ Publicado.</b> Los estudiantes lo ven al recargar, en uno o dos minutos.</div>');
    sOk();
  }catch(e){
    di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>No se pudo publicar.</b> '+esc(e.message)+
       '<br>Puede copiar el texto y pegarlo a mano en GitHub.</div>');
  }
}

 sLat(PX.rest/600);const t=Math.max(330,340+(PX.rest/600)*900);

 ac();let n=3;
 ov.innerHTML=`<div class="cdn"><div class="n" id="cn">3</div><div class="l">Prepárese</div></div>`;sBip(false);
 const t=setInterval(()=>{n--;const el=document.getElementById('cn');
  if(n>0){el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation='';sBip(false)}
  else if(n===0){el.textContent='¡YA!';document.querySelector('.cdn .l').textContent='Iniciar parcial';sBip(true)}
  else{clearInterval(t);sIni();preg()}},1000);
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){
 PX.rest--;const el=document.getElementById('tmr');
 if(el){el.textContent=fmt(PX.rest);if(PX.rest<=300)el.classList.add('w');if(PX.rest<=60){el.classList.remove('w');el.classList.add('c')}}
 if(PX.rest===600){progLat();const b=document.getElementById('hb');if(b)b.style.display='block'}
 if(PX.rest===300&&!PX.aviso){PX.aviso=true;sCom();const b=document.getElementById('wn');if(b)b.style.display='block'}
 if(PX.rest<=0){clearInterval(PX.timer);pararLat();sFin();fin(true)}
}
function preg(){
 if(!PX.timer)PX.timer=setInterval(tick,1000);
 const p=PX.p,q=p.preguntas[PX.idx],pc=Math.round(PX.idx/p.preguntas.length*100);
 ov.innerHTML=`<div class="md"><div class="bx">
  <div class="qb"><div style="font-family:var(--fm);font-size:11.5px;color:var(--sua)">Pregunta ${PX.idx+1} de ${p.preguntas.length} · Intento ${PX.intento} · máx. ${PX.max.toFixed(1)}</div>
   <div class="pg"><i style="width:${pc}%"></i></div><div class="tm" id="tmr">${fmt(PX.rest)}</div></div>
  <div id="hb" style="display:none;background:#FCE9E9;border:1px solid var(--mal);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px;color:#8A2020"><b>Últimos 10 minutos.</b></div>
  <div id="wn" style="display:none;background:#FFF3DC;border:1px solid var(--nar);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:#7A4E00"><b>¡Quedan 5 minutos!</b></div>
  <p class="qt">${esc(q.q)}</p>
  ${q.o.map((o,i)=>`<button class="op" onclick="resp(${i})"><span class="l">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}
  </div></div>`;
 const el=document.getElementById('tmr');
 if(PX.rest<=600){const b=document.getElementById('hb');if(b)b.style.display='block';if(!HB)progLat()}
 if(PX.rest<=300){el.classList.add('w');const b=document.getElementById('wn');if(b)b.style.display='block'}
 if(PX.rest<=60){el.classList.remove('w');el.classList.add('c')}
}
function resp(i){PX.resp[PX.idx]=i;sClk();PX.idx++;
 if(PX.idx>=PX.p.preguntas.length){clearInterval(PX.timer);pararLat();fin(false)}else preg()}
function fin(porT){
 const p=PX.p,tot=p.preguntas.length;let ok=0;
 p.preguntas.forEach((q,i)=>{if(PX.resp[i]===q.r)ok++});
 const nota=Math.round(ok/tot*PX.max*10)/10,apr=nota>=PX.min;
 apr?sApr():sRep();
 const fecha=new Date().toLocaleString('es-CO');
 const D={nombre:ST.u.n,usuario:ST.u.u,correo:ST.u.c||'—',parcial:PX.key,tituloParcial:p.titulo,cubre:p.cubre,
  intento:PX.intento,ok,tot,nota,max:PX.max,aprobo:apr,fecha};
 D.codigo=mkCod({nombre:D.nombre,correo:D.correo,parcial:D.parcial,intento:D.intento,ok,tot,nota:nota.toFixed(1),fecha});
 const ant=ST.notas[PX.key];
 if(!ant||nota>ant.nota)ST.notas[PX.key]={nota,intento:PX.intento,aprobo:apr,fecha};
 guardarProg();
 const rev=p.preguntas.map((q,i)=>{const b=PX.resp[i]===q.r,d=PX.resp[i]==null?'Sin responder':q.o[PX.resp[i]];
  return `<div class="it"><span class="s2 ${b?'o':'m'}">${b?'CORRECTA':'INCORRECTA'}</span><b>${i+1}. ${esc(q.q)}</b>
   <div class="ex">Su respuesta: ${esc(d)}${b?'':' · Correcta: '+esc(q.o[q.r])}<br>${esc(q.e)}</div></div>`}).join('');
 const cuerpo=encodeURIComponent(
`CONSTANCIA DE RESULTADO — Competencias Digitales Informacionales
Institución Universitaria del Caribe · UNICARIBE
Programa: ${CURSO.programa} · Semestre ${SEMESTRE}

Estudiante: ${D.nombre}
Usuario: ${D.usuario}
Correo: ${D.correo}
Parcial: ${p.titulo} (${p.cubre})
Intento: ${D.intento} de 2 — máxima ${PX.max.toFixed(1)} — aprueba con ${PX.min.toFixed(1)}
Respuestas correctas: ${ok} de ${tot}
NOTA OBTENIDA: ${nota.toFixed(1)}
Resultado: ${apr?'APROBADO':'NO APROBADO'}
${porT?'Observación: se cerró por tiempo agotado.\n':''}Fecha: ${fecha}

--- NO MODIFIQUE ESTE CÓDIGO ---
${D.codigo}
--------------------------------
Si alguna cifra se altera, el código deja de coincidir y el docente lo detecta.
Adjunte también la imagen de la constancia.

Docente: Rosembergth Castro Cervantes — ${CORREO_DOC}`);
 const asuntoTxt=(`[CDI] ${p.titulo} — ${D.nombre} — Nota ${nota.toFixed(1)} — Intento ${D.intento}`);
 const asunto=encodeURIComponent(asuntoTxt);
 const cuerpoTxt=decodeURIComponent(cuerpo);
 window._TXT=cuerpoTxt;
 const seg=!apr&&PX.intento===1;
 ov.innerHTML=`<div class="md"><div class="bx"><div class="rs">
  <div class="nt ${apr?'o':'m'}">${nota.toFixed(1)}</div>
  <div class="ms">${ok} de ${tot} correctas · Intento ${D.intento} · máx. ${PX.max.toFixed(1)} · aprueba con ${PX.min.toFixed(1)}<br>
   <b style="color:${apr?'var(--ver)':'var(--mal)'}">${apr?'Aprobado':'No aprobado'}</b>
   ${porT?'<br><span style="font-size:13px">Se cerró por tiempo agotado.</span>':''}</div>
  <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
   <button class="bt ${esMovil()?'g':'v'}" onclick="${esMovil()?'verConstancia()':'bajarConst()'}">🖼 ${esMovil()?'Ver y guardar constancia':'Descargar constancia'}</button>
   ${(navigator.canShare?`<button class="bt v" onclick="compartirConstancia()">📤 Compartir constancia</button>`:'')}
   <a class="bt" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener"
      href="${enlaceGmail(CORREO_DOC,CORREO_CC,asuntoTxt,cuerpoTxt)}">✉ Enviar por Gmail</a>
   <a class="bt g" style="text-decoration:none;display:inline-block"
      href="mailto:${CORREO_DOC}?cc=${CORREO_CC}&subject=${asunto}&body=${cuerpo}">Abrir mi correo</a>
   ${seg?`<button class="bt n" onclick="segundo()">Segundo intento (máx. 3.8)</button>`:''}
   <button class="bt g" onclick="cerrarOv();go(cur)">Cerrar</button></div>
  <div class="av2" style="text-align:left"><b>Cómo se envía.</b> En el celular use <b>Compartir constancia</b> y elija Gmail o WhatsApp. En computador use <b>Enviar por Gmail</b> y adjunte la imagen. El texto lleva el mismo código:
   <b>si se altera una cifra, el código deja de coincidir</b> y el docente lo detecta.</div>
  <div class="cod">${D.codigo}</div>
  ${seg?`<div class="av2" style="text-align:left"><b>Segundo intento.</b> La nota se calcula sobre <b>3.8</b> y aprueba con <b>2.9</b>. Revise primero las respuestas.</div>`:''}
  ${(!apr&&PX.intento===2)?`<div class="av2" style="text-align:left">Ya usó los dos intentos. Escriba a ${CORREO_DOC} para acordar la recuperación.</div>`:''}
  </div><div class="rv"><h3 style="font-family:var(--fd);font-size:16px;margin:0 0 6px">Revisión de respuestas</h3>${rev}</div></div></div>`;
 window._D=D;
}
function bajarConst(){constPNG(window._D).then(u=>{const a=document.createElement('a');
 a.href=u;a.download='Constancia_'+window._D.parcial+'_'+ST.u.u+'.png';a.click();toast('Constancia descargada.');sOk()})}
function segundo(){const k=PX.key;PX={key:k,usado:true};rubrica(k)}

document.addEventListener('keydown',e=>{
 if(document.getElementById('lg').style.display!=='none'&&e.key==='Enter')entrar();
 if(ov.innerHTML.trim()!==''||!ST.u)return;
 if(vAct.startsWith('s')){const i=+vAct.slice(1);
  if(e.key==='ArrowRight'&&acces(i+1))go(i+1); if(e.key==='ArrowLeft'&&i>0)go(i-1)}
});
window.addEventListener('hashchange',()=>{ST.habil=null;if(ST.u){buildNav();vista('aula')}});
cargarConfig().then(async()=>{
  if(CFG&&CFG.firebase&&CFG.firebase.apiKey){
    const ok=await cargarFirebase();
    if(ok){ pantallaFirebase(); return; }
  }
  montarIngreso();
});
</script>
</body>
