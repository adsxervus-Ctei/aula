<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aula PSST102 · Competencias Comunicativas · UNICARIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mor:#5C2483;--mor2:#3B1557;--morcl:#F3EDF8;--ver:#00A551;--nar:#F9A01B;--ama:#FFC72C;
 --tin:#241833;--sua:#5C5470;--lin:rgba(92,36,131,.15);--gris:#F6F4F9;--mal:#D64545;
 --fd:'Poppins',sans-serif;--fb:'Inter',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--gris);color:var(--tin);-webkit-font-smoothing:antialiased}

/* LOGIN */
#lg{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
 background:linear-gradient(140deg,var(--mor2),var(--mor) 55%,#7A35A8)}
#lg::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(249,160,27,.13);top:-180px;right:-160px}
#lg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(0,165,81,.12);bottom:-140px;left:-120px}
.lgc{background:#fff;border-radius:22px;padding:34px 32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.34);position:relative;z-index:2;animation:up .6s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.lgc img{width:186px;display:block;margin:0 auto 16px}
.lgc h1{font-family:var(--fd);font-size:20px;margin:0 0 4px;text-align:center;font-weight:600}
.lgc .s{font-size:13.5px;color:var(--sua);text-align:center;margin-bottom:20px;line-height:1.5}
label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mor);font-weight:700;margin-bottom:5px}
.inp{width:100%;font-family:var(--fb);font-size:15px;padding:12px 14px;border:1.5px solid var(--lin);border-radius:11px;margin-bottom:13px;transition:.15s}
.inp:focus{outline:none;border-color:var(--mor);box-shadow:0 0 0 3px rgba(92,36,131,.12)}
.inp.mono{font-family:var(--fm);letter-spacing:.09em;text-transform:uppercase}
.err{color:var(--mal);font-size:13px;margin:-6px 0 12px;display:none;background:#FCE9E9;padding:9px 12px;border-radius:9px}
.lk{display:block;text-align:center;font-size:12.5px;color:var(--mor);margin-top:13px;cursor:pointer;text-decoration:underline}

/* APP */
#ap{display:none;min-height:100vh}
#ap.on{display:flex}
.side{width:255px;flex:0 0 255px;background:var(--mor);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:90}
.side .lo{background:#fff;padding:15px;border-bottom:4px solid var(--nar);position:relative}
.side .lo img{width:100%;display:block}
.cls{display:none;position:absolute;top:7px;right:7px;background:var(--mor);color:#fff;border:none;width:31px;height:31px;border-radius:9px;font-size:15px;cursor:pointer}
.me{padding:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.me .r{display:flex;gap:11px;align-items:center}
.me .av{width:42px;height:42px;border-radius:50%;background:var(--ama);color:var(--mor2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;flex:0 0 auto}
.me .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.me .us{font-family:var(--fm);font-size:10.5px;color:rgba(255,255,255,.68)}
.pr{margin-top:12px}
.pr .b{height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.pr .b i{display:block;height:100%;background:linear-gradient(90deg,var(--ver),var(--ama));border-radius:5px;transition:width .5s}
.pr .t{font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.72);margin-top:5px}
.side nav{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nb{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:rgba(255,255,255,.86);font-family:var(--fb);font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nb:hover{background:rgba(255,255,255,.13)}
.nb.on{background:#fff;color:var(--mor);font-weight:600}
.nb .ic{font-size:15px}
.sep{font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ama);padding:12px 11px 5px;font-weight:600}
.side .ft{padding:13px 15px 17px;border-top:1px solid rgba(255,255,255,.15)}
.side .ft .fi{background:#fff;border-radius:9px;padding:5px 7px;margin-bottom:8px}
.side .ft .fi img{width:100%;max-height:50px;object-fit:contain;display:block}
.side .ft p{margin:0;font-size:11px;color:rgba(255,255,255,.72);line-height:1.55}
.side .ft b{display:block;color:#fff;font-size:12px}
.sb{margin-top:9px;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;font-family:var(--fm);font-size:10.5px;padding:7px;border-radius:8px;cursor:pointer}
.sb:hover{background:rgba(255,255,255,.26)}
main{flex:1;min-width:0;padding-bottom:50px}
.top{background:#fff;border-bottom:1px solid var(--lin);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:60}
.tl{display:flex;align-items:center;gap:11px;min-width:0}
.tlogo{display:none;height:28px}
.burg{display:none;background:var(--mor);color:#fff;border:none;border-radius:9px;width:38px;height:36px;font-size:16px;cursor:pointer}
.t1{font-family:var(--fd);font-weight:600;font-size:14.5px}
.t2{font-family:var(--fm);font-size:10.5px;color:var(--sua)}
.wr{max-width:1020px;margin:0 auto;padding:24px 26px}
.rin{opacity:0;transform:translateY(15px);animation:ri .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes ri{to{opacity:1;transform:translateY(0)}}

/* AULA */
.hd{background:linear-gradient(120deg,var(--mor),var(--mor2));color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(249,160,27,.2);animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
.hd h1{font-family:var(--fd);font-size:clamp(20px,3vw,28px);margin:0 0 7px;font-weight:600;position:relative}
.hd p{margin:0;font-size:14.5px;color:rgba(255,255,255,.87);line-height:1.6;max-width:60ch;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.cw{background:#fff;border:1px solid var(--lin);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;display:flex;flex-direction:column}
.cw:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(92,36,131,.14)}
.cw.bl{opacity:.6;cursor:not-allowed}.cw.bl:hover{transform:none;box-shadow:none}
.cw .bn{height:78px;background:linear-gradient(120deg,var(--mor),#7A35A8);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#fff}
.cw.u2 .bn{background:linear-gradient(120deg,#0E7A52,var(--ver))}
.cw.u3 .bn{background:linear-gradient(120deg,#B06E00,var(--nar))}
.cw .bn .n{font-family:var(--fd);font-size:31px;font-weight:700;line-height:1}
.cw .bn .st{font-size:21px}
.cw .bd{padding:14px 17px 17px;flex:1;display:flex;flex-direction:column}
.cw h3{font-family:var(--fd);font-size:15px;margin:0 0 6px;font-weight:600;line-height:1.3}
.cw p{margin:0;font-size:12.5px;color:var(--sua);line-height:1.5;flex:1}
.cw .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-family:var(--fm);font-size:9.5px;background:var(--morcl);color:var(--mor);padding:4px 8px;border-radius:12px;font-weight:600}
.tag.n{background:#FFF3DC;color:#9A6100}
.tag.v{background:#E3F6EC;color:#046B36}

/* SEMANA */
h2.sc{font-family:var(--fd);font-weight:600;font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sc::before{content:'';width:5px;height:20px;background:var(--nar);border-radius:3px}
.cd{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.cd h3{font-family:var(--fd);font-size:16px;margin:0 0 9px;font-weight:600}
.cd p{margin:0 0 8px;font-size:14.5px;line-height:1.62;color:var(--sua)}
.cd p:last-child{margin:0}
.cd b{color:var(--tin)}
ul.pt{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
ul.pt li{font-size:14.5px;line-height:1.55;color:var(--sua)}
ul.pt li b{color:var(--tin)}
.ob{background:var(--mor);color:#fff;border-radius:14px;padding:18px 21px}
.ob .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ama);font-weight:600;margin-bottom:5px}
.ob p{margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.95)}
.tw{overflow-x:auto;border-radius:10px}
.tw::-webkit-scrollbar{height:7px}.tw::-webkit-scrollbar-thumb{background:var(--lin);border-radius:5px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;min-width:470px}
table.tb th{background:var(--mor);color:#fff;text-align:left;padding:9px 12px;font-family:var(--fm);font-size:10px;text-transform:uppercase;white-space:nowrap}
table.tb td{border:1px solid var(--lin);padding:9px 12px;line-height:1.5;vertical-align:top}
table.tb tr:nth-child(even) td{background:var(--morcl)}
.th{display:none;font-family:var(--fm);font-size:10.5px;color:var(--sua);margin-top:5px}
.vd{background:#000;border-radius:14px;overflow:hidden;position:relative;padding-top:56.25%}
.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{font-size:12.5px;color:var(--sua);margin-top:7px;line-height:1.5}
.ejc{background:#fff;border:1px solid var(--lin);border-left:5px solid var(--ver);border-radius:0 14px 14px 0;padding:16px 19px;margin-bottom:11px;transition:.2s}
.ejc:hover{transform:translateX(4px)}
.ejc .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ver);font-weight:600}
.ejc h3{font-family:var(--fd);font-size:16px;margin:5px 0 7px;font-weight:600}
.ejc p{margin:0 0 7px;font-size:14px;line-height:1.58;color:var(--sua)}
.ejc ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ejc li{font-size:13.5px;line-height:1.5;color:var(--sua)}
.tl2{background:linear-gradient(135deg,#FFF8EC,#FFF1D6);border:1px solid rgba(249,160,27,.42);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.tl2 .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A6100;font-weight:700}
.tl2 h3{font-family:var(--fd);font-size:17px;margin:5px 0 3px;font-weight:600;color:#5A3A00}
.tl2 .m{font-family:var(--fm);font-size:11px;color:#9A6100;margin-bottom:9px}
.tl2 ol{margin:0 0 9px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tl2 li{font-size:14px;line-height:1.55;color:#4A3200}
.tl2 .lo{background:rgba(255,255,255,.8);border-radius:9px;padding:9px 12px;font-size:13px;color:#5A3A00}
.rcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}
.rc{display:flex;gap:11px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:13px 15px;text-decoration:none;color:inherit;transition:.16s}
.rc:hover{border-color:var(--mor);transform:translateY(-3px)}
.rc .i{width:31px;height:31px;border-radius:9px;background:var(--morcl);color:var(--mor);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rc b{display:block;font-size:13.5px}.rc span{display:block;font-size:12px;color:var(--sua);line-height:1.45;margin-top:2px}
.dn{background:linear-gradient(135deg,#E9F9F0,#DCF5E8);border:1.5px solid rgba(0,165,81,.4);border-radius:14px;padding:19px 22px;margin-top:20px;text-align:center}
.dn h3{font-family:var(--fd);font-size:16.5px;margin:0 0 6px;color:#046B36;font-weight:600}
.dn p{margin:0 0 13px;font-size:14px;color:#0A5B31;line-height:1.55}
.nv{display:flex;justify-content:space-between;gap:11px;margin-top:24px}
.bt{font-family:var(--fd);font-weight:600;font-size:14px;border:none;border-radius:10px;padding:12px 19px;cursor:pointer;background:var(--mor);color:#fff;transition:.16s}
.bt:hover:not(:disabled){background:var(--mor2);transform:translateY(-1px)}
.bt:disabled{opacity:.34;cursor:not-allowed}
.bt.g{background:#fff;color:var(--mor);border:1px solid var(--lin)}
.bt.v{background:var(--ver)}.bt.n{background:var(--nar);color:#3B1557}
.bt.big{font-size:15.5px;padding:14px 27px}
.bl2{background:#FFF3DC;border:1px solid var(--nar);border-radius:14px;padding:22px 26px;text-align:center}
.bl2 .i{font-size:38px}.bl2 h3{font-family:var(--fd);font-size:18px;margin:8px 0 6px;color:#7A4E00}
.bl2 p{margin:0;font-size:14px;color:#8A5A00;line-height:1.6}
.pxb{background:linear-gradient(120deg,var(--nar),#E08600);color:#3B1557;border-radius:16px;padding:22px 25px;margin-top:19px}
.pxb h3{font-family:var(--fd);font-size:20px;margin:0 0 6px;font-weight:700}
.pxb p{margin:0 0 12px;font-size:14px;line-height:1.55}

/* PROGRESO */
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.kp{background:var(--mor);color:#fff;border-radius:14px;padding:16px 19px}
.kp b{display:block;font-family:var(--fd);font-size:29px;line-height:1}
.kp span{font-family:var(--fm);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.82}
.kp.v{background:var(--ver)}.kp.n{background:var(--nar);color:#3B1557}
.lr{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.lr .n{font-family:var(--fm);font-weight:700;font-size:12px;background:var(--morcl);color:var(--mor);padding:5px 9px;border-radius:7px}
.lr .t{flex:1;font-size:14px}
.lr .s{font-family:var(--fm);font-size:12px}

/* MODALES / QUIZ */
.md{position:fixed;inset:0;background:rgba(36,24,51,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md .bx{background:#fff;border-radius:18px;max-width:800px;width:100%;padding:26px 28px;max-height:93vh;overflow-y:auto;animation:up .45s cubic-bezier(.2,.9,.25,1)}
.md h3{font-family:var(--fd);font-size:21px;margin:0 0 4px;font-weight:600}
.md .sb2{font-family:var(--fm);font-size:11.5px;color:var(--sua);margin-bottom:15px}
.cdn{position:fixed;inset:0;background:var(--mor);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cdn .n{font-family:var(--fd);font-size:clamp(88px,25vw,225px);font-weight:700;color:var(--ama);line-height:1;animation:pp .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pp{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.cdn .l{font-family:var(--fm);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px}
.qb{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:15px;flex-wrap:wrap}
.tm{font-family:var(--fm);font-size:24px;font-weight:600;background:var(--mor);color:#fff;padding:8px 14px;border-radius:10px}
.tm.w{background:var(--nar);color:#3B1557}.tm.c{background:var(--mal);color:#fff}
.tm.bt2{animation:bb .9s ease-in-out infinite}
@keyframes bb{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.09)}48%{transform:scale(1)}}
.pg{flex:1;min-width:100px;height:8px;background:var(--morcl);border-radius:5px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ver);border-radius:5px;transition:width .3s}
.qt{font-family:var(--fd);font-size:17.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.op{text-align:left;background:#fff;border:2px solid var(--lin);border-radius:11px;padding:12px 15px;font-family:var(--fb);font-size:14.5px;cursor:pointer;transition:.13s;display:flex;gap:10px;width:100%;margin-bottom:8px}
.op:hover{border-color:var(--mor);background:var(--morcl);transform:translateX(3px)}
.op .l{font-family:var(--fm);font-weight:600;color:var(--mor);flex:0 0 auto}
.rs{text-align:center}
.rs .nt{font-family:var(--fd);font-size:70px;font-weight:700;line-height:1;animation:pp .6s cubic-bezier(.2,1.3,.4,1)}
.rs .nt.o{color:var(--ver)}.rs .nt.m{color:var(--mal)}
.rs .ms{font-size:14.5px;color:var(--sua);margin:6px 0 15px}
.rv{text-align:left;margin-top:17px;border-top:1px solid var(--lin);padding-top:13px}
.rv .it{padding:10px 0;border-bottom:1px solid var(--lin);font-size:13.5px;line-height:1.55}
.rv .it:last-child{border:none}
.rv .s2{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:7px}
.rv .s2.o{background:#E3F6EC;color:var(--ver)}.rv .s2.m{background:#FCE9E9;color:var(--mal)}
.rv .ex{color:var(--sua);margin-top:4px;font-size:13px}
.av2{background:var(--morcl);border:1px solid var(--lin);border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.55;color:var(--sua);margin-top:12px}
.av2 b{color:var(--mor)}
.cod{font-family:var(--fm);font-size:11px;background:#241833;color:#7CFFB2;padding:11px 13px;border-radius:9px;word-break:break-all;line-height:1.5;margin-top:10px}
.wr2{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--lin);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.wr2 input{width:17px;height:17px;accent-color:var(--mor)}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--mor2);color:#fff;padding:13px 21px;border-radius:12px;font-size:14px;z-index:350;opacity:0;transition:.35s;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);width:268px}
 .side.abierta{transform:translateX(0);box-shadow:14px 0 44px rgba(0,0,0,.32)}
 .cls,.burg,.tlogo{display:block}
 .t1,.t2{display:none}
 .wr{padding:17px 14px}.top{padding:9px 13px}
 .hd{padding:21px 19px}.md .bx{padding:19px 15px}
 .th{display:block}
 .nv{flex-direction:column}.nv .bt{width:100%}
 .grid{grid-template-columns:1fr}
}
@media print{
 .side,.top,.nv,.pxb,.dn,#lg{display:none!important}
 body{background:#fff}.wr{max-width:100%;padding:0}.vd{display:none}
}

.tabf{flex:1;border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:9px 6px;border-radius:10px;cursor:pointer;color:var(--sua);transition:.16s}
.tabf.on{background:#fff;color:var(--mor);box-shadow:0 2px 8px rgba(92,36,131,.14)}
#lg .lgc{max-width:430px}
</style>

</head>
<body>

{n:1,unidad:'UNIDAD 1 · COMUNICACIÓN Y ORALIDAD',tema:'Por qué un técnico en SST tiene que saber hablar y escribir',
 intro:'Bienvenidos. La primera herramienta de un técnico en SST no es un casco: es su capacidad de explicarse. Un riesgo bien identificado pero mal comunicado sigue siendo un riesgo. En este encuentro le ponemos nombre técnico a algo que ustedes hacen todos los días.',
 objetivo:'Reconocer la comunicación como herramienta técnica de la profesión e identificar los <b>seis elementos del proceso comunicativo</b> en situaciones reales de trabajo del municipio.',
 contenido:[
  {t:'La mitad del oficio es hablar; la otra mitad, escribir',
   p:'Un técnico en SST identifica el riesgo, pero quien lo evita es el trabajador. Todo lo que hay en medio es comunicación.',
   lista:['<b>Hablar</b>: charlas de inducción, advertencias, capacitaciones, reuniones del COPASST.',
    '<b>Escribir</b>: informes de inspección, actas, reportes de incidente, matrices. <b>Lo que no queda escrito no se puede demostrar.</b>',
    '<b>Convencer</b>: al dueño que dice que los EPP son plata perdida, al trabajador que lleva veinte años haciéndolo a su manera.',
    'En su primer trabajo nadie le va a pedir que recite la GTC 45. Le van a pedir que <b>dicte una charla</b> y que <b>entregue un informe</b>.']},
  {t:'Los seis elementos del proceso comunicativo',
   p:'Cuando una advertencia falla, casi nunca falla “la comunicación” en general: falla <b>una pieza específica</b>. Y cada una se arregla distinto.',
   tabla:{c:['Elemento','Qué es','En una advertencia de riesgo'],
    f:[['<b>Emisor</b>','Quien produce el mensaje','El encargado que da la instrucción'],
       ['<b>Receptor</b>','Quien lo recibe e interpreta','El trabajador que va a ejecutar'],
       ['<b>Mensaje</b>','La información que se transmite','“No entre sin mascarilla”'],
       ['<b>Canal</b>','El medio por donde viaja','La voz, el letrero, el WhatsApp'],
       ['<b>Código</b>','El sistema compartido de signos','El idioma, los pictogramas, los colores'],
       ['<b>Ruido</b>','Todo lo que distorsiona','El motor, el afán, las palabras técnicas']]}},
  {t:'El ruido no es solo bulla',
   p:'Esta es la pieza que más se malentiende y la que más accidentes explica.',
   lista:['<b>Ruido físico</b>: el motor de la draga, la planta eléctrica, el trapiche. Muy real en los oficios de acá.',
    '<b>Ruido del canal</b>: la nota de voz que se corta, el letrero borrado por el sol.',
    '<b>Ruido de código</b>: usar palabras que el otro no maneja. Es el más frecuente en SST, porque el técnico habla en técnico.',
    '<b>Ruido de contexto</b>: el afán, el cansancio, el calor de la jornada. El mensaje llega, pero nadie lo procesa.']}
 ],
 video:{id:'yL16FUSjymU',t:'Charlas de 5 minutos: qué son y qué deben incluir',d:'Una introducción corta a la herramienta de comunicación más usada en SST. Es el destino al que llegamos en el encuentro 6.'},
 demoElementos:true,
 ejemplos:[
  {t:'El aviso que nadie leyó',c:'En un entable minero de San Martín pegaron un aviso impreso con letra pequeña y lenguaje técnico. Estuvo tres meses en la pared. Nadie lo leyó.',
   p:['El aviso <b>sí existía</b>: la empresa cumplió con ponerlo. Legalmente estaba en regla.',
    'Pero decía “utilícese equipo de protección respiratoria homologado en zonas de amalgamación”.',
    'Los trabajadores no usan la palabra “amalgamación” ni saben qué es “homologado”. Falló el <b>código</b>.',
    'Un técnico lo cambió por: <b>“Aquí se trabaja con mercurio. Sin mascarilla no entre.”</b> Letra grande, dos frases.',
    'A la semana siguiente todos usaban la mascarilla en esa zona.'],
   m:'Cumplir con poner el aviso no es lo mismo que lograr que se entienda. Lo primero protege a la empresa en el papel; lo segundo protege al trabajador de verdad.'},
  {t:'La nota de voz de la creciente',c:'Un padre manda audio al grupo de WhatsApp de la vereda: “mañana no hay paso, el río está crecido”. Un aviso de los que salvan.',
   p:['<b>Canal</b>: nota de voz. Rápido, cómodo, lo hace mientras camina.',
    '<b>Ruido</b>: el agua al grabar, la señal intermitente, y el mensaje perdido entre otros cincuenta del grupo.',
    'Dos personas no lo oyeron y salieron igual. No fueron imprudentes: <b>el mensaje no les llegó</b>.',
    'Con un texto corto y fijado en el grupo, la probabilidad de que lo vieran era mucho mayor.'],
   m:'La nota de voz deja registro pero nadie la vuelve a escuchar. Para una advertencia importante, el texto corto es superior aunque parezca más frío.'},
  {t:'El accidente que no fue culpa del trabajador',c:'Un trabajador no entendió una instrucción de seguridad y se accidentó. La primera reacción de todos fue: “no puso atención”.',
   p:['Al desarmar la escena aparece otra cosa: la instrucción se dio junto a una máquina encendida — <b>ruido físico</b>.',
    'Se dio en lenguaje técnico — <b>ruido de código</b>.',
    'Se dio al final de la jornada, con afán de irse — <b>ruido de contexto</b>.',
    'Y no quedó ningún registro — falla en la elección del <b>canal</b>.'],
   m:'Tres tipos de ruido y un canal mal escogido. La falla no fue de la persona: fue del sistema de comunicación. Y eso sí se puede arreglar — culpar al trabajador, no.'}
 ],
 taller:{t:'Desarmar dos situaciones reales',modo:'Parejas · 40 minutos',
  pasos:['<b>Caso A</b>: el pregonero de la plaza anunciando el precio del día. Identifiquen los seis elementos.',
   '<b>Caso B</b>: la nota de voz sobre la creciente del río. Identifiquen los seis elementos.',
   'En cada caso señalen <b>dónde está el ruido</b> y de qué tipo es.',
   'Comparen: ¿en cuál hay más riesgo de que la información no llegue?',
   'Escriban en una frase la regla que se desprende: “para avisar un riesgo yo usaría ___ porque ___”.',
   'Tres parejas socializan al frente, dos minutos cada una.'],
  logro:'Los seis elementos están identificados en ambos casos y la pareja tiene escrita su regla sobre el canal.'},
 tarea:'Elija una <b>empresa o lugar de trabajo real</b> de Barranco de Loba o San Martín que pueda visitar: un entable minero, un taller de motos, un trapiche, una parcela, una embarcación, la ESE. Levante su ficha —nombre, dueño, a qué se dedica, cuántas personas trabajan y qué labores hacen— y pregunte <b>cómo se le advierte a un trabajador nuevo</b> sobre los peligros del oficio. Traiga la respuesta textual. Esa empresa la acompaña los 8 encuentros.',
 recursos:[{i:'📘',t:'Charlas de seguridad: temas y ejemplos',d:'Banco de temas de charlas de 5 minutos aplicables en Colombia',u:'https://twind.io/co/charlas-de-seguridad-5-minutos-ejemplos-temas/'}]},

{n:2,unidad:'UNIDAD 1 · COMUNICACIÓN Y ORALIDAD',tema:'El canal lo cambia todo: TIC y comunicación oral',
 intro:'Hoy vamos a lo que cuesta plata y salud de verdad: <b>la evidencia</b>. Una advertencia dada de viva voz y una dada por escrito valen lo mismo mientras todo sale bien. El día que hay un incidente, valen cosas completamente distintas.',
 objetivo:'Elegir el canal adecuado según lo que esté en juego, redactar un aviso de riesgo que cualquiera entienda, y manejar el registro y el lenguaje no verbal al advertir a alguien que no quiere oír.',
 contenido:[
  {t:'Cada canal sirve para algo distinto',
   tabla:{c:['Canal','Rapidez','Evidencia','Para qué sirve en SST'],
    f:[['<b>Voz directa</b>','Máxima','Ninguna','Corregir en el momento, detener una tarea'],
       ['<b>Nota de voz</b>','Alta','Débil: existe pero nadie la revisa','Explicar algo largo con confianza'],
       ['<b>Letrero o aviso</b>','Media','Buena: permanece en el sitio','Advertencias fijas de un lugar de trabajo'],
       ['<b>Registro firmado</b>','Baja','Máxima: sirve ante la ARL','Charlas, inducciones, entrega de EPP']]},
   p:'Regla práctica: <b>entre más grave el riesgo, más formal debe ser el canal.</b> Un “cuidado con ese cable” va por voz; una capacitación en alturas, con registro y firma.'},
  {t:'La evidencia no es desconfianza: es protección',
   lista:['Un aviso de riesgo sin registro es casi imposible de sustentar ante la ARL después de un incidente.',
    'La frase que resuelve el problema social: <b>“firmemos la asistencia para que quede constancia de que sí se capacitó”</b>. Nadie se ofende con eso.',
    'El registro <b>protege al trabajador tanto como a la empresa</b>: demuestra qué se hizo y qué faltaba por hacer.',
    'Y sirve para algo que nadie ve: <b>poder delegar</b>. Si todo está en la cabeza del técnico, el sistema no funciona cuando él no está.']},
  {t:'Cómo se escribe un aviso que sí se lee',
   lista:['<b>Corto</b>: dos frases, máximo. Si necesita un párrafo, no es un aviso: es un instructivo.',
    '<b>En el código del que lee</b>: “mercurio”, no “amalgamación”. “Sin mascarilla no entre”, no “utilícese protección respiratoria homologada”.',
    '<b>Dice qué hacer</b>, no solo qué evitar. “Use careta” funciona mejor que “peligro”.',
    '<b>Se ve desde donde importa</b>: letra grande, a la altura de los ojos, en el punto exacto del riesgo.']}
 ],
 demoAviso:true,
 ejemplos:[
  {t:'Los dos avisos del aserrío',c:'Dos aserríos de la región ponen aviso en la sierra. Uno lo hace bien y el otro no, y se nota en los dedos de la gente.',
   p:['<b>Aserrío A</b>: cartel impreso que dice “Prohibido operar sin autorización. Riesgo mecánico”.',
    '<b>Aserrío B</b>: cartel grande que dice <b>“Esta sierra corta un dedo en medio segundo. No meta la mano: use el empujador.”</b>',
    'El primero informa una prohibición; el segundo <b>dice qué hacer</b> y explica por qué.',
    'En el aserrío B el empujador se usa. En el A está guardado en un cajón.'],
   m:'Un aviso que solo prohíbe se ignora. Uno que dice qué hacer, con una consecuencia concreta, cambia la conducta.'},
  {t:'La capacitación que no se pudo demostrar',c:'Ocurre un incidente. La ARL pregunta si al trabajador se le había capacitado en el riesgo. La empresa dice que sí, que se hizo la charla.',
   p:['No había <b>registro de asistencia</b>. Solo la palabra del encargado.',
    'El trabajador, presionado y asustado, dijo que no recordaba esa charla.',
    'Sin firma no había forma de probar quién asistió ni qué se dijo.',
    'La empresa quedó en posición débil por una hoja que costaba cinco minutos.'],
   m:'Después de un incidente hay miedo y versiones distintas. La firma no es burocracia: es lo único que queda cuando la memoria falla.'},
  {t:'El trabajador sin casco',c:'Un técnico ve a alguien sin casco. Puede resolverlo de dos formas y el resultado es opuesto.',
   p:['<b>Primera forma</b>: desde lejos, en tono de regaño: “¡póngase el casco que eso es obligatorio!”. Se lo pone y se lo quita apenas el técnico se va.',
    '<b>Segunda forma</b>: se acerca, lo mira y pregunta primero: “¿por qué no lo está usando?”.',
    'La respuesta fue concreta: el casco le quedaba grande y se le caía al agacharse.',
    'El problema no era desobediencia: era una talla. Se cambió el casco y el asunto se acabó.'],
   m:'Preguntar antes de ordenar convierte un pulso de autoridad en un problema técnico que se puede resolver.'}
 ],
 taller:{t:'El aviso de riesgo de mi empresa',modo:'Parejas · 45 minutos',
  pasos:['Tomen el riesgo más visible de la empresa que eligió en el encuentro anterior.',
   'Redacten el aviso en <b>máximo dos frases</b>: qué pasa y qué hacer.',
   'Prohibido: lenguaje técnico, verbos en pasiva (“utilícese”, “deberá”) y frases de más de doce palabras.',
   'Intercambien con la pareja de al lado. Si tienen que explicarlo, el aviso falló y se reescribe.',
   'Segunda parte, role-play: A es técnico en SST, B es un trabajador que no usa la protección. A tiene <b>3 minutos</b> para lograr que se la ponga, <b>sin regañar y sin rendirse</b>.',
   'El grupo evalúa con tres criterios: claridad, tono y lenguaje no verbal. Esa rúbrica se usa en los tres parciales.'],
  logro:'El aviso cabe en dos frases y otra pareja lo entendió sin explicación; y cada estudiante pasó por los dos roles del role-play.'},
 tarea:'Observe cómo se advierte un peligro en su empresa —de viva voz, con un letrero, o de ninguna forma— y descríbalo en <b>media página</b>: desármelo en los seis elementos, señale el tipo de ruido y diga <b>qué evidencia queda</b>. Si no queda ninguna, explique qué pasaría si mañana hubiera un incidente allí. Adjunte además su aviso reescrito y, si le autorizan, la foto de ese aviso publicado en el sitio real.',
 recursos:[{i:'🎥',t:'Charla de seguridad de 5 minutos: cómo se hace',d:'Frecuencia, quién la dicta y estructura básica',u:'https://www.youtube.com/watch?v=ixygfcsxYYE'}]},

{n:3,unidad:'PARCIAL 1 · ENTRADA A UNIDAD 2',tema:'Parcial primer corte y tipos de texto',
 intro:'Hoy cae el <b>primer parcial</b>, sobre todo lo de la Unidad 1. Después del descanso entramos a la Unidad 2 leyendo los documentos técnicos que un técnico en SST tiene que entender: fichas de seguridad, instructivos y procedimientos.',
 objetivo:'Demostrar el dominio de la Unidad 1, y reconocer los <b>tipos de texto</b> que circulan en materia de seguridad y para qué sirve cada uno.',
 contenido:[
  {t:'Cómo funciona el parcial',
   lista:['<b>10 preguntas</b> de selección múltiple sobre los encuentros 1 y 2.',
    '<b>20 minutos</b>. Antes de comenzar verá la rúbrica con lo que se evalúa.',
    'Primer intento: nota máxima <b>4.3</b>, aprueba con <b>3.0</b>. Segundo intento: máxima <b>3.8</b>, aprueba con <b>2.9</b>.',
    'En los últimos 10 minutos escuchará latidos que se aceleran; a los 5 minutos, una alerta.']},
  {t:'Los cuatro tipos de texto en seguridad',
   tabla:{c:['Tipo','Qué hace','Dónde aparece en SST'],
    f:[['<b>Narrativo</b>','Cuenta hechos en el tiempo','El reporte de un incidente, el acta de una reunión'],
       ['<b>Informativo</b>','Presenta datos sin opinar','Estadísticas de accidentalidad, resultados de mediciones'],
       ['<b>Instructivo</b>','Dice cómo hacer algo','Ficha de datos de seguridad, procedimiento, manual de una máquina'],
       ['<b>Argumentativo</b>','Defiende una posición','La justificación de un presupuesto de EPP ante la gerencia']]},
   p:'En SST los que <b>más protegen</b> son los instructivos — fichas, procedimientos, instructivos de máquina — y son justamente los que menos se leen completos. Ahí está el riesgo.'},
  {t:'Leer un documento técnico no es leer un cuento',
   lista:['Un texto de seguridad se lee <b>buscando</b>, no de corrido.',
    '<b>Qué me obliga a mí</b>: qué EPP exige, qué está prohibido, qué hay que hacer antes de empezar.',
    '<b>Qué hago si algo sale mal</b>: primeros auxilios, derrames, incendio. Es la parte que nadie lee y la que salva vidas.',
    '<b>Qué no dice</b>: si el documento no menciona un riesgo que usted ve en el sitio, ese vacío también es información.']}
 ],
 video:{id:'pAS0yRgGJJU',t:'Navegando las Hojas de Datos de Seguridad (SDS)',d:'Cómo leer y comprender una ficha de datos de seguridad, el documento instructivo más importante para quien trabaja con químicos.'},
 ejemplos:[
  {t:'La ficha que estaba en inglés',c:'Un trapiche compra un producto de limpieza industrial. La ficha de datos de seguridad venía en inglés, en una carpeta, en la oficina.',
   p:['Legalmente el documento existía. Prácticamente, no servía para nada.',
    'Quien manipulaba el producto no leía inglés ni tenía acceso a la carpeta.',
    'El técnico tradujo la sección de <b>primeros auxilios</b> y la pegó junto al producto, en letra grande.',
    'Costo: una hoja impresa. Beneficio: que la información esté donde ocurre el riesgo.'],
   m:'Un documento de seguridad que está lejos del riesgo es un documento que no protege. La información tiene que estar en el punto donde se necesita.'},
  {t:'El procedimiento de 14 páginas',c:'Una empresa entrega a sus trabajadores el procedimiento de trabajo seguro en alturas: 14 páginas con normativa citada.',
   p:['Nadie lo leyó completo. Varios firmaron que sí lo habían leído.',
    'El técnico extrajo lo esencial en una hoja: <b>qué revisar antes de subir, qué está prohibido y qué hacer si algo falla</b>.',
    'El documento largo se quedó en la carpeta para la auditoría; la hoja se pegó en el sitio.',
    'Los dos son necesarios — pero cumplen funciones distintas.'],
   m:'El documento completo protege legalmente a la empresa; el resumen en el sitio protege al trabajador. Un técnico produce los dos.'},
  {t:'Lo que el instructivo no decía',c:'El manual de una guadaña explica el arranque, el mantenimiento y el cambio de cuchilla. Un técnico lo lee buscando otra cosa.',
   p:['Buscó qué decía sobre <b>protección auditiva</b>. No decía nada.',
    'Buscó sobre distancia mínima entre operarios. Tampoco.',
    'Esos dos vacíos eran justamente los riesgos que él había observado en la parcela.',
    'El informe recogió las dos ausencias como hallazgo, y se agregaron al procedimiento propio de la finca.'],
   m:'Leer buscando lo que <b>falta</b> es lo que separa a un técnico de un lector común. Los vacíos de un documento son hallazgos.'}
 ],
 taller:{t:'Clasificar y extraer lo esencial',modo:'Grupos de 4 · 40 minutos',
  pasos:['Reciben documentos reales: una ficha de datos de seguridad, un instructivo de máquina y un aviso.',
   'Clasifiquen cada uno: narrativo, informativo, instructivo o argumentativo.',
   'De la ficha de seguridad, ubiquen tres cosas: <b>qué EPP exige</b>, <b>qué hacer en caso de contacto</b> y <b>cómo se almacena</b>.',
   'Subrayen todo lo que un trabajador de la vereda <b>no entendería a la primera lectura</b>.',
   'Extraigan lo esencial en <b>una hoja</b> que se pueda pegar junto al producto.',
   'Un grupo presenta su hoja y los demás dicen si la entenderían.'],
  logro:'La hoja resumen cabe en una página, está en lenguaje claro y conserva las tres informaciones críticas.'},
 tarea:'Consiga <b>un documento técnico real</b> de su empresa: la ficha de seguridad de un producto que usen, el manual de una máquina o un procedimiento. Analícelo y entregue: qué tipo de texto es, cuál es su idea principal en una frase, qué le exige al trabajador, y <b>qué información le falta</b> frente a los riesgos que usted observó en el sitio.',
 recursos:[{i:'📄',t:'Cómo leer una hoja de datos de seguridad',d:'Guía escrita en español, sección por sección',u:'https://www.ueunion.org/es/como-leer-una-hoja-de-datos-de-seguridad-del-material-msds'}],
 parcial:'p1'},

{n:4,unidad:'UNIDAD 2 · COMPRENSIÓN Y ESCRITURA',tema:'Leer entre líneas y escribir para que se entienda',
 intro:'Hoy subimos dos escalones en la lectura: qué <b>dice</b> un documento, qué se <b>deduce</b> de él y si le <b>conviene</b> a la empresa. Y después escribimos: reescribir una instrucción técnica para que la entienda cualquiera es de lo más útil que se llevan de esta asignatura.',
 objetivo:'Leer un documento técnico en los <b>tres niveles</b> —literal, inferencial y crítico— y reescribir una instrucción de seguridad en lenguaje claro sin perder ninguna precaución.',
 contenido:[
  {t:'Los tres niveles de lectura',
   p:'No son tres formas de leer para escoger una: son tres escalones. Se suben en orden.',
   tabla:{c:['Nivel','La pregunta','Ejemplo con una ficha de seguridad'],
    f:[['<b>Literal</b>','¿Qué dice exactamente?','Exige guantes de nitrilo y mascarilla con filtro'],
       ['<b>Inferencial</b>','¿Qué se deduce de eso?','Si la empresa solo tiene tapabocas de tela, no está protegida'],
       ['<b>Crítico</b>','¿Qué hago con eso?','Priorizo comprar la mascarilla antes que los guantes: el riesgo respiratorio es mayor']]},
   p2:'La mayoría de la gente lee solo en el nivel literal y decide con eso.'},
  {t:'Reescribir claro no es debilitar la advertencia',
   lista:['Un documento claro <b>protege más</b>, porque nadie puede decir después que no lo entendió.',
    'Reescribir claro significa: frases cortas, una idea por frase, sujeto explícito y verbos en presente.',
    'Lo que <b>no</b> se puede cambiar: las precauciones, las cantidades, los EPP exigidos ni los pasos de emergencia.',
    'Lo que <b>sí</b> se debe cambiar: las palabras rebuscadas, las frases de cinco líneas y los sujetos escondidos.']},
  {t:'El sujeto escondido: el error que más cuesta',
   p:'“Se deberá utilizar protección auditiva en la zona de corte” no obliga a nadie, porque no dice <b>quién</b>.',
   lista:['Cada vez que vea <b>“se hará”, “se deberá”, “se utilizará”</b>, pregunte: ¿quién?',
    'Corregido: “<b>El operario</b> usa protección auditiva mientras la sierra esté encendida.”',
    'Esa pregunta —¿quién?— ha evitado más discusiones que cualquier norma.',
    'Y en un procedimiento, sin responsable no hay quien responda.']}
 ],
 video:{id:'nDTm_woSbGM',t:'Ficha de datos de seguridad: qué contiene y cómo usarla',d:'Recorrido por las secciones de una FDS dentro del manejo de materiales peligrosos. Sígalo con la ficha de su empresa al lado.'},
 demoSDS:true,
 ejemplos:[
  {t:'La convocatoria que se leyó al revés',c:'Dos asociaciones reciben la misma convocatoria de recursos para dotación de seguridad. Una la lee de principio a fin; la otra empieza por los requisitos.',
   p:['La primera leyó el monto, se entusiasmó y dedicó una reunión a discutir en qué invertirlo.',
    'A los tres días llegaron a la página de requisitos y descubrieron que no cumplían dos.',
    'La segunda buscó primero las palabras “requisitos” y “no podrán participar”. En cinco minutos supo qué le faltaba.',
    'Con ese tiempo alcanzó a tramitarlo y aplicó dentro del plazo.'],
   m:'Leer al revés no es pesimismo: es administración del tiempo. La segunda no fue más lista — leyó en otro orden.'},
  {t:'La instrucción que cambió de sentido por una coma',c:'En un procedimiento quedó escrito: “No opere la máquina, sin supervisión del jefe de taller”.',
   p:['Con esa coma se puede leer como <b>“no opere la máquina”</b>, y lo demás como una aclaración.',
    'Sin la coma dice lo que se quería: no la opere si no hay supervisión.',
    'Un operario nuevo entendió que no debía operarla nunca y la producción se detuvo medio día.',
    'Otro pudo haber entendido lo contrario. Y ahí el costo no es medio día.'],
   m:'En un procedimiento de seguridad, la puntuación no es estética: define qué está permitido y qué no.'},
  {t:'La hoja que sí se leyó',c:'Un técnico reescribió la advertencia de un producto químico usado en una finca de la zona.',
   p:['<b>Original</b>: “Evítese la inhalación de vapores. En caso de exposición prolongada, utilícese equipo de protección respiratoria adecuado.”',
    '<b>Reescrito</b>: “Este producto daña los pulmones. No lo huela. Use mascarilla con filtro mientras fumiga.”',
    'Las precauciones son las mismas. Cambió quién puede entenderlas.',
    'Se pegó junto al recipiente, no en la carpeta de la oficina.'],
   m:'La versión clara no es menos técnica: es la misma advertencia puesta al alcance de quien corre el riesgo.'}
 ],
 taller:{t:'Los tres niveles y la reescritura',modo:'Individual y parejas · 50 minutos',
  pasos:['Con el documento técnico que trajo, escriba las respuestas de los <b>tres niveles</b>, cada una separada.',
   '<b>Literal</b>: qué exige exactamente. <b>Inferencial</b>: qué le falta a su empresa para cumplirlo. <b>Crítico</b>: qué medida priorizaría con los recursos que hay.',
   'Regla: la respuesta inferencial <b>no puede estar copiada</b> del texto. Si está copiada, es literal.',
   'Escoja la instrucción <b>más confusa</b> del documento y reescríbala aplicando las cuatro reglas.',
   'No cambie precauciones, cantidades ni EPP: solo cómo está dicho.',
   'Pásela a su pareja: debe poder explicar qué hay que hacer <b>leyendo solo su versión</b>.'],
  logro:'Los tres niveles están diferenciados, la inferencia aporta algo que el texto no dice, y la reescritura conserva todas las precauciones.'},
 tarea:'Entregue las <b>dos versiones enfrentadas</b> de la instrucción: la original fotografiada y la suya reescrita, con tres líneas explicando qué cambió y por qué la protección sigue siendo la misma. Si la empresa lo autoriza, <b>imprima su versión y péguela junto al riesgo</b>, y mande la foto.',
 recursos:[{i:'🧪',t:'Guía para comprender las SDS',d:'Las 16 secciones del formato estandarizado, en español',u:'https://chemicalsafety.com/es/guia-para-comprender-las-hojas-de-datos-de-seguridad-sds/'}]},
{n:5,unidad:'UNIDAD 2 · COMPRENSIÓN Y ESCRITURA',tema:'El proceso de escritura y la gramática que se nota',
 intro:'Hoy escribimos algo que un técnico en SST produce todas las semanas: un <b>reporte de condición insegura</b>. Y lo escribimos como se escribe de verdad, en tres fases. Porque escribir bien no es escribir de una sola vez: eso no lo hace nadie.',
 objetivo:'Producir un reporte escrito pasando por <b>planificar, textualizar y revisar</b>, y corregir los errores de gramática que cambian el sentido de una instrucción de seguridad.',
 contenido:[
  {t:'Escribir bien no es escribir de una sola vez',
   tabla:{c:['Fase','Qué se hace','Cuánto del tiempo'],
    f:[['<b>Planificar</b>','Decidir a quién, para qué y con qué argumento','40%'],
       ['<b>Textualizar</b>','Escribir el borrador sin detenerse a corregir','20%'],
       ['<b>Revisar</b>','Leer como si fuera el destinatario y ajustar','40%']]},
   p:'Fíjense en los porcentajes: <b>escribir es lo que menos tiempo toma</b>. La mayoría hace lo contrario — se sienta a escribir de una y no revisa nunca.'},
  {t:'Las tres preguntas antes de escribir un reporte',
   lista:['<b>¿A quién le escribo?</b> No es lo mismo el dueño de la finca que la ARL. Eso define el registro.',
    '<b>¿Qué quiero que haga después de leer?</b> Que compre un EPP, que detenga una tarea, que asigne un responsable. Sea específico.',
    '<b>¿Qué argumento lo mueve a él?</b> No el que a mí me parece justo: el que a él le sirve.',
    'Con el dueño de un negocio pequeño, el argumento que funciona rara vez es la norma. Es <b>lo que le cuesta un accidente</b>: días sin producir, un trabajador menos, una demanda.']},
  {t:'Los cuatro errores que cambian una instrucción',
   tabla:{c:['Error','Qué pasa','Ejemplo'],
    f:[['<b>Sujeto escondido</b>','No se sabe quién debe hacerlo','“Se revisará el extintor” — ¿quién?'],
       ['<b>Coma mal puesta</b>','Cambia a qué se aplica la condición','“No opere la máquina, sin supervisión”'],
       ['<b>Concordancia rota</b>','Se pierde a qué se refiere','“Los guantes y la careta será entregada…”'],
       ['<b>Referencia confusa</b>','No se sabe de qué se habla','“Esto debe cambiarse” — ¿qué es “esto”?']]}}
 ],
 demoTresFrases:true,
 ejemplos:[
  {t:'El reporte que consiguió el presupuesto',c:'Un técnico llevaba dos meses pidiendo mascarillas y no se las aprobaban. Cambió el argumento.',
   p:['<b>Primera versión</b>: “Se requiere dotación de protección respiratoria conforme a la normativa vigente.” No pasó nada.',
    'Al replantear: ¿qué le sirve al dueño? No la norma — el costo de parar.',
    '<b>Segunda versión</b>: “Dos trabajadores llevan tres semanas con tos. Si uno se incapacita, el entable para. Las mascarillas cuestan menos que un día parado.”',
    'Aprobó la compra esa semana.'],
   m:'Un reporte no cita la norma para convencer: <b>traduce el riesgo a lo que le duele a quien decide</b>. Eso no es manipular: es comunicar bien.'},
  {t:'El “se revisará” que nadie revisó',c:'En un acta de COPASST quedó escrito: “Se revisarán los extintores antes del 30 y se realizará la recarga de los vencidos”.',
   p:['Llegó el 30 y nadie había revisado nada. Cada uno creía que le tocaba al otro.',
    'La frase no tenía <b>sujeto</b>. “Se revisarán” no obliga a nadie en particular.',
    'Tampoco tenía responsable para la recarga ni fecha para ella.',
    'Corregido: “<b>El técnico en SST</b> revisa los extintores antes del 30. <b>La administración</b> paga la recarga en los cinco días siguientes.”'],
   m:'Cada vez que vea “se hará” en un acta, pregunte quién. Esa sola pregunta convierte un deseo en un compromiso.'},
  {t:'Los tres borradores del reporte',c:'Una estudiante escribió el reporte de una condición insegura en un taller de motos. La primera versión tenía dos páginas.',
   p:['<b>Borrador 1</b>: todo lo que vio, en orden de recorrido, incluyendo detalles que no eran riesgo.',
    'Al revisar: el dueño abre a las 6 y cierra a las 8. Dos páginas no las lee.',
    '<b>Borrador 2</b>: media página. El hallazgo, la foto, y lo que costaba resolverlo.',
    '<b>Borrador 3</b>: se agregó una línea al final con el responsable y la fecha. Esa línea fue la que hizo que se resolviera.'],
   m:'Revisar casi siempre significa <b>quitar</b>, no agregar. Y lo último que se agrega —quién y cuándo— es lo que produce la acción.'}
 ],
 taller:{t:'El reporte de condición insegura, en tres fases',modo:'Individual y parejas · 50 minutos',
  pasos:['<b>Fase 1 — Planificar</b>: escoja una condición insegura real de su empresa y responda por escrito las tres preguntas.',
   'Escriba en una frase el propósito: “quiero que ___ haga ___ antes de ___”.',
   '<b>Fase 2 — Textualizar</b>: borrador de <b>media página</b>, sin detenerse a corregir. Estructura: qué observé, qué riesgo implica, qué propongo, quién y para cuándo.',
   '<b>Fase 3 — Revisar</b>: intercambie con su pareja. Quien revisa responde: ¿qué me piden que haga?, ¿el argumento me sirve a mí?, ¿qué sobra?',
   'Después, cacería de errores: busquen en su propio texto los <b>“se hará”</b> y reescríbanlos nombrando al responsable.',
   'Verifiquen que ninguna frase pase de dos comas. Si pasa, pártanla en dos.'],
  logro:'El reporte cabe en media página, no tiene sujetos escondidos, y dice con claridad quién hace qué y para cuándo.'},
 tarea:'Pase el reporte a limpio y <b>muéstreselo al dueño o encargado</b> de la empresa. Pregúntele qué haría con esa información y anote su respuesta textual al final. Prepárese además para el <b>Parcial 2</b> del próximo encuentro: cubre la Unidad 2 completa — tipos de texto, los tres niveles de lectura, el proceso de escritura y los cuatro errores de gramática.',
 recursos:[]},

{n:6,unidad:'PARCIAL 2 · UNIDAD 3 · SST',tema:'Parcial segundo corte y la charla de 5 minutos',
 intro:'Cae el <b>segundo parcial</b> sobre la Unidad 2. Y después entramos a lo que más va a usar en su vida laboral: la <b>charla de seguridad de 5 minutos</b>, esa que se dicta antes de iniciar la jornada, frente a gente con afán.',
 objetivo:'Demostrar el dominio de la Unidad 2, y preparar y dictar una <b>charla de seguridad de 5 minutos</b> con estructura profesional.',
 contenido:[
  {t:'La charla de 5 minutos: la herramienta del oficio',
   p:'También llamada charla preoperacional o <i>toolbox talk</i>. Se dicta al inicio de la jornada, dura lo que dice su nombre, y es lo que más se le va a pedir en una empresa.',
   lista:['<b>Un solo tema</b>. Cinco minutos no dan para dos. Si tiene dos riesgos, son dos charlas.',
    '<b>Sobre algo de hoy</b>: la tarea que van a hacer en esta jornada, no un tema general.',
    '<b>Con participación</b>: si nadie habla, no fue una charla — fue un anuncio.',
    '<b>Con registro</b>: tema, fecha, quién la dictó y firma de los asistentes.']},
  {t:'La estructura de los cinco minutos',
   tabla:{c:['Momento','Tiempo','Qué se hace'],
    f:[['<b>Apertura</b>','30 segundos','El riesgo de HOY, con un hecho concreto o una foto'],
       ['<b>Desarrollo</b>','3 minutos','Qué puede pasar, por qué, y las medidas — máximo tres'],
       ['<b>Participación</b>','1 minuto','Una pregunta abierta al grupo. No “¿entendieron?”'],
       ['<b>Cierre</b>','30 segundos','El compromiso concreto para la jornada y la firma']]},
   p:'La pregunta del cuarto momento no es “¿entendieron?” — a esa todos responden que sí. Es <b>“¿qué es lo más riesgoso de lo que vamos a hacer hoy?”</b>'},
  {t:'Lo que hace que una charla no sirva',
   lista:['<b>Leer un papel</b>: si usted lee, nadie lo mira y nadie recuerda.',
    '<b>Hablar en técnico</b>: “riesgo mecánico por atrapamiento” no le dice nada a la cuadrilla. “Esa cadena le arranca un dedo” sí.',
    '<b>Regañar</b>: la charla no es para reclamar lo de ayer. Es para prevenir lo de hoy.',
    '<b>Alargarla</b>: a los ocho minutos ya nadie escucha. La disciplina del tiempo es parte de la técnica.']}
 ],
 video:{id:'oA1ulppJvxY',t:'Charla SST: guardas de seguridad · ejemplo real de charla de 5 minutos',d:'Una charla completa dictada de principio a fin. Obsérvela con la estructura de los cuatro momentos en la mano.'},
 video2:{id:'-1Zobsf6_Uc',t:'Pláticas de seguridad de 5 minutos',d:'Segunda referencia sobre la reunión preventiva de inicio de jornada. Compare el estilo con el video anterior.'},
 ejemplos:[
  {t:'La charla que la cuadrilla sí escuchó',c:'Dos técnicos dictan la misma charla sobre riesgo eléctrico en un aserrío. Uno lee la norma; el otro muestra una foto.',
   p:['El primero proyectó el artículo del reglamento. Correcto, completo, y nadie lo escuchó.',
    'El segundo mostró <b>la foto del tablero de ese mismo aserrío</b>, con la tapa faltante señalada.',
    'La cuadrilla reconoció su propio sitio de trabajo. Dejó de ser teoría.',
    'Al final de esa charla, los mismos trabajadores pidieron que se arreglara el tablero esa semana.'],
   m:'Una charla no busca informar: busca que <b>alguien cambie una conducta</b>. Y para eso la gente tiene que reconocerse en lo que oye.'},
  {t:'El “¿entendieron?” que no sirvió',c:'Un técnico explica el uso de un arnés a un ayudante nuevo. Al final pregunta “¿entendió?” y el muchacho dice que sí.',
   p:['Había entendido la mitad. Dijo que sí por no quedar mal el primer día.',
    'Nadie dice “no entendí” cuando le preguntan directamente: suena a admitir que uno es lento.',
    'El técnico cambió la pregunta: <b>“muéstreme cómo se lo va a poner”</b>.',
    'Ahí aparecieron de inmediato dos pasos que el muchacho no tenía claros.'],
   m:'Verificar no es preguntar si entendió: es <b>hacer que la persona lo demuestre</b>. Es la única forma de saber qué llegó realmente.'},
  {t:'La charla de tres minutos que valió por una hora',c:'En una embarcación de la zona, el patrón dictaba charlas largas los lunes. Nadie las recordaba el miércoles.',
   p:['Se cambió a una charla de tres minutos <b>cada mañana</b>, sobre la tarea de ese día.',
    'Lunes: el chaleco. Martes: la carga mal estibada. Miércoles: el sol y la deshidratación.',
    'Cada una tenía un solo mensaje y un compromiso concreto.',
    'A los dos meses, el uso del chaleco pasó de ocasional a permanente.'],
   m:'Poco y frecuente vence a mucho y esporádico. Es el principio que sostiene toda la charla de 5 minutos.'}
 ],
 taller:{t:'Prepare y dicte su charla de 5 minutos',modo:'Individual, frente al grupo · 55 minutos',
  pasos:['Escoja un riesgo <b>real</b> de la empresa que acompaña: mercurio en el entable, sol prolongado, machete, moto en trocha, ahogamiento, ruido del trapiche.',
   'Prepare los cuatro momentos por escrito: apertura con un hecho concreto, tres medidas máximo, la pregunta abierta y el compromiso de cierre.',
   'Dictela en <b>5 minutos exactos</b>, cronometrados. Un compañero hace de trabajador.',
   'Prohibido: leer el papel, usar lenguaje técnico sin traducir, y pasarse del tiempo.',
   'Cierre obligatoriamente con la pregunta abierta y responda lo que le contesten.',
   'El grupo evalúa con la rúbrica de tres criterios más uno nuevo: <b>¿logró participación?</b>'],
  logro:'Dictó la charla en cinco minutos con los cuatro momentos, sin leer, y alguien del grupo participó de verdad.'},
 tarea:'Escriba el <b>guion de su charla en una página</b>: a quién va dirigida, el riesgo, las tres cosas que deben recordar y el compromiso de cierre. Debe servirle al dueño para que otra persona la dicte sin usted presente. Y prepare para el próximo encuentro los <b>datos del riesgo</b>: cuántos trabajadores están expuestos y qué medidas existen hoy.',
 recursos:[{i:'📋',t:'Banco de charlas de 5 minutos',d:'Más de 50 temas con estructura, para adaptar a su empresa',u:'https://www.hysla.com/charlas-de-5-minutos-seguridad-salud-ocupacional/'}],
 parcial:'p2'},

{n:7,unidad:'UNIDAD 3 · COMUNICACIÓN EN SST',tema:'Comunicar el riesgo y negociar con quien se resiste',
 intro:'Dos cosas difíciles en un solo encuentro: <b>dar una mala noticia sin perder a la gente</b>, y <b>negociar con quien dice que los EPP son plata perdida</b>. Las dos las va a enfrentar en su primer trabajo.',
 objetivo:'Construir un mensaje de alerta <b>semaforizado</b> en tres frases, y sostener una negociación asertiva frente a la resistencia al uso de elementos de protección.',
 contenido:[
  {t:'La regla de las tres frases',
   p:'Un mensaje de riesgo no necesita explicaciones largas. Necesita estas tres cosas, en este orden.',
   lista:['<b>Frase 1 — Qué pasó o qué se detectó.</b> Directo, sin disculpas anticipadas.',
    '<b>Frase 2 — Qué implica.</b> Concreto: a quién afecta, desde cuándo, qué puede ocurrir.',
    '<b>Frase 3 — Qué se hace.</b> La acción exacta que se espera. Siempre hay algo que proponer.',
    'El orden importa. Si empieza con rodeos, quien lee ya está en alerta antes de saber de qué le hablan.']},
  {t:'Semaforizar: comunicar el nivel de un vistazo',
   tabla:{c:['Nivel','Qué significa','Qué debe pasar'],
    f:[['<b>Verde</b>','Condición controlada','Se mantiene y se verifica en la rutina'],
       ['<b>Amarillo</b>','Riesgo presente, controlable','Se corrige esta semana, con responsable'],
       ['<b>Rojo</b>','Riesgo grave e inminente','Se detiene la tarea ahora, no después']]},
   p:'La semaforización funciona porque <b>no exige leer</b>: el color comunica antes que la palabra. Por eso se usa en matrices, tableros y avisos.'},
  {t:'Las tres jugadas de una negociación',
   p:'Cuando el otro tiene más poder —el dueño, el contratista— estas tres cosas cambian el terreno.',
   lista:['<b>Reconocer su interés</b>: “entiendo que necesita entregar el pedido esta semana”. Con eso deja de ser un pulso.',
    '<b>Poner un dato</b>: no “eso es peligroso”, sino “un accidente de mano incapacita en promedio 15 días”.',
    '<b>Proponer un intercambio</b>: no pedir — <b>ofrecer algo a cambio</b>. “Empecemos por los tres puestos de más riesgo y en dos meses vemos el resto.”',
    'Lo que <b>no</b> funciona: amenazar con la ley en la primera frase, rogar, o rendirse.']}
 ],
 ejemplos:[
  {t:'El aviso de suspensión por creciente',c:'Una empresa de transporte fluvial debe suspender los despachos por creciente. Tiene que avisarle a clientes y tripulación.',
   p:['<b>Primera versión</b>: tres párrafos con disculpas y explicaciones sobre el clima. Nadie entendió si había o no servicio.',
    '<b>Versión corregida, tres frases</b>: “El río está en nivel rojo desde ayer. No hay despachos hasta nuevo aviso. Les confirmamos la reanudación por este mismo grupo.”',
    'Nadie preguntó nada más: el mensaje ya respondía todo.',
    'Y el nivel rojo comunicó la gravedad sin necesidad de argumentar.'],
   m:'Tres frases y un color. Lo que la gente teme no es la mala noticia: es <b>no saber a qué atenerse</b>.'},
  {t:'“Eso de los cascos es plata perdida”',c:'El dueño de un entable le dice eso al técnico, delante de los trabajadores.',
   p:['<b>Reacción común</b>: citar la norma y la multa. El dueño se cierra y el técnico queda como el que viene a estorbar.',
    '<b>Jugada 1</b>: “entiendo que ahorita el precio del oro está bajo y todo gasto pesa”.',
    '<b>Jugada 2</b>: “un golpe en la cabeza incapacita mínimo 15 días. ¿Cuánto produce este entable en 15 días sin ese hombre?”',
    '<b>Jugada 3</b>: “empecemos por los dos puestos de más riesgo. Si en dos meses no hubo problema, seguimos con el resto.”',
    'Aceptó los dos primeros cascos. Al mes compró los demás.'],
   m:'El dueño no compró seguridad: compró <b>no parar la producción</b>. Hablarle en su interés no es ceder — es la única forma de que se mueva.'},
  {t:'El compañero que no quería reportar',c:'Un trabajador ve una condición insegura pero no quiere reportarla: “eso es sapear al compañero”.',
   p:['El técnico no discutió la palabra. Reconoció el interés: nadie quiere quedar mal con su grupo.',
    'Puso un dato: el reporte no lleva nombres de personas, describe condiciones.',
    'Propuso un intercambio: “repórtelo conmigo, yo lo presento como hallazgo de la inspección”.',
    'A los dos meses el mismo trabajador reportaba solo.'],
   m:'Casi siempre la resistencia no es a la seguridad: es al costo social de hablar. <b>Quítele ese costo y la gente reporta.</b>'}
 ],
 taller:{t:'Alerta semaforizada y simulación de negociación',modo:'Individual y parejas · 55 minutos',
  pasos:['<b>Parte 1</b>: elija un riesgo real de su empresa y redacte la alerta en <b>exactamente tres frases</b>, clasificada en verde, amarillo o rojo.',
   'Prohibido: “por motivos ajenos a nuestra voluntad”, “lamentamos informar” y contar dificultades propias.',
   'Páselo a su pareja: si tiene que <b>preguntar algo</b> para entenderlo, el mensaje falló y se reescribe.',
   'Adáptelo a dos formatos: el <b>aviso para pegar</b> en el sitio y el <b>mensaje de WhatsApp</b>. Deben decir lo mismo.',
   '<b>Parte 2 — simulación</b>, 3 minutos frente al grupo: A es técnico en SST; B es el dueño o el trabajador que se resiste.',
   'A debe lograr un acuerdo intermedio con las tres jugadas. Prohibido amenazar con la ley en la primera frase, rogar o rendirse.',
   'El grupo identifica en qué segundo estuvo a punto de romperse y qué frase la recuperó.'],
  logro:'La alerta cabe en tres frases con su nivel, y en la simulación se logró un acuerdo intermedio sin amenazas.'},
 tarea:'Entregue la <b>alerta en sus dos versiones</b>. Si la empresa lo autoriza, publique el aviso y mande la foto. Grabe además con el celular un <b>primer ensayo en video</b> de su charla de seguridad, máximo 3 minutos: véalo usted mismo —eso es lo incómodo y lo útil— y anote tres cosas que va a mejorar para la versión definitiva.',
 recursos:[{i:'🎓',t:'Cómo dar charlas de seguridad eficaces',d:'Errores frecuentes y cómo generar participación real',u:'https://www.safetynova.com/charlas/como-dar-charlas-de-seguridad-eficaces-en-solo-5-minutos/'}]},

{n:8,unidad:'PARCIAL FINAL · CIERRE',tema:'Feria de charlas de seguridad y parcial final',
 intro:'Último encuentro. Hoy presentan su charla ante el grupo, cae el <b>parcial final</b> y le entregan el trabajo a la empresa que les abrió las puertas. Su trabajo de clase deja de ser trabajo de clase.',
 objetivo:'Presentar la charla de seguridad definitiva ante el grupo, demostrar el dominio de la Unidad 3 y <b>entregar el material a la empresa</b> acompañada durante el curso.',
 contenido:[
  {t:'Qué se evalúa hoy',
   tabla:{c:['Criterio','Qué se mira','Peso'],
    f:[['<b>Estructura</b>','Que la charla tenga los cuatro momentos','25%'],
       ['<b>Sustento</b>','Que el riesgo y las medidas sean reales y verificables','25%'],
       ['<b>Oralidad</b>','Claridad, tono y no verbal — la rúbrica del encuentro 2','25%'],
       ['<b>Entrega a la empresa</b>','Que el material haya vuelto a quien lo hizo posible','25%']]},
   p:'El último criterio <b>vale puntos</b>, no es simbólico. Este curso no termina cuando yo califico: termina cuando la empresa recibe algo que le sirve.'},
  {t:'Qué se le entrega a la empresa',
   lista:['El <b>guion de la charla</b> en una página, para que otro la pueda dictar.',
    'El <b>aviso de riesgo</b> reescrito en lenguaje claro, listo para imprimir y pegar.',
    'La <b>hoja resumen</b> del documento técnico, con lo esencial de la ficha de seguridad.',
    'El <b>reporte de condición insegura</b> con su recomendación, responsable y fecha.']},
  {t:'Dónde va a volver a usar esto',
   lista:['En <b>Clasificación de Riesgos</b>: la matriz se sustenta por escrito y se socializa hablando.',
    'En <b>Legislación en SST</b>: leer una norma es exactamente la lectura en tres niveles de hoy.',
    'En <b>Prácticas Profesionales</b>: lo primero que le van a pedir es dictar una charla y entregar un informe.',
    'Y en su primer empleo: la charla de 5 minutos de hoy es la misma que va a dictar el lunes que entre a trabajar.']}
 ],
 ejemplos:[
  {t:'La presentación que se cayó en la primera pregunta',c:'Un estudiante presenta muy bien: buena voz, buena postura. Le preguntan “¿y ese dato de dónde sale?” y se queda callado.',
   p:['Había dicho que “la mayoría de los trabajadores no usa protección”. Sonaba convincente.',
    'Nunca lo midió: era una impresión.',
    'Con esa pregunta, <b>todo lo demás quedó bajo sospecha</b>.',
    'Lo que debió responder: “es una observación mía, no un conteo. Lo que sí verifiqué fue…”.'],
   m:'Un dato sin origen contamina toda la presentación. Es mejor tener <b>tres datos verificados</b> que diez cifras que suenan bien.'},
  {t:'El guion que se quedó en la empresa',c:'Una estudiante entregó su guion de charla al dueño de un taller. Meses después seguía usándose.',
   p:['El dueño lo fotocopió y se lo daba al encargado de turno cada lunes.',
    'No era un documento perfecto: era <b>una hoja que cualquiera podía leer y dictar</b>.',
    'Cuando llegó una visita de la ARL, esa hoja y las firmas fueron la evidencia de capacitación.',
    'El taller salió bien de la visita con un trabajo hecho por una estudiante de este curso.'],
   m:'Lo que ustedes producen no es un ejercicio académico: es documentación real que puede proteger a una empresa y a sus trabajadores.'},
  {t:'De marzo a hoy',c:'En el primer encuentro quedó una pregunta: el trabajador que no entendió la instrucción y se accidentó, ¿de quién fue la culpa?',
   p:['En marzo la respuesta del grupo fue “del trabajador, por no poner atención”.',
    'En el encuentro 1 aprendieron a decir que falló <b>el canal y el ruido</b>, no la persona.',
    'En el 2 supieron que sin registro no se puede sustentar nada ante la ARL.',
    'En el 5 vieron cómo un “se revisará” sin sujeto deja un extintor sin revisar.',
    'Y hoy pueden escribir un aviso de dos frases que <b>no se puede entender de otra manera</b>.'],
   m:'Esa es la distancia que recorrieron. No aprendieron a hablar bonito: aprendieron a que las cosas queden claras — que en SST es la diferencia entre un accidente y un susto.'}
 ],
 taller:{t:'Feria de charlas y entrega final',modo:'Grupo completo · 60 minutos',
  pasos:['Presentación de la charla definitiva, <b>5 minutos por estudiante</b>, cronometrados.',
   'El grupo actúa como cuadrilla: hace una pregunta a cada expositor, de las que haría un trabajador escéptico.',
   'El expositor responde. Si no sabe, lo dice y explica cómo lo averiguaría. <b>Inventar un dato descalifica.</b>',
   'Evaluación con los cuatro criterios de hoy.',
   'Votación de las tres mejores charlas.',
   'Preparación del paquete para la empresa: guion, aviso, hoja resumen y reporte.'],
  logro:'Presentó la charla completa en cinco minutos, respondió sin inventar datos, y tiene el paquete listo para entregar.'},
 tarea:'Lleve esta semana el paquete al dueño o encargado de la empresa: guion de la charla, aviso reescrito, hoja resumen y reporte. Explíquelo en dos minutos y <b>dígale que el material es de él</b>. Pida una <b>constancia</b>: una foto de la entrega, un mensaje suyo o su firma en el reporte, y envíemela por correo. Y guarde su guion: lo va a necesitar antes de lo que cree.',
 recursos:[{i:'📚',t:'54 charlas de seguridad de 5 minutos',d:'Compilado clásico para tener temas listos todo el año',u:'https://es.slideshare.net/slideshow/54-charlas-de-seguridad-5-minutospdf-260268352/260268352'}],
 parcial:'p3'}
];

const PARCIALES={
 p1:{titulo:'Parcial primer corte',cubre:'Encuentros 1 y 2 · Comunicación y oralidad',min:20,
  rubrica:[['Los seis elementos del proceso comunicativo','4 preguntas','40%'],
           ['El ruido y sus tipos','3 preguntas','30%'],
           ['Canal, evidencia y redacción de avisos','3 preguntas','30%']],
  preguntas:[
   {q:'Un encargado da una instrucción de seguridad junto a una máquina encendida y el trabajador entiende mal. ¿Qué elemento del proceso comunicativo falló principalmente?',
    o:['El receptor, por no poner atención','El ruido, en su forma física','El mensaje, por estar mal redactado','El emisor, por no tener autoridad'],r:1,
    e:'El motor encendido es ruido físico: distorsiona el mensaje antes de que llegue. Culpar al receptor impide corregir la causa real.'},
   {q:'Un aviso dice “utilícese protección respiratoria homologada en zonas de amalgamación” y los trabajadores no lo entienden. ¿Qué pieza está fallando?',
    o:['El canal','El código','El emisor','El receptor'],r:1,
    e:'El código es el sistema de signos compartido. Si el técnico usa palabras que la cuadrilla no maneja, el mensaje viaja completo pero llega ininteligible.'},
   {q:'¿Cuál de estas afirmaciones sobre el ruido es correcta?',
    o:['El ruido es únicamente el sonido ambiental que impide oír','El afán y el cansancio también son ruido, porque impiden procesar el mensaje','El ruido solo afecta a la comunicación oral, no a la escrita','El ruido desaparece si el emisor habla más fuerte'],r:1,
    e:'Existe el ruido de contexto: el mensaje llega pero nadie lo procesa. Es de los más frecuentes al final de la jornada.'},
   {q:'En una advertencia de riesgo, ¿quién cumple el papel de receptor?',
    o:['El técnico en SST que la emite','El trabajador que va a ejecutar la tarea','El letrero donde está escrita','La norma que la respalda'],r:1,
    e:'El receptor es quien recibe e interpreta el mensaje. Identificarlo bien es lo que permite ajustar el código y el canal.'},
   {q:'¿Por qué una advertencia dada solo de viva voz es riesgosa para la empresa?',
    o:['Porque la voz se distorsiona con la distancia','Porque no deja evidencia y no se puede sustentar ante la ARL tras un incidente','Porque la ley prohíbe las advertencias verbales','Porque los trabajadores no atienden lo que se dice hablando'],r:1,
    e:'La voz directa es el canal más rápido y el que menos evidencia deja. Después de un incidente hay versiones distintas y sin registro no se puede demostrar nada.'},
   {q:'¿Cuál de estos canales ofrece la mayor evidencia para sustentar una capacitación?',
    o:['La nota de voz por WhatsApp','La conversación directa con el trabajador','El registro de asistencia firmado','El letrero pegado en la pared'],r:2,
    e:'El registro firmado indica tema, fecha, quién dictó y quiénes asistieron. Es lo único que queda cuando la memoria falla y hay presión.'},
   {q:'¿Cuál de estos avisos está mejor redactado según los criterios del curso?',
    o:['“Prohibido operar sin autorización. Riesgo mecánico.”','“Esta sierra corta un dedo en medio segundo. No meta la mano: use el empujador.”','“Se deberá utilizar el dispositivo de empuje conforme al procedimiento.”','“Peligro. Zona restringida.”'],r:1,
    e:'Dice qué puede pasar en lenguaje concreto y sobre todo dice qué hacer. Un aviso que solo prohíbe se ignora.'},
   {q:'Un trabajador no usa el casco porque le queda grande y se le cae al agacharse. ¿Cuál es la mejor actuación del técnico?',
    o:['Recordarle que es obligatorio y aplicar el llamado de atención','Preguntarle primero por qué no lo usa y resolver la causa','Informar de inmediato al dueño para que lo sancione','Dejarlo así, porque es decisión del trabajador'],r:1,
    e:'Preguntar antes de ordenar convierte un pulso de autoridad en un problema técnico resoluble. Aquí la causa era una talla, no desobediencia.'},
   {q:'La regla práctica sobre la elección del canal dice que…',
    o:['Siempre debe usarse el canal más rápido disponible','Entre más grave el riesgo, más formal debe ser el canal','El canal escrito debe reservarse para la gerencia','Todos los canales tienen el mismo valor probatorio'],r:1,
    e:'Un “cuidado con ese cable” va por voz; una capacitación en alturas exige registro y firma. La gravedad define la formalidad.'},
   {q:'¿Cuál es la razón principal por la que el registro de una charla protege también al trabajador?',
    o:['Porque le permite cobrar el tiempo de la capacitación','Porque demuestra qué se le informó y qué medidas faltaban por tomar','Porque lo exime de responsabilidad en cualquier accidente','Porque le sirve como constancia laboral'],r:1,
    e:'El registro deja constancia de lo que se hizo y de lo que aún estaba pendiente. Eso protege a las dos partes, no solo a la empresa.'}
  ]},

 p2:{titulo:'Parcial segundo corte',cubre:'Encuentros 3, 4 y 5 · Comprensión lectora y escritura',min:20,
  rubrica:[['Tipos de texto y lectura de documentos técnicos','3 preguntas','30%'],
           ['Los tres niveles de lectura','3 preguntas','30%'],
           ['Proceso de escritura y gramática','4 preguntas','40%']],
  preguntas:[
   {q:'Una ficha de datos de seguridad, un procedimiento y el manual de una máquina son ejemplos de texto…',
    o:['Narrativo','Informativo','Instructivo','Argumentativo'],r:2,
    e:'Los textos instructivos dicen cómo hacer algo. En SST son los que más protegen y, paradójicamente, los que menos se leen completos.'},
   {q:'¿Cuál es la forma correcta de leer un documento técnico de seguridad?',
    o:['De corrido y completo, como cualquier texto','Buscando: qué me obliga, qué hago si algo sale mal, y qué no dice','Solo la primera página, que resume todo','Únicamente las secciones marcadas en rojo'],r:1,
    e:'Un texto técnico se lee buscando. Y lo que el documento no dice, frente a los riesgos que usted ve en el sitio, también es un hallazgo.'},
   {q:'Una ficha de datos de seguridad está archivada en inglés en la oficina, lejos del punto donde se usa el producto. ¿Cuál es el problema principal?',
    o:['Que la empresa incumple por no tener el documento','Que el documento existe pero no protege, porque no está donde ocurre el riesgo','Que debe traducirse el documento completo antes de usar el producto','Que la ficha pierde validez legal si no está en español'],r:1,
    e:'Un documento de seguridad lejos del riesgo no protege. Lo práctico es extraer lo esencial y ponerlo junto al producto.'},
   {q:'La ficha exige mascarilla con filtro, pero la empresa solo tiene tapabocas de tela. Concluir que “la empresa no está protegida” corresponde al nivel…',
    o:['Literal','Inferencial','Crítico','Descriptivo'],r:1,
    e:'El nivel inferencial deduce algo que el texto no dice de forma directa: cruza lo que exige el documento con lo que hay en el sitio.'},
   {q:'Decidir comprar primero la mascarilla y después los guantes, según los recursos disponibles, corresponde al nivel…',
    o:['Literal','Inferencial','Crítico','Textual'],r:2,
    e:'El nivel crítico toma posición y decide. Es donde la lectura se convierte en una acción concreta de gestión.'},
   {q:'¿Cuál es la regla que distingue una respuesta inferencial de una literal?',
    o:['La inferencial es más larga','La inferencial no puede estar copiada del texto: aporta algo que él no dice','La literal se escribe con las palabras propias','La inferencial siempre cita la norma'],r:1,
    e:'Si la respuesta está copiada del documento, es literal por definición. La inferencia deduce.'},
   {q:'Según las fases del proceso de escritura vistas en clase, ¿cuál toma menos tiempo del total?',
    o:['Planificar','Textualizar','Revisar','Todas por igual'],r:1,

function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(36).toUpperCase()}
const SEC='UNICARIBE-CDI-2026';
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function mkCod(o){const p=[o.nombre,o.correo,o.parcial,o.intento,o.ok,o.tot,o.nota,o.fecha].join('|');return fnv(p+SEC)+'.'+b64e(p)}
function verif(){
 const c=(document.getElementById('cv').value||'').trim(),r=document.getElementById('cr'),pt=c.split('.');
 if(pt.length!==2){r.innerHTML='<b style="color:var(--mal)">Código con formato inválido.</b>';return}
 let p;try{p=b64d(pt[1])}catch(e){r.innerHTML='<b style="color:var(--mal)">No se pudo leer el código.</b>';return}
 const ok=fnv(p+SEC)===pt[0],f=p.split('|');
 r.innerHTML=ok?`<div style="background:#E9F9F0;border:1px solid var(--ver);border-radius:11px;padding:14px">
   <b style="color:var(--ver)">✅ Constancia auténtica — no fue alterada</b>
   <div style="margin-top:8px;font-size:13.5px;line-height:1.7"><b>Estudiante:</b> ${esc(f[0])}<br><b>Correo:</b> ${esc(f[1])}<br>
   <b>Parcial:</b> ${esc(PARCIALES[f[2]]?PARCIALES[f[2]].titulo:f[2])}<br><b>Intento:</b> ${esc(f[3])}<br>
   <b>Aciertos:</b> ${esc(f[4])} de ${esc(f[5])}<br><b>NOTA:</b> <span style="font-size:19px;font-weight:700;color:var(--mor)">${esc(f[6])}</span><br>
   <b>Fecha:</b> ${esc(f[7])}</div></div>`
  :`<div style="background:#FCE9E9;border:1px solid var(--mal);border-radius:11px;padding:14px">
   <b style="color:var(--mal)">⚠️ Código alterado o inválido.</b><div style="margin-top:6px;font-size:13.5px">No acepte este resultado; pida que vuelva a presentar.</div></div>`;
 ok?sOk():osc(180,0,.4,'sawtooth',.45);
}

/* ==========================================================
   INGRESO CON GOOGLE
   El estudiante entra con la cuenta de Google que ya tiene
   abierta en su equipo. No hay contraseñas que olvidar.
   ========================================================== */
const CORREO_CC='inbox.nativo@gmail.com';
let GSI_LISTO=false;

function payloadJWT(t){
  try{
    const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}
const normCorreo=c=>String(c||'').trim().toLowerCase();

function esDocente(correo){
  const lista=(CFG&&CFG.docentes)?CFG.docentes:[CORREO_DOC];
  return lista.map(normCorreo).includes(normCorreo(correo));
}
function buscarPorCorreo(correo){
  const c=normCorreo(correo);
  return ESTUDIANTES.find(e=>normCorreo(e.c)===c);
}

function montarIngreso(){
  const cid=CFG&&CFG.google_client_id;
  const zona=document.getElementById('zonaIngreso');
  if(!zona) return;

function esperarGSI(cid,intentos){

      google.accounts.id.initialize({client_id:cid,callback:llegoGoogle,auto_select:false,cancel_on_tap_outside:true});

  if(!d||!d.email){ err('No se pudo leer la cuenta de Google. Intente otra vez.'); return; }
  if(d.email_verified===false){ err('Esa cuenta de Google no está verificada.'); return; }

  if(esDocente(d.email)){
    ST.u={u:'docente',n:d.name||'Docente',c:d.email};
    ST.esDoc=true; abrirApp(); return;

  const al=buscarPorCorreo(d.email);

    err('El correo '+d.email+' no está en la lista de este curso. Escríbale al docente indicándole exactamente ese correo.');

  if(!c||!c.apiKey) return false;
  const versiones=[CFG.firebase_sdk,'12.19.0','12.18.0','11.10.0'].filter(Boolean);
  for(const v of versiones){
    try{
      const app=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const auth=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);

      FBA.languageCode='es';
      FBLISTO=true;
      return true;
    }catch(e){ /* se intenta la siguiente versión */ }

}

/* ---------- autorización contra la hoja de Google ---------- */
function jsonpPuente(url,payload){
  return new Promise((res,rej)=>{
    const cb='ac'+Date.now()+Math.floor(Math.random()*9999);
    const sc=document.createElement('script'); let listo=false;
    const limpiar=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();};
    const tm=setTimeout(()=>{if(listo)return;limpiar();rej(new Error('tiempo'));},20000);
    window[cb]=j=>{listo=true;limpiar();res(j);};
    sc.onerror=()=>{if(listo)return;limpiar();rej(new Error('red'));};
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&d='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(sc);
  });
}
async function pedirAcceso(correo,nombre){
  const c=normCorreo(correo);
  if(esDocente(c)){ ST.u={u:c,n:nombre||'Docente',c}; ST.esDoc=true; abrirApp(); return; }

  const puente=CFG&&CFG.puente_url;
  if(!puente){
    // Sin puente configurado se usa la lista incrustada en el archivo.
    const al=buscarPorCorreo(c);
    if(!al){ errFB('El correo '+c+' no está en la lista de este curso. Escríbale al docente.'); salirFB(); return; }
    ST.u=al; ST.esDoc=false; abrirApp(); return;
  }
  okFB('Verificando su autorización…');
  try{
    const j=await jsonpPuente(puente,{accion:'acceso',clave:CFG.clave_publica||'',
      datos:{curso:CODIGO,correo:c,nombre:nombre||''}});
    if(!j||!j.ok){ errFB('No se pudo verificar su acceso. Intente de nuevo.'); salirFB(); return; }
    if(j.estado==='aprobado'){
      ST.u={u:c,n:j.nombre||nombre||c,c}; ST.esDoc=false; abrirApp(); return;
    }
    if(j.estado==='rechazado'){ errFB('Su solicitud fue rechazada. Hable con el docente.'); salirFB(); return; }
    pantallaEspera(c);
  }catch(e){
    errFB('No se pudo contactar el sistema de autorización. Intente más tarde.');
    salirFB();
  }
}
