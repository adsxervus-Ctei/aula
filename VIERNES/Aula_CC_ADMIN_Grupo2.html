<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aula · Competencias Comunicativas · Procesos Administrativos · UNICARIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mor:#5C2483;--mor2:#3B1557;--morcl:#F3EDF8;--ver:#00A551;--nar:#F9A01B;--ama:#FFC72C;
 --tin:#241833;--sua:#5C5470;--lin:rgba(92,36,131,.15);--gris:#F6F4F9;--mal:#D64545;
 --fd:'Poppins',sans-serif;--fb:'Inter',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--gris);color:var(--tin);-webkit-font-smoothing:antialiased}

/* LOGIN */
#lg{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
 background:linear-gradient(140deg,var(--mor2),var(--mor) 55%,#7A35A8)}
#lg::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(249,160,27,.13);top:-180px;right:-160px}
#lg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(0,165,81,.12);bottom:-140px;left:-120px}
.lgc{background:#fff;border-radius:22px;padding:34px 32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.34);position:relative;z-index:2;animation:up .6s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.lgc img{width:186px;display:block;margin:0 auto 16px}
.lgc h1{font-family:var(--fd);font-size:20px;margin:0 0 4px;text-align:center;font-weight:600}
.lgc .s{font-size:13.5px;color:var(--sua);text-align:center;margin-bottom:20px;line-height:1.5}
label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mor);font-weight:700;margin-bottom:5px}
.inp{width:100%;font-family:var(--fb);font-size:15px;padding:12px 14px;border:1.5px solid var(--lin);border-radius:11px;margin-bottom:13px;transition:.15s}
.inp:focus{outline:none;border-color:var(--mor);box-shadow:0 0 0 3px rgba(92,36,131,.12)}
.inp.mono{font-family:var(--fm);letter-spacing:.09em;text-transform:uppercase}
.err{color:var(--mal);font-size:13px;margin:-6px 0 12px;display:none;background:#FCE9E9;padding:9px 12px;border-radius:9px}
.lk{display:block;text-align:center;font-size:12.5px;color:var(--mor);margin-top:13px;cursor:pointer;text-decoration:underline}

/* APP */
#ap{display:none;min-height:100vh}
#ap.on{display:flex}
.side{width:255px;flex:0 0 255px;background:var(--mor);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:90}
.side .lo{background:#fff;padding:15px;border-bottom:4px solid var(--nar);position:relative}
.side .lo img{width:100%;display:block}
.cls{display:none;position:absolute;top:7px;right:7px;background:var(--mor);color:#fff;border:none;width:31px;height:31px;border-radius:9px;font-size:15px;cursor:pointer}
.me{padding:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.me .r{display:flex;gap:11px;align-items:center}
.me .av{width:42px;height:42px;border-radius:50%;background:var(--ama);color:var(--mor2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;flex:0 0 auto}
.me .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.me .us{font-family:var(--fm);font-size:10.5px;color:rgba(255,255,255,.68)}
.pr{margin-top:12px}
.pr .b{height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.pr .b i{display:block;height:100%;background:linear-gradient(90deg,var(--ver),var(--ama));border-radius:5px;transition:width .5s}
.pr .t{font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.72);margin-top:5px}
.side nav{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nb{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:rgba(255,255,255,.86);font-family:var(--fb);font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nb:hover{background:rgba(255,255,255,.13)}
.nb.on{background:#fff;color:var(--mor);font-weight:600}
.nb .ic{font-size:15px}
.sep{font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ama);padding:12px 11px 5px;font-weight:600}
.side .ft{padding:13px 15px 17px;border-top:1px solid rgba(255,255,255,.15)}
.side .ft .fi{background:#fff;border-radius:9px;padding:5px 7px;margin-bottom:8px}
.side .ft .fi img{width:100%;max-height:50px;object-fit:contain;display:block}
.side .ft p{margin:0;font-size:11px;color:rgba(255,255,255,.72);line-height:1.55}
.side .ft b{display:block;color:#fff;font-size:12px}
.sb{margin-top:9px;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;font-family:var(--fm);font-size:10.5px;padding:7px;border-radius:8px;cursor:pointer}
.sb:hover{background:rgba(255,255,255,.26)}
main{flex:1;min-width:0;padding-bottom:50px}
.top{background:#fff;border-bottom:1px solid var(--lin);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:60}
.tl{display:flex;align-items:center;gap:11px;min-width:0}
.tlogo{display:none;height:28px}
.burg{display:none;background:var(--mor);color:#fff;border:none;border-radius:9px;width:38px;height:36px;font-size:16px;cursor:pointer}
.t1{font-family:var(--fd);font-weight:600;font-size:14.5px}
.t2{font-family:var(--fm);font-size:10.5px;color:var(--sua)}
.wr{max-width:1020px;margin:0 auto;padding:24px 26px}
.rin{opacity:0;transform:translateY(15px);animation:ri .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes ri{to{opacity:1;transform:translateY(0)}}

/* AULA */
.hd{background:linear-gradient(120deg,var(--mor),var(--mor2));color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(249,160,27,.2);animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
.hd h1{font-family:var(--fd);font-size:clamp(20px,3vw,28px);margin:0 0 7px;font-weight:600;position:relative}
.hd p{margin:0;font-size:14.5px;color:rgba(255,255,255,.87);line-height:1.6;max-width:60ch;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.cw{background:#fff;border:1px solid var(--lin);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;display:flex;flex-direction:column}
.cw:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(92,36,131,.14)}
.cw.bl{opacity:.6;cursor:not-allowed}.cw.bl:hover{transform:none;box-shadow:none}
.cw .bn{height:78px;background:linear-gradient(120deg,var(--mor),#7A35A8);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#fff}
.cw.u2 .bn{background:linear-gradient(120deg,#0E7A52,var(--ver))}
.cw.u3 .bn{background:linear-gradient(120deg,#B06E00,var(--nar))}
.cw .bn .n{font-family:var(--fd);font-size:31px;font-weight:700;line-height:1}
.cw .bn .st{font-size:21px}
.cw .bd{padding:14px 17px 17px;flex:1;display:flex;flex-direction:column}
.cw h3{font-family:var(--fd);font-size:15px;margin:0 0 6px;font-weight:600;line-height:1.3}
.cw p{margin:0;font-size:12.5px;color:var(--sua);line-height:1.5;flex:1}
.cw .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-family:var(--fm);font-size:9.5px;background:var(--morcl);color:var(--mor);padding:4px 8px;border-radius:12px;font-weight:600}
.tag.n{background:#FFF3DC;color:#9A6100}
.tag.v{background:#E3F6EC;color:#046B36}

/* SEMANA */
h2.sc{font-family:var(--fd);font-weight:600;font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sc::before{content:'';width:5px;height:20px;background:var(--nar);border-radius:3px}
.cd{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.cd h3{font-family:var(--fd);font-size:16px;margin:0 0 9px;font-weight:600}
.cd p{margin:0 0 8px;font-size:14.5px;line-height:1.62;color:var(--sua)}
.cd p:last-child{margin:0}
.cd b{color:var(--tin)}
ul.pt{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
ul.pt li{font-size:14.5px;line-height:1.55;color:var(--sua)}
ul.pt li b{color:var(--tin)}
.ob{background:var(--mor);color:#fff;border-radius:14px;padding:18px 21px}
.ob .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ama);font-weight:600;margin-bottom:5px}
.ob p{margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.95)}
.tw{overflow-x:auto;border-radius:10px}
.tw::-webkit-scrollbar{height:7px}.tw::-webkit-scrollbar-thumb{background:var(--lin);border-radius:5px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;min-width:470px}
table.tb th{background:var(--mor);color:#fff;text-align:left;padding:9px 12px;font-family:var(--fm);font-size:10px;text-transform:uppercase;white-space:nowrap}
table.tb td{border:1px solid var(--lin);padding:9px 12px;line-height:1.5;vertical-align:top}
table.tb tr:nth-child(even) td{background:var(--morcl)}
.th{display:none;font-family:var(--fm);font-size:10.5px;color:var(--sua);margin-top:5px}
.vd{background:#000;border-radius:14px;overflow:hidden;position:relative;padding-top:56.25%}
.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{font-size:12.5px;color:var(--sua);margin-top:7px;line-height:1.5}
.ejc{background:#fff;border:1px solid var(--lin);border-left:5px solid var(--ver);border-radius:0 14px 14px 0;padding:16px 19px;margin-bottom:11px;transition:.2s}
.ejc:hover{transform:translateX(4px)}
.ejc .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ver);font-weight:600}
.ejc h3{font-family:var(--fd);font-size:16px;margin:5px 0 7px;font-weight:600}
.ejc p{margin:0 0 7px;font-size:14px;line-height:1.58;color:var(--sua)}
.ejc ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ejc li{font-size:13.5px;line-height:1.5;color:var(--sua)}
.tl2{background:linear-gradient(135deg,#FFF8EC,#FFF1D6);border:1px solid rgba(249,160,27,.42);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.tl2 .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A6100;font-weight:700}
.tl2 h3{font-family:var(--fd);font-size:17px;margin:5px 0 3px;font-weight:600;color:#5A3A00}
.tl2 .m{font-family:var(--fm);font-size:11px;color:#9A6100;margin-bottom:9px}
.tl2 ol{margin:0 0 9px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tl2 li{font-size:14px;line-height:1.55;color:#4A3200}
.tl2 .lo{background:rgba(255,255,255,.8);border-radius:9px;padding:9px 12px;font-size:13px;color:#5A3A00}
.rcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}
.rc{display:flex;gap:11px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:13px 15px;text-decoration:none;color:inherit;transition:.16s}
.rc:hover{border-color:var(--mor);transform:translateY(-3px)}
.rc .i{width:31px;height:31px;border-radius:9px;background:var(--morcl);color:var(--mor);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rc b{display:block;font-size:13.5px}.rc span{display:block;font-size:12px;color:var(--sua);line-height:1.45;margin-top:2px}
.dn{background:linear-gradient(135deg,#E9F9F0,#DCF5E8);border:1.5px solid rgba(0,165,81,.4);border-radius:14px;padding:19px 22px;margin-top:20px;text-align:center}
.dn h3{font-family:var(--fd);font-size:16.5px;margin:0 0 6px;color:#046B36;font-weight:600}
.dn p{margin:0 0 13px;font-size:14px;color:#0A5B31;line-height:1.55}
.nv{display:flex;justify-content:space-between;gap:11px;margin-top:24px}
.bt{font-family:var(--fd);font-weight:600;font-size:14px;border:none;border-radius:10px;padding:12px 19px;cursor:pointer;background:var(--mor);color:#fff;transition:.16s}
.bt:hover:not(:disabled){background:var(--mor2);transform:translateY(-1px)}
.bt:disabled{opacity:.34;cursor:not-allowed}
.bt.g{background:#fff;color:var(--mor);border:1px solid var(--lin)}
.bt.v{background:var(--ver)}.bt.n{background:var(--nar);color:#3B1557}
.bt.big{font-size:15.5px;padding:14px 27px}
.bl2{background:#FFF3DC;border:1px solid var(--nar);border-radius:14px;padding:22px 26px;text-align:center}
.bl2 .i{font-size:38px}.bl2 h3{font-family:var(--fd);font-size:18px;margin:8px 0 6px;color:#7A4E00}
.bl2 p{margin:0;font-size:14px;color:#8A5A00;line-height:1.6}
.pxb{background:linear-gradient(120deg,var(--nar),#E08600);color:#3B1557;border-radius:16px;padding:22px 25px;margin-top:19px}
.pxb h3{font-family:var(--fd);font-size:20px;margin:0 0 6px;font-weight:700}
.pxb p{margin:0 0 12px;font-size:14px;line-height:1.55}

/* PROGRESO */
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.kp{background:var(--mor);color:#fff;border-radius:14px;padding:16px 19px}
.kp b{display:block;font-family:var(--fd);font-size:29px;line-height:1}
.kp span{font-family:var(--fm);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.82}
.kp.v{background:var(--ver)}.kp.n{background:var(--nar);color:#3B1557}
.lr{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.lr .n{font-family:var(--fm);font-weight:700;font-size:12px;background:var(--morcl);color:var(--mor);padding:5px 9px;border-radius:7px}
.lr .t{flex:1;font-size:14px}
.lr .s{font-family:var(--fm);font-size:12px}

/* MODALES / QUIZ */
.md{position:fixed;inset:0;background:rgba(36,24,51,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md .bx{background:#fff;border-radius:18px;max-width:800px;width:100%;padding:26px 28px;max-height:93vh;overflow-y:auto;animation:up .45s cubic-bezier(.2,.9,.25,1)}
.md h3{font-family:var(--fd);font-size:21px;margin:0 0 4px;font-weight:600}
.md .sb2{font-family:var(--fm);font-size:11.5px;color:var(--sua);margin-bottom:15px}
.cdn{position:fixed;inset:0;background:var(--mor);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cdn .n{font-family:var(--fd);font-size:clamp(88px,25vw,225px);font-weight:700;color:var(--ama);line-height:1;animation:pp .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pp{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.cdn .l{font-family:var(--fm);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px}
.qb{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:15px;flex-wrap:wrap}
.tm{font-family:var(--fm);font-size:24px;font-weight:600;background:var(--mor);color:#fff;padding:8px 14px;border-radius:10px}
.tm.w{background:var(--nar);color:#3B1557}.tm.c{background:var(--mal);color:#fff}
.tm.bt2{animation:bb .9s ease-in-out infinite}
@keyframes bb{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.09)}48%{transform:scale(1)}}
.pg{flex:1;min-width:100px;height:8px;background:var(--morcl);border-radius:5px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ver);border-radius:5px;transition:width .3s}
.qt{font-family:var(--fd);font-size:17.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.op{text-align:left;background:#fff;border:2px solid var(--lin);border-radius:11px;padding:12px 15px;font-family:var(--fb);font-size:14.5px;cursor:pointer;transition:.13s;display:flex;gap:10px;width:100%;margin-bottom:8px}
.op:hover{border-color:var(--mor);background:var(--morcl);transform:translateX(3px)}
.op .l{font-family:var(--fm);font-weight:600;color:var(--mor);flex:0 0 auto}
.rs{text-align:center}
.rs .nt{font-family:var(--fd);font-size:70px;font-weight:700;line-height:1;animation:pp .6s cubic-bezier(.2,1.3,.4,1)}
.rs .nt.o{color:var(--ver)}.rs .nt.m{color:var(--mal)}
.rs .ms{font-size:14.5px;color:var(--sua);margin:6px 0 15px}
.rv{text-align:left;margin-top:17px;border-top:1px solid var(--lin);padding-top:13px}
.rv .it{padding:10px 0;border-bottom:1px solid var(--lin);font-size:13.5px;line-height:1.55}
.rv .it:last-child{border:none}
.rv .s2{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:7px}
.rv .s2.o{background:#E3F6EC;color:var(--ver)}.rv .s2.m{background:#FCE9E9;color:var(--mal)}
.rv .ex{color:var(--sua);margin-top:4px;font-size:13px}
.av2{background:var(--morcl);border:1px solid var(--lin);border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.55;color:var(--sua);margin-top:12px}
.av2 b{color:var(--mor)}
.cod{font-family:var(--fm);font-size:11px;background:#241833;color:#7CFFB2;padding:11px 13px;border-radius:9px;word-break:break-all;line-height:1.5;margin-top:10px}
.wr2{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--lin);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.wr2 input{width:17px;height:17px;accent-color:var(--mor)}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--mor2);color:#fff;padding:13px 21px;border-radius:12px;font-size:14px;z-index:350;opacity:0;transition:.35s;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);width:268px}
 .side.abierta{transform:translateX(0);box-shadow:14px 0 44px rgba(0,0,0,.32)}
 .cls,.burg,.tlogo{display:block}
 .t1,.t2{display:none}
 .wr{padding:17px 14px}.top{padding:9px 13px}
 .hd{padding:21px 19px}.md .bx{padding:19px 15px}
 .th{display:block}
 .nv{flex-direction:column}.nv .bt{width:100%}
 .grid{grid-template-columns:1fr}
}
@media print{
 .side,.top,.nv,.pxb,.dn,#lg{display:none!important}
 body{background:#fff}.wr{max-width:100%;padding:0}.vd{display:none}
}

.tabf{flex:1;border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:9px 6px;border-radius:10px;cursor:pointer;color:var(--sua);transition:.16s}
.tabf.on{background:#fff;color:var(--mor);box-shadow:0 2px 8px rgba(92,36,131,.14)}
#lg .lgc{max-width:430px}
</style>

</head>
<body>

{n:1,unidad:'UNIDAD 1 · COMUNICACIÓN Y ORALIDAD',tema:'El negocio se gana o se pierde hablando',
 intro:'Bienvenidos. Un negocio pequeño rara vez quiebra por falta de clientes: quiebra por pedidos que llegaron mal, deudas que nadie cobró y acuerdos que nadie escribió. Todo eso es comunicación. En este encuentro le ponemos nombre técnico a lo que ustedes ya hacen todos los días.',
 objetivo:'Reconocer la comunicación como herramienta de gestión e identificar los <b>seis elementos del proceso comunicativo</b> en transacciones comerciales reales del municipio.',
 contenido:[
  {t:'Por qué esta asignatura abre el programa',
   p:'Un técnico en procesos administrativos pasa el día comunicando: atiende, pide, cobra, informa y negocia.',
   lista:['<b>Hablar</b>: atender al cliente, inducir a un empleado nuevo, sustentar una decisión ante el dueño.',
    '<b>Escribir</b>: pedidos, cotizaciones, cartas de cobro, actas, informes. <b>Lo que no queda escrito no se puede cobrar ni reclamar.</b>',
    '<b>Convencer</b>: al proveedor que no da plazo, al cliente que debe hace tres meses, al socio que no está de acuerdo.',
    'En su primer trabajo nadie le va a pedir que recite teoría administrativa. Le van a pedir que <b>atienda bien</b> y que <b>entregue un informe</b>.']},
  {t:'Los seis elementos del proceso comunicativo',
   p:'Cuando algo falla en un negocio, casi nunca falla “la comunicación” en general: falla <b>una pieza específica</b>.',
   tabla:{c:['Elemento','Qué es','En una venta de tienda'],
    f:[['<b>Emisor</b>','Quien produce el mensaje','El cliente que pide'],
       ['<b>Receptor</b>','Quien lo recibe e interpreta','El tendero que atiende'],
       ['<b>Mensaje</b>','La información que se transmite','“Deme dos bultos de arroz”'],
       ['<b>Canal</b>','El medio por donde viaja','La voz, el WhatsApp, el papel'],
       ['<b>Código</b>','El sistema compartido de signos','El idioma, los gestos, los precios escritos'],
       ['<b>Ruido</b>','Todo lo que distorsiona','El bullicio, la mala señal, el afán']]}},
  {t:'El ruido no es solo bulla',
   p:'Esta es la pieza que más se malentiende, y en un negocio es la que más plata cuesta.',
   lista:['<b>Ruido físico</b>: la bulla del mercado, la mala señal, el motor de la planta eléctrica.',
    '<b>Ruido del canal</b>: la nota de voz que se corta, el mensaje que llega incompleto.',
    '<b>Ruido de código</b>: usar palabras que el otro no maneja. Decir “el flete va FOB” a quien nunca oyó ese término.',
    '<b>Ruido de contexto</b>: el afán, el cansancio, atender a tres personas al tiempo. El mensaje llega y nadie lo procesa.']}
 ],
 demoRuido:true,
 ejemplos:[
  {t:'Los veinte bultos que nadie pidió',c:'El tendero de Barranco manda una nota de voz a su proveedor en El Banco pidiendo mercancía. Llegaron veinte bultos en vez de dos.',
   p:['<b>Canal</b>: nota de voz por WhatsApp. Rápido, cómodo, y el tendero lo hizo mientras atendía.',
    '<b>Ruido</b>: la bulla del local, la señal intermitente y el afán de estar atendiendo a otro cliente.',
    'El proveedor entendió “veinte” donde el tendero dijo “dos”. <b>Ninguno de los dos mintió.</b>',
    'Lo grave no fue el error: fue que después no hubo forma de demostrar qué se pidió.',
    'Terminaron partiendo la pérdida por la mitad, que es lo que suele pasar cuando no hay evidencia: pierden los dos.'],
   m:'Sin evidencia no gana quien tiene razón: gana quien tiene más aguante para discutir. Y eso desgasta la relación comercial, que es lo más valioso de un negocio pequeño.'},
  {t:'El pregonero de la plaza',c:'Alguien recorre la plaza con altavoz anunciando el precio del bocachico del día. Desarmemos la escena en sus seis piezas.',
   p:['<b>Emisor</b>: el pregonero. <b>Receptor</b>: todo el que pase por la plaza.',
    '<b>Mensaje</b>: el producto y su precio. <b>Canal</b>: la voz amplificada.',
    '<b>Código</b>: el español hablado más el conocimiento común de qué es un bocachico y qué precio es bueno.',
    '<b>Ruido</b>: la bulla del mercado, la distancia, el altavoz distorsionado.',
    'Ventaja: llega a mucha gente en segundos. Desventaja: <b>no queda nada</b> y nadie puede reclamar después por ese precio.'],
   m:'El pregón sirve para atraer al cliente, no para cerrar un negocio. Cada canal tiene aquello para lo que sirve.'},
  {t:'El aviso de precios de la tienda',c:'Una tienda escribe los precios en un cartón pegado en la pared. Un cliente reclama que le cobraron distinto.',
   p:['<b>Canal</b>: el escrito, que sí deja evidencia. Ahí está la fuerza del caso.',
    '<b>Ruido de código</b>: el cartón no decía si el precio era por unidad o por libra.',
    'Cada uno entendió lo que le pareció lógico, y los dos tenían argumento.',
    'La evidencia existía, pero era <b>ambigua</b>. Y una evidencia ambigua no protege a nadie.'],
   m:'No basta con dejar por escrito: hay que dejarlo por escrito <b>sin ambigüedad</b>. De eso trata el resto del semestre.'}
 ],
 taller:{t:'Desarmar dos transacciones reales',modo:'Parejas · 40 minutos',
  pasos:['<b>Caso A</b>: el pregonero de la plaza. Identifiquen los seis elementos.',
   '<b>Caso B</b>: la nota de voz del tendero a su proveedor. Identifiquen los seis elementos.',
   'En cada caso señalen <b>dónde está el ruido</b> y de qué tipo es.',
   'Comparen: ¿en cuál hay más riesgo de que se pierda información?',
   'Escriban en una frase la regla que se desprende: “para pedir mercancía yo usaría ___ porque ___”.',
   'Tres parejas socializan al frente, dos minutos cada una.'],
  logro:'Los seis elementos están identificados en ambos casos y la pareja tiene escrita su regla comercial.'},
 tarea:'Elija un <b>negocio real</b> de Barranco de Loba que pueda visitar: una tienda, un taller, un aserrío, una oficina, la JAC de su vereda. Levante su ficha —nombre, dueño, qué vende, a quién, cuántos trabajan— y pregunte <b>cómo hacen los pedidos a proveedores</b>. Traiga la respuesta textual del dueño. Ese negocio lo acompaña los 8 encuentros.',
 recursos:[{i:'🎓',t:'Protocolos de servicio al cliente · SENA',d:'Introducción del programa Técnico en Atención Integral al Cliente',u:'https://www.youtube.com/watch?v=VdBU-D7dDXg'}]},

{n:2,unidad:'UNIDAD 1 · COMUNICACIÓN Y ORALIDAD',tema:'El canal deja evidencia: TIC y trato con el cliente',
 intro:'Hoy vamos a lo que cuesta plata: <b>la evidencia</b>. Un pedido hecho por voz y uno hecho por escrito valen lo mismo mientras todo sale bien. El día que algo falla, valen cosas completamente distintas. Y después practicamos lo más difícil del mostrador: atender a alguien que llega reclamando.',
 objetivo:'Elegir el canal según lo que esté en juego, redactar un pedido que no deje dudas, y atender un reclamo sin perder al cliente ni regalar la mercancía.',
 contenido:[
  {t:'Cada canal sirve para algo distinto',
   tabla:{c:['Canal','Rapidez','Evidencia','Para qué sirve en un negocio'],
    f:[['<b>Voz directa</b>','Máxima','Ninguna','Atender al cliente, resolver en el momento'],
       ['<b>Nota de voz</b>','Alta','Débil: existe pero nadie la revisa','Explicar algo largo con confianza'],
       ['<b>Mensaje escrito</b>','Media','Buena: se lee y se archiva','Pedidos, plazos, cantidades y precios'],
       ['<b>Documento formal</b>','Baja','Máxima: sirve como prueba','Contratos, cobros, acuerdos con entidades']]},
   p:'Regla práctica: <b>entre más plata o más tiempo esté en juego, más formal debe ser el canal.</b> Un saludo va por voz; un pedido de un millón de pesos, por escrito.'},
  {t:'Un pedido que no deja dudas cabe en tres líneas',
   p:'Responde cinco preguntas. Si falta una, hay riesgo.',
   lista:['<b>Qué</b>: el producto exacto con su presentación. No “arroz”, sino “arroz Diana por libra”.',
    '<b>Cuánto</b>: la cantidad en número y en letra si importa. “2 (dos) bultos”.',
    '<b>Cuándo</b>: fecha y hora límite. No “lo más pronto”, sino “el jueves antes del mediodía”.',
    '<b>Dónde</b>: el sitio de entrega. Acá eso incluye si llega por el puerto o hasta el local.',
    '<b>A cuánto</b>: el precio acordado. Es lo que más se omite y lo que más problemas causa.']},
  {t:'Usted comunica antes de hablar',
   p:'La comunicación oral tiene dos capas simultáneas. Cuando se contradicen, la gente le cree a la segunda.',
   lista:['<b>Verbal</b>: las palabras que elige. Si fallan, el mensaje se entiende mal.',
    '<b>No verbal</b>: tono, postura, mirada, distancia. Si falla, el mensaje se entiende pero <b>no se cree</b>.',
    'Si usted dice “con mucho gusto le ayudo” sin levantar la vista del celular, el cliente oye el desinterés.',
    'Y hay un registro que hay que dominar: <b>cercano en el trato, firme en el contenido</b>. Es el que permite decir que no sin maltratar.']}
 ],
 video:{id:'VdBU-D7dDXg',t:'Protocolos de servicio al cliente · SENA',d:'Introducción a los protocolos de atención. Obsérvelo pensando en el negocio que eligió: ¿cuál de estos protocolos existe allí?'},
 demoPedido:true,
 ejemplos:[
  {t:'El fiado que quedó en la memoria',c:'Una tienda de vereda fía a sus clientes de confianza. Lo anota “de vez en cuando”. A fin de mes hay tres desacuerdos.',
   p:['El cliente recuerda haber pagado una parte; la tendera recuerda otra cifra. Los dos están siendo honestos.',
    'El problema no es la honestidad: es que la <b>memoria no es un sistema de registro</b>.',
    'Se pasó el fiado a un cuaderno con tres columnas: fecha, valor y firma del cliente.',
    'A los dos meses, cero desacuerdos. Y algo inesperado: los clientes empezaron a pagar más puntual.'],
   m:'El registro no solo resuelve disputas: cambia el comportamiento. Lo que se anota, se cumple más.'},
  {t:'El mismo reclamo, atendido dos veces',c:'Un cliente llega a devolver un producto que salió malo. La misma escena, dos veces, con resultados opuestos.',
   p:['<b>Primera versión</b>: quien atiende sigue mirando el celular y contesta de lado: “eso así lo mandan del proveedor”.',
    'Las palabras son ciertas. Pero el cliente escucha que no le importa, y el reclamo se vuelve discusión.',
    '<b>Segunda versión</b>: deja el celular, se pone de frente y dice “déjeme ver qué pasó, cuénteme”.',
    'La misma información sobre el proveedor, pero después de escuchar. El cliente aceptó el cambio y volvió la semana siguiente.'],
   m:'No cambió el contenido: cambió el no verbal y el orden. Escuchar primero, explicar después.'},
  {t:'La convocatoria que se venció',c:'A una asociación le avisan por WhatsApp de una convocatoria de recursos. El mensaje se mezcla con cien más.',
   p:['El canal era correcto para <b>avisar</b>, pero pésimo para algo que había que <b>guardar y consultar</b>.',
    'El plazo se venció sin que nadie lo notara.',
    'La solución: quien recibe una convocatoria la reenvía por correo y la anota en una cartelera con la fecha en grande.',
    'El grupo quedó para avisar; el correo y la cartelera, para guardar.'],
   m:'Un canal para avisar y otro para archivar. Confundirlos hace perder oportunidades que ya estaban ganadas.'}
 ],
 taller:{t:'El pedido en tres líneas y el cliente que reclama',modo:'Parejas · 50 minutos',
  pasos:['<b>Parte 1</b>: escojan un pedido real de su negocio y escríbanlo en <b>máximo tres líneas</b> con las cinco preguntas.',
   'Intercambien con la pareja de al lado: la otra pareja debe poder <b>despachar el pedido sin preguntar nada</b>.',
   'Si tienen que preguntar algo, el pedido está incompleto. Corrijan y vuelvan a intercambiar.',
   '<b>Parte 2 — dramatización</b>: A atiende el negocio, B es un cliente que reclama porque el producto salió malo.',
   'A tiene <b>3 minutos</b> para resolver sin perder al cliente y sin regalar la mercancía.',
   'Prohibido: contestar de mala manera, culpar al cliente, o ceder de inmediato sin averiguar qué pasó.',
   'El grupo evalúa con tres criterios: claridad, tono y registro, y lenguaje no verbal. Esa rúbrica se usa en los tres parciales.'],
  logro:'El pedido cabe en tres líneas y otra pareja pudo despacharlo sin preguntar; y cada estudiante pasó por los dos roles.'},
 tarea:'Haga una <b>tabla comparativa</b> de los cuatro canales calificando rapidez, claridad y evidencia de 1 a 3, con la situación real de su negocio en que usaría cada uno. Agregue una <b>recomendación de media página dirigida al dueño</b>: qué canal debería usar para pedir mercancía y por qué. Escríbala en lenguaje que él entienda; si suena a regaño, reescríbala.',
 recursos:[{i:'🗣️',t:'Comunicación asertiva · SENA',d:'Contenido del área de procesos de atención al cliente',u:'https://www.youtube.com/watch?v=EHr4wRLbe64'}]},

{n:3,unidad:'PARCIAL 1 · ENTRADA A UNIDAD 2',tema:'Parcial primer corte y lectura de documentos comerciales',
 intro:'Hoy cae el <b>primer parcial</b>: tres minutos presentando su negocio. Es el primer pitch comercial de su vida — la misma estructura que va a usar cuando pida un crédito o lo entrevisten. Después entramos a leer los documentos que un negocio firma, cobra y archiva.',
 objetivo:'Demostrar la oralidad construida en la Unidad 1, y reconocer los <b>tipos de texto</b> comerciales y lo que cada documento obliga.',
 contenido:[
  {t:'Cómo funciona el parcial',
   lista:['<b>10 preguntas</b> de selección múltiple sobre los encuentros 1 y 2.',
    '<b>20 minutos</b>. Antes de comenzar verá la rúbrica.',
    'Primer intento: nota máxima <b>4.3</b>, aprueba con <b>3.0</b>. Segundo intento: máxima <b>3.8</b>, aprueba con <b>2.9</b>.',
    'En los últimos 10 minutos escuchará latidos que se aceleran; a los 5 minutos, una alerta.']},
  {t:'Los cuatro tipos de texto de un negocio',
   tabla:{c:['Tipo','Qué hace','Dónde aparece'],
    f:[['<b>Narrativo</b>','Cuenta hechos en el tiempo','El acta de una reunión, el reporte de un incidente'],
       ['<b>Informativo</b>','Presenta datos sin opinar','Un extracto bancario, un informe de ventas'],
       ['<b>Instructivo</b>','Dice cómo hacer algo','Un manual, los términos de una convocatoria'],
       ['<b>Argumentativo</b>','Defiende una posición','Una propuesta comercial, una carta de reclamo']]},
   p:'En el mundo administrativo los que más se firman son los <b>instructivos</b> —contratos, términos, condiciones— y son justamente los que menos se leen completos.'},
  {t:'Lo que un documento dice y lo que obliga',
   tabla:{c:['Frase del documento','Qué parece decir','Qué obliga realmente'],
    f:[['“Se entregará a la mayor brevedad”','Que llega rápido','Nada: no hay fecha exigible'],
       ['“Sujeto a disponibilidad”','Un detalle menor','Que pueden no entregar y no incumplen'],
       ['“El arrendatario se compromete a…”','Una formalidad','Que <b>usted</b> es quien queda obligado'],
       ['“Las partes acuerdan”','Que fue negociado','A veces solo lo redactó una de las dos']]},
   p:'Regla para revisar antes de firmar: <b>subraye todos los verbos en los que usted es el sujeto</b>. Ahí está exactamente a qué se compromete. El resto es contexto.'}
 ],
 ejemplos:[
  {t:'Los tres minutos que consiguieron el crédito',c:'Una comerciante de Barranco va al banco a pedir un crédito. El asesor le da tres minutos.',
   p:['No empezó por la plata. Empezó por el negocio: qué vende, hace cuánto, a quién.',
    'Dio un dato concreto: cuántos clientes atiende un sábado. No dijo “bastantes”.',
    'Nombró el problema: se le acaba la mercancía los fines de semana porque no tiene con qué comprar volumen.',
    'Y cerró con lo que iba a hacer con el crédito, no con lo que necesitaba.'],
   m:'Un buen pitch no pide: <b>explica</b>. Cuando el otro entiende el negocio y el problema, la solicitud se vuelve obvia.'},
  {t:'El contrato de arriendo del local',c:'Un comerciante firma un contrato de una página que le pasan ya escrito. A los ocho meses le piden el local con quince días de aviso.',
   p:['El contrato <b>sí decía</b> cuánto y desde cuándo. Eso lo leyó.',
    'No decía nada sobre duración mínima ni sobre plazo de aviso para terminarlo.',
    'Lo que <b>faltaba</b> era el problema, no lo que estaba escrito.',
    'Tuvo que desocupar en quince días, con mercancía comprada y clientela hecha en ese punto.'],
   m:'Leer un documento comercial es también <b>buscar lo que no está</b>. Un contrato sin preaviso deja desprotegido a quien no lo redactó.'},
  {t:'La factura que no servía para reclamar',c:'Un comerciante recibe una factura escrita a mano que dice: “varios artículos — $850.000”.',
   p:['La factura probaba que <b>pagó</b>, pero no probaba <b>qué</b> había comprado.',
    '“Varios artículos” no es un detalle: es la ausencia total del detalle.',
    'El proveedor sostuvo que eso fue lo despachado y no había cómo contradecirlo.',
    'La solución para adelante: exigir que la factura liste producto, cantidad y valor unitario.'],
   m:'Un documento que no detalla no protege. Pedir detalle no es desconfiar: es lo mínimo que debe tener una factura.'}
 ],
 taller:{t:'Lo que el documento no dice',modo:'Grupos de 4 · 40 minutos',
  pasos:['Saquen los <b>documentos comerciales</b> que trajeron: facturas, recibos, la página del cuaderno de fiado, avisos, un contrato.',
   'Clasifiquen cada uno: narrativo, informativo, instructivo o argumentativo.',
   'Tomen el más formal y busquen los cinco puntos: quién se obliga a qué, cuánto y cuándo, qué pasa si no se cumple, quién firma.',
   'Subrayen lo que el dueño de un negocio pequeño <b>no entendería a la primera lectura</b>.',
   'Hagan la lista de <b>lo que falta</b>: fechas ausentes, plazos no definidos, responsables sin nombre.',
   'Escriban una sola pregunta que le harían a quien redactó ese documento antes de firmarlo.'],
  logro:'Los cinco puntos están ubicados o marcados como ausentes, y el grupo tiene formulada su pregunta antes de firmar.'},
 tarea:'Consiga y fotografíe <b>cinco documentos reales</b> que use hoy su negocio: factura, recibo, cuaderno de fiado, aviso de precios, contrato del local. Si el negocio no tiene ninguno —que pasa y es normal—, <b>ese también es un hallazgo</b>: anótelo y escriba qué documentos debería tener como mínimo.',
 recursos:[],
 parcial:'p1'},

{n:4,unidad:'UNIDAD 2 · COMPRENSIÓN Y ESCRITURA',tema:'Leer entre líneas y escribir una carta que consiga algo',
 intro:'Hoy hacemos dos cosas muy concretas: leer una convocatoria en tres niveles para decidir en cinco minutos si vale la pena aplicar, y escribir una carta que <b>consiga algo</b> — un plazo, un cobro, un descuento.',
 objetivo:'Leer un documento comercial en los <b>tres niveles</b> y producir una carta pasando por planificar, textualizar y revisar.',
 contenido:[
  {t:'Los tres niveles de lectura',
   p:'No son tres formas de leer para escoger una: son tres escalones que se suben en orden.',
   tabla:{c:['Nivel','La pregunta','Ejemplo en una convocatoria'],
    f:[['<b>Literal</b>','¿Qué dice exactamente?','El plazo cierra el 30 y el monto es de X millones'],
       ['<b>Inferencial</b>','¿Qué se deduce de eso?','Si piden RUT y estados financieros, los informales quedan por fuera'],
       ['<b>Crítico</b>','¿Me conviene?','No aplicamos: no alcanzamos a reunir los requisitos en 10 días']]},
   p2:'Cada requisito de una convocatoria es una puerta que se cierra para alguien. Leer inferencialmente es preguntarse para quién.'},
  {t:'Leer al revés: la estrategia que ahorra once páginas',
   lista:['<b>Empiece por los requisitos</b>, no por el monto. Si su negocio no los cumple, se ahorró leer todo lo demás.',
    'Busque las palabras clave: “requisitos”, “plazo”, “no podrán participar”, “se excluye”.',
    'Lea la <b>primera frase de cada párrafo</b>: si el documento está bien escrito, con eso entiende el 80%.',
    'Y recuerde: el monto atrae, pero <b>los requisitos deciden</b>.']},
  {t:'Escribir bien no es escribir de una sola vez',
   tabla:{c:['Fase','Qué se hace','Cuánto del tiempo'],
    f:[['<b>Planificar</b>','A quién, para qué y con qué argumento','40%'],
       ['<b>Textualizar</b>','El borrador, sin detenerse a corregir','20%'],
       ['<b>Revisar</b>','Leer como el destinatario y ajustar','40%']]},
   p:'La pregunta que decide todo: <b>¿qué argumento la convence a ella?</b> No el que a mí me parece justo. Para pedir plazo a un proveedor no funciona “estoy apretado”, sino <b>“le compro todos los meses y quiero seguir haciéndolo”</b>.'}
 ],
 video:{id:'EHr4wRLbe64',t:'Comunicación asertiva · SENA',d:'Cómo decir lo que hay que decir sin agredir ni ceder. Es la base de la carta que van a escribir hoy y de la negociación del encuentro 7.'},
 demoClausula:true,
 ejemplos:[
  {t:'La convocatoria que se leyó al revés',c:'Dos asociaciones reciben la misma convocatoria de doce páginas. Una la lee de principio a fin; la otra empieza por los requisitos.',
   p:['La primera leyó el monto, se entusiasmó y dedicó una reunión a discutir en qué invertir la plata.',
    'A los tres días llegaron a la página de requisitos y descubrieron que no cumplían dos.',
    'La segunda buscó primero “requisitos” y “no podrán participar”. En cinco minutos supo qué le faltaba.',
    'Con ese tiempo ganado alcanzó a tramitarlo y aplicó dentro del plazo.'],
   m:'Leer al revés no es pesimismo: es administración del tiempo. La segunda no fue más lista — leyó en otro orden.'},
  {t:'La carta de cobro que sí cobró',c:'Una tienda tiene tres clientes con saldos vencidos. La dueña les ha dicho de palabra varias veces.',
   p:['<b>Primera versión</b>: “le recuerdo que tiene una deuda pendiente y le agradezco ponerse al día”. Nadie respondió.',
    'Al revisar: no decía <b>cuánto</b>, no decía <b>cuándo</b>, y no proponía nada.',
    '<b>Segunda versión</b>: “su saldo es de $180.000. Le propongo abonar $60.000 el 15 de los próximos tres meses. Si le sirve así, me avisa y lo anotamos”.',
    'Dos de los tres respondieron esa misma semana y empezaron a abonar.'],
   m:'La primera carta pedía algo vago. La segunda <b>proponía una salida concreta</b>. La gente responde a propuestas, no a recordatorios.'},
  {t:'La solicitud de plazo al proveedor',c:'Un comerciante necesita quince días más para pagar. Su primer impulso es explicar sus dificultades.',
   p:['<b>Borrador 1</b>: tres párrafos sobre las ventas bajas, la creciente y los gastos de la casa. Al proveedor eso no le sirve.',
    'Al planificar de nuevo: ¿qué le sirve <b>a él</b>? Conservar un cliente que compra todos los meses.',
    '<b>Borrador 2</b>: “llevo tres años comprándole cada mes. Le pido quince días más para este pago y le confirmo el pedido del mes entrante desde ya”.',
    'Le dieron el plazo. Y el proveedor ganó la certeza del pedido siguiente.'],
   m:'Una buena carta comercial no pide un favor: <b>propone un intercambio</b>. Eso convierte una súplica en una negociación entre iguales.'}
 ],
 taller:{t:'De la convocatoria a la carta',modo:'Individual y parejas · 55 minutos',
  pasos:['<b>Parte 1</b>: con una convocatoria real, no empiecen por el principio. Busquen “requisitos” y “no podrán participar”.',
   'Hagan la lista de requisitos y marquen si su negocio cumple: <b>sí, no, o no sé</b>. Cronometren cuánto les tomó.',
   'Escriban las respuestas de los tres niveles, separadas. La inferencial <b>no puede estar copiada</b> del texto.',
   '<b>Parte 2</b>: escojan un propósito real —pedir plazo, cobrar, proponer descuento— y respondan las tres preguntas de planificación.',
   'Escriban el borrador de <b>máximo una página</b>, sin corregir. La propuesta va con números y fechas.',
   'Intercambien: quien revisa responde <b>“si yo recibiera esta carta, ¿haría lo que pide?”</b> Sí o no, y por qué.'],
  logro:'La lista de requisitos está marcada, los tres niveles diferenciados, y la respuesta del compañero a la pregunta clave fue “sí”.'},
 tarea:'Pase la carta a limpio con las correcciones de su compañero. <b>Muéstresela al dueño</b> del negocio y pregúntele si la enviaría tal como está; anote su respuesta textual. Si dijo que no, corrija y vuelva a preguntar. Esta carta es la base del trabajo del próximo encuentro.',
 recursos:[{i:'📄',t:'Cómo se estructura una carta comercial',d:'Partes y formato estándar, material abierto',u:'https://espanol.libretexts.org/Bookshelves/Vocacional/Vocacional/Aplicaciones_informaticas_y_tecnologia_de_la_informacion/Aplicaciones_informaticas/Libro%3A_Procesamiento_de_textos_(Saylor)/03%3A_Creaci%C3%B3n_de_documentos_comerciales/3.01%3A_%C2%BFQu%C3%A9_es_una_Carta_Comercial%3F'}]},
{n:5,unidad:'UNIDAD 2 · COMPRENSIÓN Y ESCRITURA',tema:'La coma que cuesta plata',
 intro:'Hoy vemos cómo un signo de puntuación decide <b>quién paga</b>. Dos versiones de la misma cláusula: en una el negocio cobra, en la otra no puede cobrar nada. Aquí la gramática no es cuestión de bonito o feo.',
 objetivo:'Corregir los errores de <b>concordancia, puntuación y cohesión</b> que cambian el sentido de un compromiso comercial, y dejar lista la versión final de la carta.',
 contenido:[
  {t:'Los cuatro errores que cuestan plata',
   p:'No vamos a repasar toda la gramática. Solo los cuatro que aparecen en documentos comerciales y cambian lo que se puede reclamar.',
   tabla:{c:['Error','Qué pasa','Ejemplo real'],
    f:[['<b>Sujeto escondido</b>','No se sabe quién debe hacerlo','“Se entregará el jueves” — ¿quién entrega?'],
       ['<b>Coma mal puesta</b>','Cambia a quién se aplica la condición','“El descuento aplica, si paga de contado”'],
       ['<b>Concordancia rota</b>','Se pierde a qué se refiere','“Los bultos y la caja será entregada…”'],
       ['<b>Referencia confusa</b>','No se sabe de qué se habla','“Esto se descontará del pago” — ¿qué es “esto”?']]},
   p2:'El primero es el más común y el más caro. <b>“Se entregará”, “se pagará”, “se avisará”</b> no comprometen a nadie porque no dicen quién.'},
  {t:'La puntuación decide quién paga',
   lista:['<b>“El proveedor entregará la mercancía, y el cliente pagará al recibirla.”</b> Dos obligaciones separadas y claras.',
    '<b>“El proveedor entregará la mercancía y el cliente pagará, al recibirla.”</b> Ahora “al recibirla” podría referirse a las dos cosas.',
    'Los <b>dos puntos</b> anuncian el detalle: “se entregará lo siguiente: diez bultos de cemento gris”. Eso cierra la discusión.',
    'Regla práctica: si una frase comercial tiene <b>más de dos comas</b>, casi siempre conviene partirla en dos.']},
  {t:'Cohesión: que el texto se sostenga solo',
   lista:['Cuidado con “<b>esto</b>”, “<b>eso</b>”, “<b>lo anterior</b>”: si hay dos cosas mencionadas antes, nadie sabe a cuál se refiere.',
    'Regla comercial: en un documento que compromete, <b>repita el sustantivo antes que usar un pronombre</b>. Sonará repetitivo y será exigible.',
    'Cada párrafo, una idea. Si mezcla precio, plazo y penalidad, hay que partirlo.',
    'Acepte esta tensión: <b>el buen estilo literario y el buen documento comercial no son lo mismo</b>. En literatura se evita repetir; en un contrato, repetir es proteger.']}
 ],
 demoComa:true,
 ejemplos:[
  {t:'La coma que costó el descuento',c:'Un almacén ofrece por escrito: “el descuento del 10% aplica a compras superiores a un millón, y a clientes con cuenta activa”.',
   p:['El almacén quiso decir: el descuento es para quien compre más de un millón <b>y además</b> tenga cuenta activa.',
    'Pero con esa coma se puede leer como <b>dos casos separados</b>: los que compran más de un millón, o los que tienen cuenta.',
    'Un cliente con cuenta activa compró $300.000 y exigió el descuento. Y tenía razón según lo escrito.',
    'Reescrito: “el descuento del 10% aplica únicamente a clientes con cuenta activa que compren más de un millón”.'],
   m:'La ambigüedad siempre se resuelve a favor de quien <b>no redactó</b> el documento. Si usted lo escribe, usted pierde con la ambigüedad.'},
  {t:'El “se entregará” que nadie entregó',c:'En un acuerdo entre una asociación y un contratista quedó escrito: “se entregará el informe antes del 30 y se realizará el pago dentro de los cinco días siguientes”.',
   p:['Llegó el 30 y no había informe. Cada parte creía que le tocaba a la otra recopilar la información.',
    'La frase no tenía <b>sujeto</b>. “Se entregará” no obliga a nadie en particular.',
    'Lo mismo con el pago: no dice quién paga ni a quién.',
    'Corregido: “<b>El contratista</b> entrega el informe antes del 30. <b>La asociación</b> paga dentro de los cinco días siguientes a la entrega”.'],
   m:'Cada vez que vea “se hará” en un documento, pregunte <b>quién</b>. Esa pregunta ha evitado más pleitos que cualquier abogado.'},
  {t:'El mensaje que se leyó al revés',c:'Un tendero escribe a su proveedor: “no mande los bultos de arroz mande los de azúcar que son los que faltan”. Sin puntuación.',
   p:['El proveedor leyó: “no mande los bultos de arroz, mande los de azúcar”. Correcto, por suerte.',
    'Pero también se podía leer: “no mande los bultos de arroz mande, los de azúcar que son los que faltan”.',
    'Esta vez salió bien por casualidad, no por claridad.',
    'Con dos signos: “<b>No mande los bultos de arroz. Mande los de azúcar, que son los que faltan.</b>” Imposible de malentender.'],
   m:'La puntuación en un mensaje de negocios no es formalismo: es lo que evita que le despachen mal el pedido.'}
 ],
 taller:{t:'Cacería de errores y la prueba del malentendido',modo:'Parejas · 50 minutos',
  pasos:['<b>Parte 1</b>: reciben un texto con ocho a diez errores reales tomados de facturas, recibos y mensajes de la zona.',
   'Corrijan y anoten al lado la razón: sujeto escondido, coma, concordancia o referencia confusa.',
   'Reto principal: encuentren el error que <b>cambia el compromiso económico</b> — el que haría perder plata o impediría cobrar.',
   '<b>Parte 2</b>: abran su carta y busquen todas las frases que empiecen con <b>“se”</b>. Reescríbanlas nombrando al responsable.',
   'Si alguna frase tiene más de dos comas, pártanla. Reemplacen los “esto” y “lo anterior” por el sustantivo completo.',
   '<b>Prueba del malentendido</b>: la pareja busca a propósito entender mal cada frase, como alguien que no quiere cumplir. Marca las que admitan dos lecturas.',
   'Corrijan y hagan una segunda ronda. Si ya no encuentra nada, la carta está lista.'],
  logro:'La carta no tiene sujetos escondidos ni frases ambiguas, y pasó la segunda ronda de la prueba del malentendido.'},
 tarea:'Deje lista la <b>versión definitiva</b> de su carta y <b>envíela de verdad</b> al destinatario: proveedor, cliente o entidad. Deje constancia del envío —foto, captura o firma de recibido—. Escriba además media página de <b>autoevaluación</b>: qué planificó, qué cambió al textualizar, qué corrigió al revisar y qué le costó más. Prepárese para el <b>Parcial 2</b> del próximo encuentro: cubre toda la Unidad 2.',
 recursos:[]},

{n:6,unidad:'PARCIAL 2 · UNIDAD 3 · GESTIÓN',tema:'Parcial segundo corte, inducción y rendición de cuentas',
 intro:'Cae el <b>segundo parcial</b> sobre la Unidad 2. Y después entramos a lo que hace todo administrador: recibir a alguien nuevo y explicarle su trabajo, y convertir lo que pasa en el negocio en datos que sirvan para decidir.',
 objetivo:'Demostrar el dominio de la Unidad 2, diseñar la <b>inducción de un puesto real</b> y redactar un <b>informe de gestión de una página</b> con datos medidos.',
 contenido:[
  {t:'Ordenar no es inducir',
   p:'“Usted se encarga de la caja” no es una inducción: es una asignación. La diferencia se paga en rotación de personal.',
   tabla:{c:['Ordenar','Inducir','Qué cambia'],
    f:[['“Atienda el mostrador”','“Su trabajo es que el cliente salga atendido y con su cuenta clara”','Entiende el propósito, no solo la tarea'],
       ['“No se equivoque”','“Al cerrar se cuadra la caja contra el cuaderno”','Sabe cómo se verifica su propio trabajo'],
       ['“Cualquier cosa me avisa”','“Descuentos y devoluciones los autorizo yo”','Sabe hasta dónde puede decidir solo']]},
   p2:'Las cuatro preguntas de todo puesto: <b>qué hace</b> (tres tareas, no quince), <b>cómo se mide</b> que lo hace bien, <b>a quién le reporta</b>, y <b>qué no puede hacer sin autorización</b>. La cuarta evita los problemas más caros.'},
  {t:'Un dato no es una impresión',
   tabla:{c:['Impresión','Dato','Por qué importa'],
    f:[['“Vendemos bien los sábados”','“El sábado vendimos $340.000; el martes $95.000”','Se puede comparar y decidir horarios'],
       ['“Se daña mucha verdura”','“Esta semana se botaron 6 kg de tomate”','Se puede calcular la pérdida en pesos'],
       ['“El cliente se demora en pagar”','“Tres clientes deben desde hace más de 45 días”','Se puede priorizar el cobro']]},
   p:'<b>Ninguna impresión de la izquierda es mentira.</b> Todas son ciertas. Pero con ninguna se puede tomar una decisión ni sustentar un crédito.'},
  {t:'Las cuatro partes de un informe que sí se lee',
   lista:['<b>Objetivo</b>: para qué se hizo. Una frase.',
    '<b>Datos observados</b>: lo que se midió, con números y fechas. Sin interpretar todavía.',
    '<b>Análisis</b>: qué significan esos datos. Tres líneas máximo.',
    '<b>Recomendación</b>: qué se debería hacer. Concreta y realizable con lo que hay en el pueblo.',
    'Sin la cuarta parte usted <b>informó pero no aportó</b>. Eso es un reporte, no un informe de gestión.']}
 ],
 ejemplos:[
  {t:'La empleada que duró tres días',c:'Una tienda contrata a una muchacha para atender. Al tercer día se va. El dueño concluye que “la gente joven no quiere trabajar”.',
   p:['El primer día le dijeron: “usted atienda y cualquier cosa me pregunta”. Esa fue toda la inducción.',
    'No sabía los precios y le daba pena preguntar cada vez. Los clientes se impacientaban.',
    'No sabía si podía fiar. Fió a dos personas y el dueño se molestó delante de ella.',
    'No sabía cómo se cerraba la caja. Al cuadrar faltaron $12.000 y sintió que sospechaban.',
    'No se fue por la plata: se fue porque <b>nunca supo si lo estaba haciendo bien</b>.'],
   m:'La rotación casi siempre se explica en los primeros tres días. Una inducción de cinco minutos habría resuelto los tres problemas.'},
  {t:'Los 6 kilos de tomate',c:'Una tienda sabía que “se dañaba mucha verdura”, pero nunca supo cuánto. Un estudiante lo midió durante una semana.',
   p:['Pesó lo que se botaba cada día. Total: <b>6 kilos de tomate y 3 de cebolla</b>.',
    'Lo convirtió a pesos con el precio de compra: la cifra mensual sorprendió a la dueña.',
    'Análisis: se compraba dos veces por semana la misma cantidad, sin mirar cuánto había sobrado.',
    'Recomendación: comprar tres veces por semana en menor cantidad. Un cambio sin costo.',
    'A las tres semanas la merma bajó a menos de la mitad.'],
   m:'Nadie decidió nada durante años porque “se daña mucha verdura” no se puede resolver. <b>Seis kilos de tomate sí.</b>'},
  {t:'El informe de cuatro páginas que nadie leyó',c:'Un estudiante entrega al dueño un informe completo y bien escrito. Cuatro páginas. A la semana no lo había abierto.',
   p:['No fue desinterés: el dueño abre a las 6 de la mañana y cierra a las 8 de la noche.',
    'Cuatro páginas exigen un rato sentado que ese señor no tiene.',
    'Se rehízo en <b>una página</b>: objetivo, una tabla, tres líneas de análisis y la recomendación en negrita.',
    'Lo leyó de pie, detrás del mostrador, en tres minutos. Y esa semana cambió el horario de pedidos.'],
   m:'Un informe que no se lee no existe. Escribir para el lector real —no para el ideal— es una decisión administrativa.'}
 ],
 taller:{t:'La inducción y el informe de una página',modo:'Individual · 55 minutos',
  pasos:['<b>Parte 1</b>: escoja un puesto real del negocio y responda por escrito las cuatro preguntas, con datos concretos.',
   'La medición debe ser <b>verificable</b>: no “que sea responsable”, sino algo que se pueda comprobar.',
   'Conviértalo en una <b>hoja</b> con tres bloques: lo que hago cada día · lo que reviso al cerrar · lo que pregunto antes de hacer.',
   'Prohibido pasar de una página. Si no cabe, hay tareas que no eran de ese puesto.',
   '<b>Parte 2</b>: escriba cinco impresiones que haya oído en su negocio y al frente cómo las convertiría en dato.',
   'Escoja la más fácil de medir y redacte el informe con las cuatro partes, en una sola página.',
   'Escriba aparte el <b>resumen de tres líneas</b> para WhatsApp: qué midió, qué encontró con un número, qué propone.'],
  logro:'La hoja de inducción cabe en una página con medición verificable, y el informe trae las cuatro partes con una recomendación realizable.'},
 tarea:'Complete el informe con los datos reales que le falten — <b>mida lo que se pueda medir esta semana</b>. Preséntelo al dueño junto con el resumen de tres líneas y pregúntele <b>qué decisión tomaría</b>. Anote su respuesta textual. Muéstrele también la hoja de inducción y pregúntele si se la entregaría al próximo empleado que contrate.',
 recursos:[],
 parcial:'p2'},

{n:7,unidad:'UNIDAD 3 · COMUNICACIÓN EN LA GESTIÓN',tema:'Dar malas noticias y negociar sin perder',
 intro:'Dos cosas difíciles en un solo encuentro: <b>subir precios o cobrar sin perder al cliente</b>, y <b>negociar con el intermediario</b> que llega ofreciendo poco porque sabe que el producto se daña. Las dos las va a enfrentar en su primer trabajo.',
 objetivo:'Construir un mensaje de situación crítica en <b>tres frases</b> y sostener una negociación asertiva usando posición, interés e intercambio.',
 contenido:[
  {t:'La regla de las tres frases',
   lista:['<b>Frase 1 — Qué pasó.</b> Directo, sin rodeos ni disculpas anticipadas.',
    '<b>Frase 2 — Qué implica.</b> Concreto: la cifra, la fecha, el efecto.',
    '<b>Frase 3 — Qué se propone.</b> Siempre hay algo que ofrecer: un plazo, una alternativa, una fecha.',
    'Lo que <b>no</b> va: sus dificultades personales, rodeos, ni “por motivos ajenos a nuestra voluntad” — la forma más rápida de sonar a que se esconde algo.']},
  {t:'Avisar antes es más barato que explicar después',
   lista:['Comunicar <b>antes</b>: usted controla el mensaje, el momento y el tono. La gente se organiza y lo agradece.',
    'Comunicar <b>después</b>: contesta preguntas incómodas, con la gente molesta y versiones circulando.',
    'En un pueblo la información circula rápido: <b>si usted no da la versión, alguien la da por usted</b>.',
    'Lo previsible —la creciente, la temporada, el alza conocida— se avisa antes. No es sorpresa: es planeación comercial.']},
  {t:'La posición no es el interés',
   tabla:{c:['Lo que dice (posición)','Lo que busca (interés)','Qué se le puede ofrecer'],
    f:[['“Le pago $X y no más”','Comprar barato y tener volumen seguro','Frecuencia garantizada a cambio de mejor precio'],
       ['“Necesito el pago de contado”','Asegurar que no le queden debiendo','Pago parcial anticipado y el resto a plazo'],
       ['“Se lo llevo todo o nada”','Ahorrar viajes','Consolidar varios pedidos en un solo viaje']]},
   p:'Sobre la <b>posición</b> no se puede negociar: es un número. Sobre el <b>interés</b> casi siempre sí, porque hay más de una forma de satisfacerlo. Las tres jugadas: reconocer el interés, poner un dato, proponer un intercambio.'}
 ],
 demoCobro:true,
 ejemplos:[
  {t:'Los dos avisos de subida de precios',c:'Dos tiendas suben precios el mismo mes por el mismo motivo. Cada una lo comunica distinto.',
   p:['<b>Tienda A</b>: no avisó. Los clientes se enteraron en la caja, uno por uno, discutiendo con quien atendía.',
    'Varios pensaron que les estaban cobrando de más a ellos en particular.',
    '<b>Tienda B</b> pegó un aviso de tres frases: qué subió, desde cuándo, y que la lista de la pared ya estaba actualizada.',
    'Agregó una cuarta línea: los productos que <b>no</b> habían subido.',
    'En la tienda B nadie discutió en la caja: el aviso ya había respondido antes de que preguntaran.'],
   m:'Comunicar antes no evita la mala noticia: <b>evita que la gente sienta que le están viendo la cara</b>.'},
  {t:'El cobro que no rompió la amistad',c:'Una tienda de vereda tiene tres clientes con mora larga. Todos son vecinos con los que uno se cruza en misa.',
   p:['El error común es no decir nada por meses y después reclamar de golpe, con molestia acumulada.',
    'La dueña mandó el mismo mensaje a los tres: <b>“Estoy poniendo al día el cuaderno de fiado. Su saldo es de $X. ¿Le sirve abonar de a $Y cada quincena?”</b>',
    'Frase 1: qué pasó. Frase 2: qué implica. Frase 3: qué propongo.',
    'Nadie se sintió señalado porque el mensaje era igual para todos y venía del <b>negocio</b>, no de ella.'],
   m:'Cuando el mensaje viene de una rutina del negocio, deja de ser un reclamo personal. Ahí está el truco para cobrar sin romper la relación.'},
  {t:'El pescado del intermediario',c:'Un pescador tiene la captura del día. Llega el intermediario y ofrece un precio bajo. Sabe que si no vende, el pescado se daña.',
   p:['<b>Reacción común</b>: “eso está muy barato, uno se mata trabajando”. Habla de su necesidad. El intermediario no se mueve.',
    '<b>Jugada 1</b>: “entiendo que usted necesita llenar el carro hoy para salir temprano”.',
    '<b>Jugada 2</b>: “la semana pasada en El Banco esto se pagó a $X el kilo”. Un dato, no una queja.',
    '<b>Jugada 3</b>: “si me mejora a $Y, le garantizo la captura de los martes y los viernes, fija”.',
    'El intermediario no compró barato: compró <b>seguridad de abastecimiento</b>. Y por eso subió el precio.'],
   m:'El pescador no tenía más poder que antes. Dejó de hablar de su necesidad y empezó a hablar del <b>interés del otro</b>.'}
 ],
 taller:{t:'Mensaje crítico y simulación de negociación',modo:'Individual y parejas · 55 minutos',
  pasos:['<b>Parte 1</b>: liste cuatro situaciones críticas que le pueden pasar a su negocio este año. Al menos una debe ser <b>previsible</b>.',
   'Escoja la más probable y redacte el mensaje en <b>exactamente tres frases</b>.',
   'Páselo a su pareja: si tiene que <b>preguntar algo</b> para entenderlo, el mensaje falló y se reescribe.',
   'Adáptelo a dos formatos: el <b>aviso para pegar</b> en el local y el <b>mensaje de WhatsApp</b>. Deben decir lo mismo.',
   '<b>Parte 2 — simulación</b>, 3 minutos frente al grupo: A es el comerciante local; B el intermediario o proveedor con más poder.',
   'A debe mejorar su posición con las tres jugadas. Prohibido rogar, hablar de dificultades personales, gritar o aceptar el primer precio.',
   'Escriba antes su <b>límite</b>: hasta dónde acepta y qué hace si el otro no llega. Se escribe antes de negociar, no durante.'],
  logro:'El mensaje cabe en tres frases y la pareja lo entendió sin preguntar; y en la simulación se usaron las tres jugadas con un límite definido.'},
 tarea:'Entregue el mensaje en sus <b>dos versiones</b>. Si el dueño autoriza, publique el aviso y mande la foto. Grabe además con el celular un <b>primer ensayo en video</b> de la presentación de su negocio, máximo 3 minutos: qué es, a quién le vende, cuál es su problema y qué propone usted. Véalo usted mismo y anote tres cosas que va a mejorar.',
 recursos:[]},

{n:8,unidad:'PARCIAL FINAL · CIERRE',tema:'Feria de negocios y parcial final',
 intro:'Último encuentro. Hoy proyectamos los videos, el grupo hace de jurado de financiación, cae el <b>parcial final</b>, y cada uno le entrega el informe al negocio que le abrió las puertas.',
 objetivo:'Presentar el proyecto integrador ante un jurado, demostrar el dominio de la Unidad 3 y <b>entregar el trabajo al negocio</b> acompañado durante el curso.',
 contenido:[
  {t:'Qué se evalúa hoy',
   tabla:{c:['Criterio','Qué se mira','Peso'],
    f:[['<b>Estructura</b>','Que los tres minutos tengan negocio, problema y propuesta','25%'],
       ['<b>Sustento</b>','Que cada cifra tenga origen y coincida con el informe','30%'],
       ['<b>Oralidad</b>','Claridad, tono y no verbal — la rúbrica del encuentro 2','25%'],
       ['<b>Entrega al negocio</b>','Que el trabajo haya vuelto a quien lo hizo posible','20%']]},
   p:'El último criterio <b>vale puntos</b>. Este curso no termina cuando yo califico: termina cuando el dueño recibe algo que le sirve.'},
  {t:'Las cuatro preguntas que hace un jurado',
   lista:['<b>“¿Y eso cómo lo sabe?”</b> — la pregunta por el dato. Si su cifra no tiene origen, se cae toda la presentación.',
    '<b>“¿Y si no funciona?”</b> — la pregunta por el riesgo. No hay que negarlo: hay que tenerlo pensado.',
    '<b>“¿Por qué usted y no otro?”</b> — se responde con lo que ya se hizo, no con promesas.',
    '<b>“¿Cuánto necesita exactamente?”</b> — responder “lo que se pueda” descalifica.',
    'Regla para cualquiera de las cuatro: <b>si no sabe, dígalo y diga cuándo lo va a saber</b>. Inventar un dato es la única falta que no se perdona.']},
  {t:'Dónde va a volver a usar esto',
   lista:['En <b>Fundamentos de Administración</b>: el análisis del negocio parte de saber describir y sustentar.',
    'En <b>Procesos Administrativos</b>: informes, actas y comunicación con el equipo son exactamente la Unidad 3.',
    'En el <b>ciclo tecnológico</b>: presentar y sustentar decide buena parte de las notas.',
    'Y fuera del programa: cuando pida un crédito, busque un socio o lo entrevisten. <b>Los tres minutos de hoy son los mismos.</b>']}
 ],
 ejemplos:[
  {t:'La presentación que se cayó en la primera pregunta',c:'Un estudiante presenta muy bien: buena voz, buena postura. El jurado pregunta “¿y eso cómo lo sabe?” y se queda callado.',
   p:['Había dicho que el negocio “vende como un millón al mes”. Sonaba convincente.',
    'Nunca lo midió: era lo que le había parecido oír una vez.',
    'Con esa pregunta, <b>todo lo demás quedó bajo sospecha</b>. Si esa cifra era inventada, ¿cuáles más?',
    'Lo que debió responder: “esa cifra es un estimado del dueño, no la he medido. Lo que sí medí fue…”.'],
   m:'Un dato sin origen contamina toda la presentación. Mejor <b>tres datos verificados</b> que diez cifras que suenan bien.'},
  {t:'El informe que llegó al banco',c:'Una estudiante entregó su informe a la dueña de una tienda. Meses después, esa señora fue a pedir un crédito.',
   p:['El asesor le pidió que explicara el negocio y sus números.',
    'Ella llevó el informe: ventas medidas, merma calculada, la recomendación por escrito.',
    'Era el único documento que tenía sobre su propio negocio.',
    'El asesor le dijo que era el mejor sustento que le habían llevado ese mes.'],
   m:'Lo que ustedes entregan hoy puede terminar en un banco o en una convocatoria. No es una tarea: es documentación de un negocio real.'},
  {t:'De marzo a hoy',c:'En el primer encuentro quedó una pregunta: el pedido que llegó mal, los veinte bultos en vez de dos, ¿de quién fue la culpa?',
   p:['En marzo la respuesta del grupo fue “del que pidió” o “del proveedor”.',
    'En el encuentro 1 aprendieron a decir que falló <b>el canal y el ruido</b>, no la persona.',
    'En el 2 supieron que sin evidencia no gana quien tiene razón, sino quien tiene más aguante.',
    'En el 5 vieron cómo una coma decide quién paga.',
    'Y hoy pueden escribir un pedido de tres líneas que <b>no se puede entender de otra manera</b>.'],
   m:'Esa es la distancia que recorrieron. No aprendieron a hablar bonito: aprendieron a que las cosas queden claras — que es de lo que vive un negocio.'}
 ],
 taller:{t:'Feria de negocios y entrega final',modo:'Grupo completo · 60 minutos',
  pasos:['Proyección de los videos definitivos, <b>3 minutos por estudiante</b>.',
   'Después de cada uno, el grupo hace <b>una pregunta</b> de las cuatro tipo: el dato, el riesgo, la capacidad o la cifra.',
   'El autor responde de pie. Si no sabe, lo dice y explica cómo lo averiguaría. <b>Inventar descalifica.</b>',
   'Entrega de los informes escritos y evaluación con los cuatro criterios.',
   'Votación de los tres mejores.',
   'Escriba la <b>nota de entrega</b> de cinco líneas para el dueño: qué contiene, para qué le sirve y quién lo hizo. Agradezca que le abrieran las puertas y dígale que <b>el informe es de él</b>.'],
  logro:'Presentó su video, respondió la pregunta del jurado sin inventar datos, entregó el informe y tiene lista la nota de entrega.'},
 tarea:'Lleve esta semana el informe y el video al dueño o encargado del negocio. Explíquelo en dos minutos y pida una <b>constancia</b>: una foto, un mensaje suyo o su firma en el informe. Envíemela por correo — es el <b>20% de la nota</b> del parcial final. Y guarde su guion de tres minutos: lo va a necesitar más pronto de lo que cree.',
 recursos:[],
 parcial:'p3'}
];

const PARCIALES={
 p1:{titulo:'Parcial primer corte',cubre:'Encuentros 1 y 2 · Comunicación y oralidad',min:20,
  rubrica:[['Los seis elementos del proceso comunicativo','4 preguntas','40%'],
           ['El ruido y sus tipos','2 preguntas','20%'],
           ['Canal, evidencia y atención al cliente','4 preguntas','40%']],
  preguntas:[
   {q:'Un tendero pide mercancía por nota de voz mientras atiende a otro cliente, con bulla y mala señal. Llegan veinte bultos en vez de dos. ¿Qué elemento explica mejor la falla?',
    o:['El emisor, porque habló mal','El ruido, en sus formas física y de contexto','El código, porque usaron palabras distintas','El receptor, porque no puso atención'],r:1,
    e:'Hubo ruido físico —la bulla y la señal— y ruido de contexto —el afán de estar atendiendo—. Ninguno de los dos mintió: falló el sistema, no la persona.'},
   {q:'En una venta de tienda, ¿quién cumple el papel de emisor cuando el cliente hace un pedido?',
    o:['El tendero que atiende','El cliente que pide','El producto solicitado','El cuaderno donde se anota'],r:1,
    e:'El emisor es quien produce el mensaje. En ese momento es el cliente; el tendero es el receptor que interpreta.'},
   {q:'Decir “el flete va FOB” a alguien que nunca ha oído ese término es un problema de…',
    o:['Canal','Código','Emisor','Mensaje'],r:1,
    e:'El código es el sistema de signos compartido. Si el otro no maneja esas palabras, el mensaje viaja completo y llega ininteligible.'},
   {q:'¿Cuál de estas afirmaciones sobre el ruido es correcta?',
    o:['El ruido es únicamente el sonido ambiental','El afán y el cansancio también son ruido, porque impiden procesar el mensaje','El ruido solo afecta la comunicación hablada','El ruido se elimina hablando más fuerte'],r:1,
    e:'El ruido de contexto es de los más caros en un negocio: el mensaje llega, pero nadie lo procesa porque está atendiendo tres cosas a la vez.'},
   {q:'¿Por qué el pregón de la plaza sirve para anunciar pero no para comprometer?',
    o:['Porque el altavoz distorsiona la voz','Porque no deja evidencia y nadie puede reclamar después por ese precio','Porque llega a poca gente','Porque está prohibido comercialmente'],r:1,
    e:'Es el canal más rápido y el que menos evidencia deja. Sirve para atraer al cliente, no para cerrar un negocio.'},
   {q:'La regla del curso sobre elección de canal dice que…',
    o:['Siempre debe usarse el canal más rápido','Entre más plata o más tiempo esté en juego, más formal debe ser el canal','El canal escrito se reserva para las entidades','Todos los canales tienen el mismo valor probatorio'],r:1,
    e:'Un saludo va por voz; un pedido de un millón de pesos, por escrito. Lo que está en juego define la formalidad.'},
   {q:'¿Cuáles son las cinco preguntas que debe responder un pedido bien escrito?',
    o:['Qué, cuánto, cuándo, dónde y a cuánto','Quién, cómo, cuándo, dónde y por qué','Qué, quién, cómo, cuánto y para qué','Producto, marca, color, cantidad y peso'],r:0,
    e:'Cinco datos en tres líneas. El que más se omite es el precio acordado, y es el que más problemas causa a la hora de pagar.'},
   {q:'Un cliente llega reclamando por un producto defectuoso. ¿Cuál es la mejor secuencia de atención?',
    o:['Explicar de inmediato que el proveedor lo mandó así','Escuchar primero y explicar después','Cambiar el producto sin preguntar nada','Llamar al dueño para que él resuelva'],r:1,
    e:'Aunque la explicación sea cierta, si llega antes de escuchar se lee como excusa y el reclamo se vuelve discusión.'},
   {q:'Si alguien dice “con mucho gusto le ayudo” sin levantar la vista del celular, el cliente…',
    o:['Recibe el mensaje correctamente porque las palabras son amables','Percibe el desinterés, porque el no verbal contradice lo verbal','No nota ninguna diferencia','Interpreta que hay mucho trabajo'],r:1,
    e:'Cuando lo verbal y lo no verbal se contradicen, la gente le cree a lo que ve. El mensaje se entiende pero no se cree.'},
   {q:'¿Por qué pasar el fiado de la memoria a un cuaderno con fecha, valor y firma cambió el comportamiento de los clientes?',
    o:['Porque los clientes sintieron desconfianza y pagaron por molestia','Porque lo que se registra y se puede verificar tiende a cumplirse más','Porque el cuaderno tiene valor legal','Porque se les cobró intereses'],r:1,
    e:'El registro no solo resuelve disputas: cambia la conducta. Y no es desconfianza — la memoria simplemente no es un sistema de registro.'}
  ]},

 p2:{titulo:'Parcial segundo corte',cubre:'Encuentros 3, 4 y 5 · Comprensión lectora y escritura',min:20,
  rubrica:[['Tipos de texto y documentos comerciales','3 preguntas','30%'],
           ['Los tres niveles de lectura','3 preguntas','30%'],
           ['Proceso de escritura y gramática comercial','4 preguntas','40%']],
  preguntas:[
   {q:'Un contrato, unos términos y condiciones y el manual de una máquina son ejemplos de texto…',
    o:['Narrativo','Informativo','Instructivo','Argumentativo'],r:2,
    e:'Los instructivos dicen cómo hacer algo o bajo qué condiciones. Son los que más se firman y los que menos se leen completos.'},
   {q:'La frase “se entregará a la mayor brevedad” en un documento comercial…',
    o:['Obliga a entregar en 48 horas','No obliga a nada: no hay una fecha exigible','Equivale a entrega inmediata','Obliga solo si está firmada'],r:1,
    e:'Sin fecha concreta no hay incumplimiento posible. Lo que un documento dice y lo que obliga no siempre coinciden.'},
   {q:'¿Cuál es la revisión más rápida y útil antes de firmar un documento?',
    o:['Contar las páginas','Subrayar todos los verbos en los que usted es el sujeto','Verificar que tenga sello','Leer solo la última página'],r:1,
    e:'Ahí está exactamente a qué se está comprometiendo usted. El resto del documento es contexto.'},
   {q:'“Si piden RUT y estados financieros, los negocios informales quedan por fuera” corresponde al nivel de lectura…',
    o:['Literal','Inferencial','Crítico','Textual'],r:1,
    e:'El nivel inferencial deduce algo que el texto no dice de forma directa: ve el filtro que hay detrás de cada requisito.'},
   {q:'Al leer una convocatoria, ¿por dónde conviene empezar?',
    o:['Por el monto, para saber si vale la pena','Por los requisitos y las exclusiones','Por la presentación institucional','Por la fecha de publicación'],r:1,
    e:'El monto atrae pero los requisitos deciden. Si el negocio no los cumple, se ahorró leer once páginas.'},
   {q:'¿Cuál es la regla que distingue una respuesta inferencial de una literal?',
    o:['La inferencial es más extensa','La inferencial no puede estar copiada del texto','La literal se escribe con palabras propias','La inferencial siempre cita una norma'],r:1,
    e:'Si está copiada del documento, es literal por definición. La inferencia aporta algo que el texto no dice.'},
   {q:'Según las fases del proceso de escritura, ¿cuál ocupa menos tiempo del total?',

function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(36).toUpperCase()}
const SEC='UNICARIBE-CDI-2026';
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function mkCod(o){const p=[o.nombre,o.correo,o.parcial,o.intento,o.ok,o.tot,o.nota,o.fecha].join('|');return fnv(p+SEC)+'.'+b64e(p)}
function verif(){
 const c=(document.getElementById('cv').value||'').trim(),r=document.getElementById('cr'),pt=c.split('.');
 if(pt.length!==2){r.innerHTML='<b style="color:var(--mal)">Código con formato inválido.</b>';return}
 let p;try{p=b64d(pt[1])}catch(e){r.innerHTML='<b style="color:var(--mal)">No se pudo leer el código.</b>';return}
 const ok=fnv(p+SEC)===pt[0],f=p.split('|');
 r.innerHTML=ok?`<div style="background:#E9F9F0;border:1px solid var(--ver);border-radius:11px;padding:14px">
   <b style="color:var(--ver)">✅ Constancia auténtica — no fue alterada</b>
   <div style="margin-top:8px;font-size:13.5px;line-height:1.7"><b>Estudiante:</b> ${esc(f[0])}<br><b>Correo:</b> ${esc(f[1])}<br>
   <b>Parcial:</b> ${esc(PARCIALES[f[2]]?PARCIALES[f[2]].titulo:f[2])}<br><b>Intento:</b> ${esc(f[3])}<br>
   <b>Aciertos:</b> ${esc(f[4])} de ${esc(f[5])}<br><b>NOTA:</b> <span style="font-size:19px;font-weight:700;color:var(--mor)">${esc(f[6])}</span><br>
   <b>Fecha:</b> ${esc(f[7])}</div></div>`
  :`<div style="background:#FCE9E9;border:1px solid var(--mal);border-radius:11px;padding:14px">
   <b style="color:var(--mal)">⚠️ Código alterado o inválido.</b><div style="margin-top:6px;font-size:13.5px">No acepte este resultado; pida que vuelva a presentar.</div></div>`;
 ok?sOk():osc(180,0,.4,'sawtooth',.45);
}

/* ==========================================================
   INGRESO CON GOOGLE
   El estudiante entra con la cuenta de Google que ya tiene
   abierta en su equipo. No hay contraseñas que olvidar.
   ========================================================== */
const CORREO_CC='inbox.nativo@gmail.com';
let GSI_LISTO=false;

function payloadJWT(t){
  try{
    const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}
const normCorreo=c=>String(c||'').trim().toLowerCase();

function esDocente(correo){
  const lista=(CFG&&CFG.docentes)?CFG.docentes:[CORREO_DOC];
  return lista.map(normCorreo).includes(normCorreo(correo));
}
function buscarPorCorreo(correo){
  const c=normCorreo(correo);
  return ESTUDIANTES.find(e=>normCorreo(e.c)===c);
}

function montarIngreso(){
  const cid=CFG&&CFG.google_client_id;
  const zona=document.getElementById('zonaIngreso');
  if(!zona) return;

function esperarGSI(cid,intentos){

      google.accounts.id.initialize({client_id:cid,callback:llegoGoogle,auto_select:false,cancel_on_tap_outside:true});

  if(!d||!d.email){ err('No se pudo leer la cuenta de Google. Intente otra vez.'); return; }
  if(d.email_verified===false){ err('Esa cuenta de Google no está verificada.'); return; }

  if(esDocente(d.email)){
    ST.u={u:'docente',n:d.name||'Docente',c:d.email};
    ST.esDoc=true; abrirApp(); return;

  const al=buscarPorCorreo(d.email);

    err('El correo '+d.email+' no está en la lista de este curso. Escríbale al docente indicándole exactamente ese correo.');

  if(!c||!c.apiKey) return false;
  const versiones=[CFG.firebase_sdk,'12.19.0','12.18.0','11.10.0'].filter(Boolean);
  for(const v of versiones){
    try{
      const app=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const auth=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);

      FBA.languageCode='es';
      FBLISTO=true;
      return true;
    }catch(e){ /* se intenta la siguiente versión */ }

}

/* ---------- autorización contra la hoja de Google ---------- */
function jsonpPuente(url,payload){
  return new Promise((res,rej)=>{
    const cb='ac'+Date.now()+Math.floor(Math.random()*9999);
    const sc=document.createElement('script'); let listo=false;
    const limpiar=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();};
    const tm=setTimeout(()=>{if(listo)return;limpiar();rej(new Error('tiempo'));},20000);
    window[cb]=j=>{listo=true;limpiar();res(j);};
    sc.onerror=()=>{if(listo)return;limpiar();rej(new Error('red'));};
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&d='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(sc);
  });
}
async function pedirAcceso(correo,nombre){
  const c=normCorreo(correo);
  if(esDocente(c)){ ST.u={u:c,n:nombre||'Docente',c}; ST.esDoc=true; abrirApp(); return; }

  const puente=CFG&&CFG.puente_url;
  if(!puente){
    // Sin puente configurado se usa la lista incrustada en el archivo.
    const al=buscarPorCorreo(c);
    if(!al){ errFB('El correo '+c+' no está en la lista de este curso. Escríbale al docente.'); salirFB(); return; }
    ST.u=al; ST.esDoc=false; abrirApp(); return;
  }
  okFB('Verificando su autorización…');
  try{
    const j=await jsonpPuente(puente,{accion:'acceso',clave:CFG.clave_publica||'',
      datos:{curso:CODIGO,correo:c,nombre:nombre||''}});
    if(!j||!j.ok){ errFB('No se pudo verificar su acceso. Intente de nuevo.'); salirFB(); return; }
    if(j.estado==='aprobado'){
      ST.u={u:c,n:j.nombre||nombre||c,c}; ST.esDoc=false; abrirApp(); return;
    }
    if(j.estado==='rechazado'){ errFB('Su solicitud fue rechazada. Hable con el docente.'); salirFB(); return; }
    pantallaEspera(c);
  }catch(e){
    errFB('No se pudo contactar el sistema de autorización. Intente más tarde.');
    salirFB();
  }
}
