/* ---------- autorización contra la hoja de Google ---------- */
function jsonpPuente(url,payload){
  return new Promise((res,rej)=>{
    const cb='ac'+Date.now()+Math.floor(Math.random()*9999);
    const sc=document.createElement('script'); let listo=false;
    const limpiar=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();};
    const tm=setTimeout(()=>{if(listo)return;limpiar();rej(new Error('El puente respondió algo inesperado. Revise que la clave del Apps Script coincida con la del config.json y que la implementación esté en la última versión.'));},7000);
    window[cb]=j=>{listo=true;limpiar();res(j);};
    sc.onerror=()=>{if(listo)return;limpiar();rej(new Error('red'));};
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&d='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(sc);
  });
}
async function pedirAcceso(correo,nombre){
  const c=normCorreo(correo);
  if(esDocente(c)){ ST.u={u:c,n:nombre||'Docente',c}; ST.esDoc=true; abrirApp(); return; }

  const puente=CFG&&CFG.puente_url;
  if(!puente){
    // Sin puente configurado se usa la lista incrustada en el archivo.
    const al=buscarPorCorreo(c);
    if(!al){ errFB('El correo '+c+' no está en la lista de este curso. Escríbale al docente.'); salirFB(); return; }
    ST.u=al; ST.esDoc=false; abrirApp(); return;
  }
  okFB('Verificando su autorización…');
  try{
    const j=await jsonpPuente(puente,{accion:'acceso',clave:CFG.clave_publica||'',
      datos:{curso:CODIGO,correo:c,nombre:nombre||''}});
    if(!j||!j.ok){
      const er=(j&&j.error)||'';
      errFB(er==='clave-incorrecta'
        ? 'El aula no está bien conectada con el sistema del docente. Avísele: la clave pública del Apps Script no coincide con la del config.json.'
        : 'No se pudo verificar su acceso. Intente de nuevo en unos minutos.');
      salirFB(); return; }
    if(j.estado==='aprobado'){
      ST.u={u:c,n:j.nombre||nombre||c,c}; ST.esDoc=false; abrirApp(); return;
    }
    if(j.estado==='rechazado'){ errFB('Este correo ya está registrado y no tiene acceso autorizado a este curso. Hable con el docente.'); salirFB(); return; }
    pantallaEspera(c);
  }catch(e){
    errFB('No se pudo contactar el sistema de autorización. Intente más tarde.');
    salirFB();
  }
}

async function cargarSolicitudes(){
  const z=document.getElementById('solList'); if(!z)return;
  const puente=CFG&&CFG.puente_url;
  if(!puente){ z.innerHTML='<div class="av2">No hay puente configurado. Las solicitudes requieren la hoja de Google.</div>'; return; }
  abrirProg('Consultando solicitudes','Contactando la hoja de Google…');
  try{
    const j=await jsonpPuente(puente,{accion:'solicitudes',clave:(document.getElementById('solClave')||{}).value||lsG('clave_doc')||'',
      datos:{curso:CODIGO}});
    if(!j||!j.ok){ cerrarProg(esc((j&&j.error)||'No autorizado'),true); z.innerHTML=''; return; }
    lsS('clave_doc',(document.getElementById('solClave')||{}).value||lsG('clave_doc')||'');
    const p=j.lista||[];
    if(!p.length){ cerrarProg('No hay solicitudes pendientes.'); z.innerHTML='<div class="av2" style="background:#E9F9F0;color:#0A5B31">No hay solicitudes pendientes.</div>'; return; }
    cerrarProg(p.length+' solicitud(es) pendiente(s).');
    z.innerHTML=p.map(s=>`<div class="wr2" style="gap:10px">
      <div style="flex:1;min-width:0"><b>${esc(s.nombre||'(sin nombre)')}</b>
        <div style="font-size:12px;color:var(--sua);word-break:break-all">${esc(s.correo)}</div></div>
      <button class="bt sm v" onclick="resolverSol('${esc(s.correo)}','aprobado')">Aprobar</button>
      <button class="bt sm r" onclick="resolverSol('${esc(s.correo)}','rechazado')">Rechazar</button></div>`).join('');
  }catch(e){ cerrarProg(esc(e.message||'No se pudo contactar la hoja.'),true);
    z.innerHTML='<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>El puente no respondió bien.</b><br>'+
      'Suele ser porque la implementación del Apps Script quedó en una versión anterior. '+
      'Entre al editor, pulse <b>Implementar → Administrar implementaciones → lápiz</b>, elija <b>Nueva versión</b> y vuelva a implementar.</div>'; }
  finally{ if(PROG) cerrarProg('Listo.'); }
}
async function resolverSol(correo,estado){
  const puente=CFG&&CFG.puente_url;
  try{
    const j=await jsonpPuente(puente,{accion:'resolver',clave:lsG('clave_doc')||'',
      datos:{curso:CODIGO,correo,estado}});
    if(j&&j.ok){ toast(estado==='aprobado'?'Acceso aprobado.':'Solicitud rechazada.'); sOk(); cargarSolicitudes(); }
    else toast((j&&j.error)||'No se pudo actualizar.');
  }catch(e){ toast('No se pudo contactar el puente.'); }
}

   Un botón que actualiza config.json sin salir del panel.
   ========================================================== */
function ghCfg(){
  try{ return JSON.parse(lsG('gh_cfg')||'{}'); }catch(e){ return {}; }
}
function ghGuardar(o){ lsS('gh_cfg',JSON.stringify(o)); }
async function publicarCfg(){
  const g=ghCfg();
  const repo=(document.getElementById('ghRepo')||{}).value||g.repo||'';
  const ruta=(document.getElementById('ghRuta')||{}).value||g.ruta||'config.json';
  const tok=(document.getElementById('ghTok')||{}).value||g.tok||'';
  const res=document.getElementById('ghRes');
  const di=t=>{ if(res) res.innerHTML=t; };
  if(!repo.includes('/')){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta el repositorio.</b> Escríbalo así: <code>usuario/repositorio</code></div>'); return; }
  if(!tok){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta la llave de acceso.</b></div>'); return; }
  ghGuardar({repo,ruta,tok});
  abrirProg('Publicando cambios','Conectando con GitHub…');
  di('');
  const api='https://api.github.com/repos/'+repo+'/contents/'+ruta;
  const cab={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'};
  try{
    let sha=null;
    const r1=await fetch(api+'?t='+Date.now(),{headers:cab});
    if(r1.status===200){ sha=(await r1.json()).sha; }
    else if(r1.status===404){ sha=null; }
    else if(r1.status===401||r1.status===403){ throw new Error('La llave no tiene permiso sobre ese repositorio.'); }
    else { throw new Error('GitHub respondió '+r1.status); }

    const texto=textoCfg();
    const cuerpo={message:'Actualizar configuración del aula',
      content:btoa(unescape(encodeURIComponent(texto)))};
    if(sha) cuerpo.sha=sha;
    const r2=await fetch(api,{method:'PUT',headers:{...cab,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)});
    if(!r2.ok){ const j=await r2.json().catch(()=>({})); throw new Error(j.message||('GitHub respondió '+r2.status)); }
    cerrarProg('Publicado. Los estudiantes lo ven al recargar, en uno o dos minutos.');
    di('<div class="av2" style="background:#E9F9F0;color:#0A5B31"><b>✅ Publicado:</b> '+nAbiertos()+' encuentro(s) y parciales '+
       (['p1','p2','p3'].filter(k=>PANEL.par[k]).map(k=>k.toUpperCase()).join(', ')||'cerrados')+'.</div>');
  }catch(e){
    cerrarProg(e.message,true);
    di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>No se pudo publicar.</b> '+esc(e.message)+
       '<br>Copie el texto de abajo y péguelo a mano en GitHub.</div>');
  }
}

`CONSTANCIA DE RESULTADO — Competencias Digitales Informacionales
Institución Universitaria del Caribe · UNICARIBE
Programa: ${CURSO.programa} · Semestre ${SEMESTRE}

Estudiante: ${D.nombre}
Usuario: ${D.usuario}
Correo: ${D.correo}
Parcial: ${p.titulo} (${p.cubre})
Intento: ${D.intento} de 2 — máxima ${PX.max.toFixed(1)} — aprueba con ${PX.min.toFixed(1)}
Respuestas correctas: ${ok} de ${tot}
NOTA OBTENIDA: ${nota.toFixed(1)}
Resultado: ${apr?'APROBADO':'NO APROBADO'}
${porT?'Observación: se cerró por tiempo agotado.\n':''}Fecha: ${fecha}

--- NO MODIFIQUE ESTE CÓDIGO ---
${D.codigo}
--------------------------------
Si alguna cifra se altera, el código deja de coincidir y el docente lo detecta.
Adjunte también la imagen de la constancia.

Docente: Rosembergth Castro Cervantes — ${CORREO_DOC}`);
 const asuntoTxt=(`[CDI] ${p.titulo} — ${D.nombre} — Nota ${nota.toFixed(1)} — Intento ${D.intento}`);
 const asunto=encodeURIComponent(asuntoTxt);
 const cuerpoTxt=decodeURIComponent(cuerpo);
 window._TXT=cuerpoTxt;
 const seg=PX.intento===1;  // siempre se ofrece el segundo intento
 ov.innerHTML=`<div class="md"><div class="bx"><div class="rs">
  <div class="nt ${apr?'o':'m'}">${nota.toFixed(1)}</div>
  <div class="ms">${ok} de ${tot} correctas · Intento ${D.intento} · máx. ${PX.max.toFixed(1)} · aprueba con ${PX.min.toFixed(1)}<br>
   <b style="color:${apr?'var(--ver)':'var(--mal)'}">${apr?'Aprobado':'No aprobado'}</b>
   ${porT?'<br><span style="font-size:13px">Se cerró por tiempo agotado.</span>':''}</div>
  <div class="acciones">
   ${navigator.canShare
     ? `<button class="acc p" onclick="compartirConstancia()">
          <span class="num">1</span><span class="tx"><b>Compartir constancia</b>
          <span>Abre el menú del teléfono con la imagen ya adjunta: WhatsApp, Gmail o Mail</span></span><span class="fl">›</span></button>`
     : `<button class="acc p" onclick="bajarConst()">
          <span class="num">1</span><span class="tx"><b>Guardar constancia</b>
          <span>Este equipo no permite compartir: la imagen se descarga</span></span><span class="fl">›</span></button>`}
   <a class="acc s" target="_blank" rel="noopener" href="${enlaceGmail(CORREO_DOC,CORREO_CC,asuntoTxt,cuerpoTxt)}">
     <span class="num">2</span><span class="tx"><b>Enviar al docente</b>
     <span>Abre Gmail con el mensaje ya escrito</span></span><span class="fl">›</span></a>
   <button class="acc" onclick="cerrarOv();go(cur)">
     <span class="num">3</span><span class="tx"><b>Cerrar</b>
     <span>Volver al encuentro</span></span><span class="fl">›</span></button>
  ${seg?`<div class="avisoSeg">
    <b>¿Quiere intentarlo otra vez?</b>
    <p>Tiene derecho a un <b>segundo intento</b>, con nota máxima <b>${notaDe(PX.key,2).max.toFixed(1)}</b>.</p>
    <p class="rojo">⚠️ Piénselo bien: si en el segundo intento saca <b>menos</b> de ${nota.toFixed(1)},
    <b>queda registrada la nota más baja</b>. No se guarda la mejor de las dos, sino la última.</p>
    <button class="bt n" onclick="segundo()">Iniciar segundo intento</button>
  </div>`:''}
  <div class="av2" style="text-align:left"><b>Cómo se envía.</b> En el celular use <b>Compartir constancia</b> y elija Gmail o WhatsApp. En computador use <b>Enviar por Gmail</b> y adjunte la imagen. El texto lleva el mismo código:
   <b>si se altera una cifra, el código deja de coincidir</b> y el docente lo detecta.</div>
  <div id="envioHoja" class="av2" style="text-align:left">Registrando su nota…</div>
  <div class="cod">${D.codigo}</div>
  ${seg?`<div class="av2" style="text-align:left"><b>Segundo intento.</b> La nota se calcula sobre <b>3.8</b> y aprueba con <b>2.9</b>. Revise primero las respuestas.</div>`:''}
  ${(!apr&&PX.intento===2)?`<div class="av2" style="text-align:left">Ya usó los dos intentos. Escriba a ${CORREO_DOC} para acordar la recuperación.</div>`:''}
  </div><div class="rv"><h3 style="font-family:var(--fd);font-size:16px;margin:0 0 6px">Revisión de respuestas</h3>${rev}</div></div></div>`;
 window._D=D;
 ARCHIVO_LISTO=null; prepararArchivo(D);
 // La nota viaja sola a la hoja del docente: ya no depende del correo del estudiante.
 if(CFG&&CFG.puente_url){
   jsonpPuente(CFG.puente_url,{accion:'resultado',clave:CFG.clave_publica||'',
     datos:{curso:CODIGO,correo:(ST.u&&ST.u.c)||'',nombre:(ST.u&&ST.u.n)||'',
            parcial:PX.key,intento:PX.intento,nota:nota,aprobo:apr,
            aciertos:ok,total:tot,codigo:D.codigo}})
     .then(()=>{ const e=document.getElementById('envioHoja');
        if(e) e.innerHTML='<b style="color:var(--ver)">✅ Su nota quedó registrada en el sistema del docente.</b>'; })
     .catch(()=>{ const e=document.getElementById('envioHoja');
        if(e) e.innerHTML='<b style="color:var(--nar)">⚠️ No se pudo registrar automáticamente. Envíe la constancia al docente.</b>'; });
 }
}
function bajarConst(){constPNG(window._D).then(u=>{const a=document.createElement('a');
 a.href=u;a.download='Constancia_'+window._D.parcial+'_'+ST.u.u+'.png';a.click();toast('Constancia descargada.');sOk()})}
function segundo(){const k=PX.key;cerrarOv();rubrica(k);}

document.addEventListener('keydown',e=>{
 if(document.getElementById('lg').style.display!=='none'&&e.key==='Enter')entrar();
 if(ov.innerHTML.trim()!==''||!ST.u)return;
 if(vAct.startsWith('s')){const i=+vAct.slice(1);
  if(e.key==='ArrowRight'&&acces(i+1))go(i+1); if(e.key==='ArrowLeft'&&i>0)go(i-1)}
});
window.addEventListener('hashchange',()=>{ST.habil=null;if(ST.u){buildNav();vista('aula')}});
cargarConfig().then(async()=>{
  if(CFG&&CFG.firebase&&CFG.firebase.apiKey){
    const ok=await cargarFirebase();
    if(ok){ pantallaFirebase(); return; }
  }
  montarIngreso();
});
</script>
</body>
</html>
