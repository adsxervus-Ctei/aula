<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CURSO DE PRUEBA · Aula UNICARIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mor:#5C2483;--mor2:#3B1557;--morcl:#F3EDF8;--ver:#00A551;--nar:#F9A01B;--ama:#FFC72C;
 --tin:#241833;--sua:#5C5470;--lin:rgba(92,36,131,.15);--gris:#F6F4F9;--mal:#D64545;
 --fd:'Poppins',sans-serif;--fb:'Inter',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--gris);color:var(--tin);-webkit-font-smoothing:antialiased}

/* LOGIN */
#lg{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
 background:linear-gradient(140deg,var(--mor2),var(--mor) 55%,#7A35A8)}
#lg::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(249,160,27,.13);top:-180px;right:-160px}
#lg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(0,165,81,.12);bottom:-140px;left:-120px}
.lgc{background:#fff;border-radius:22px;padding:34px 32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.34);position:relative;z-index:2;animation:up .6s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.lgc img{width:186px;display:block;margin:0 auto 16px}
.lgc h1{font-family:var(--fd);font-size:20px;margin:0 0 4px;text-align:center;font-weight:600}
.lgc .s{font-size:13.5px;color:var(--sua);text-align:center;margin-bottom:20px;line-height:1.5}
label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mor);font-weight:700;margin-bottom:5px}
.inp{width:100%;font-family:var(--fb);font-size:15px;padding:12px 14px;border:1.5px solid var(--lin);border-radius:11px;margin-bottom:13px;transition:.15s}
.inp:focus{outline:none;border-color:var(--mor);box-shadow:0 0 0 3px rgba(92,36,131,.12)}
.inp.mono{font-family:var(--fm);letter-spacing:.09em;text-transform:uppercase}
.err{color:var(--mal);font-size:13px;margin:-6px 0 12px;display:none;background:#FCE9E9;padding:9px 12px;border-radius:9px}
.lk{display:block;text-align:center;font-size:12.5px;color:var(--mor);margin-top:13px;cursor:pointer;text-decoration:underline}

/* APP */
#ap{display:none;min-height:100vh}
#ap.on{display:flex}
.side{width:255px;flex:0 0 255px;background:var(--mor);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:90}
.side .lo{background:#fff;padding:15px;border-bottom:4px solid var(--nar);position:relative}
.side .lo img{width:100%;display:block}
.cls{display:none;position:absolute;top:7px;right:7px;background:var(--mor);color:#fff;border:none;width:31px;height:31px;border-radius:9px;font-size:15px;cursor:pointer}
.me{padding:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.me .r{display:flex;gap:11px;align-items:center}
.me .av{width:42px;height:42px;border-radius:50%;background:var(--ama);color:var(--mor2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;flex:0 0 auto}
.me .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.me .us{font-family:var(--fm);font-size:10.5px;color:rgba(255,255,255,.68)}
.pr{margin-top:12px}
.pr .b{height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.pr .b i{display:block;height:100%;background:linear-gradient(90deg,var(--ver),var(--ama));border-radius:5px;transition:width .5s}
.pr .t{font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.72);margin-top:5px}
.side nav{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nb{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:rgba(255,255,255,.86);font-family:var(--fb);font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nb:hover{background:rgba(255,255,255,.13)}
.nb.on{background:#fff;color:var(--mor);font-weight:600}
.nb .ic{font-size:15px}
.sep{font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ama);padding:12px 11px 5px;font-weight:600}
.side .ft{padding:13px 15px 17px;border-top:1px solid rgba(255,255,255,.15)}
.side .ft .fi{background:#fff;border-radius:9px;padding:5px 7px;margin-bottom:8px}
.side .ft .fi img{width:100%;max-height:50px;object-fit:contain;display:block}
.side .ft p{margin:0;font-size:11px;color:rgba(255,255,255,.72);line-height:1.55}
.side .ft b{display:block;color:#fff;font-size:12px}
.sb{margin-top:9px;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;font-family:var(--fm);font-size:10.5px;padding:7px;border-radius:8px;cursor:pointer}
.sb:hover{background:rgba(255,255,255,.26)}
main{flex:1;min-width:0;padding-bottom:50px}
.top{background:#fff;border-bottom:1px solid var(--lin);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:60}
.tl{display:flex;align-items:center;gap:11px;min-width:0}
.tlogo{display:none;height:28px}
.burg{display:none;background:var(--mor);color:#fff;border:none;border-radius:9px;width:38px;height:36px;font-size:16px;cursor:pointer}
.t1{font-family:var(--fd);font-weight:600;font-size:14.5px}
.t2{font-family:var(--fm);font-size:10.5px;color:var(--sua)}
.wr{max-width:1020px;margin:0 auto;padding:24px 26px}
.rin{opacity:0;transform:translateY(15px);animation:ri .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes ri{to{opacity:1;transform:translateY(0)}}

/* AULA */
.hd{background:linear-gradient(120deg,var(--mor),var(--mor2));color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(249,160,27,.2);animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
.hd h1{font-family:var(--fd);font-size:clamp(20px,3vw,28px);margin:0 0 7px;font-weight:600;position:relative}
.hd p{margin:0;font-size:14.5px;color:rgba(255,255,255,.87);line-height:1.6;max-width:60ch;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.cw{background:#fff;border:1px solid var(--lin);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;display:flex;flex-direction:column}
.cw:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(92,36,131,.14)}
.cw.bl{opacity:.6;cursor:not-allowed}.cw.bl:hover{transform:none;box-shadow:none}
.cw .bn{height:78px;background:linear-gradient(120deg,var(--mor),#7A35A8);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#fff}
.cw.u2 .bn{background:linear-gradient(120deg,#0E7A52,var(--ver))}
.cw.u3 .bn{background:linear-gradient(120deg,#B06E00,var(--nar))}
.cw .bn .n{font-family:var(--fd);font-size:31px;font-weight:700;line-height:1}
.cw .bn .st{font-size:21px}
.cw .bd{padding:14px 17px 17px;flex:1;display:flex;flex-direction:column}
.cw h3{font-family:var(--fd);font-size:15px;margin:0 0 6px;font-weight:600;line-height:1.3}
.cw p{margin:0;font-size:12.5px;color:var(--sua);line-height:1.5;flex:1}
.cw .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-family:var(--fm);font-size:9.5px;background:var(--morcl);color:var(--mor);padding:4px 8px;border-radius:12px;font-weight:600}
.tag.n{background:#FFF3DC;color:#9A6100}
.tag.v{background:#E3F6EC;color:#046B36}

/* SEMANA */
h2.sc{font-family:var(--fd);font-weight:600;font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sc::before{content:'';width:5px;height:20px;background:var(--nar);border-radius:3px}
.cd{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.cd h3{font-family:var(--fd);font-size:16px;margin:0 0 9px;font-weight:600}
.cd p{margin:0 0 8px;font-size:14.5px;line-height:1.62;color:var(--sua)}
.cd p:last-child{margin:0}
.cd b{color:var(--tin)}
ul.pt{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
ul.pt li{font-size:14.5px;line-height:1.55;color:var(--sua)}
ul.pt li b{color:var(--tin)}
.ob{background:var(--mor);color:#fff;border-radius:14px;padding:18px 21px}
.ob .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ama);font-weight:600;margin-bottom:5px}
.ob p{margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.95)}
.tw{overflow-x:auto;border-radius:10px}
.tw::-webkit-scrollbar{height:7px}.tw::-webkit-scrollbar-thumb{background:var(--lin);border-radius:5px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;min-width:470px}
table.tb th{background:var(--mor);color:#fff;text-align:left;padding:9px 12px;font-family:var(--fm);font-size:10px;text-transform:uppercase;white-space:nowrap}
table.tb td{border:1px solid var(--lin);padding:9px 12px;line-height:1.5;vertical-align:top}
table.tb tr:nth-child(even) td{background:var(--morcl)}
.th{display:none;font-family:var(--fm);font-size:10.5px;color:var(--sua);margin-top:5px}
.vd{background:#000;border-radius:14px;overflow:hidden;position:relative;padding-top:56.25%}
.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{font-size:12.5px;color:var(--sua);margin-top:7px;line-height:1.5}
.ejc{background:#fff;border:1px solid var(--lin);border-left:5px solid var(--ver);border-radius:0 14px 14px 0;padding:16px 19px;margin-bottom:11px;transition:.2s}
.ejc:hover{transform:translateX(4px)}
.ejc .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ver);font-weight:600}
.ejc h3{font-family:var(--fd);font-size:16px;margin:5px 0 7px;font-weight:600}
.ejc p{margin:0 0 7px;font-size:14px;line-height:1.58;color:var(--sua)}
.ejc ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ejc li{font-size:13.5px;line-height:1.5;color:var(--sua)}
.tl2{background:linear-gradient(135deg,#FFF8EC,#FFF1D6);border:1px solid rgba(249,160,27,.42);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.tl2 .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A6100;font-weight:700}
.tl2 h3{font-family:var(--fd);font-size:17px;margin:5px 0 3px;font-weight:600;color:#5A3A00}
.tl2 .m{font-family:var(--fm);font-size:11px;color:#9A6100;margin-bottom:9px}
.tl2 ol{margin:0 0 9px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tl2 li{font-size:14px;line-height:1.55;color:#4A3200}
.tl2 .lo{background:rgba(255,255,255,.8);border-radius:9px;padding:9px 12px;font-size:13px;color:#5A3A00}
.rcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}
.rc{display:flex;gap:11px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:13px 15px;text-decoration:none;color:inherit;transition:.16s}
.rc:hover{border-color:var(--mor);transform:translateY(-3px)}
.rc .i{width:31px;height:31px;border-radius:9px;background:var(--morcl);color:var(--mor);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rc b{display:block;font-size:13.5px}.rc span{display:block;font-size:12px;color:var(--sua);line-height:1.45;margin-top:2px}
.dn{background:linear-gradient(135deg,#E9F9F0,#DCF5E8);border:1.5px solid rgba(0,165,81,.4);border-radius:14px;padding:19px 22px;margin-top:20px;text-align:center}
.dn h3{font-family:var(--fd);font-size:16.5px;margin:0 0 6px;color:#046B36;font-weight:600}
.dn p{margin:0 0 13px;font-size:14px;color:#0A5B31;line-height:1.55}
.nv{display:flex;justify-content:space-between;gap:11px;margin-top:24px}
.bt{font-family:var(--fd);font-weight:600;font-size:14px;border:none;border-radius:10px;padding:12px 19px;cursor:pointer;background:var(--mor);color:#fff;transition:.16s}
.bt:hover:not(:disabled){background:var(--mor2);transform:translateY(-1px)}
.bt:disabled{opacity:.34;cursor:not-allowed}
.bt.g{background:#fff;color:var(--mor);border:1px solid var(--lin)}
.bt.v{background:var(--ver)}.bt.n{background:var(--nar);color:#3B1557}
.bt.big{font-size:15.5px;padding:14px 27px}
.bl2{background:#FFF3DC;border:1px solid var(--nar);border-radius:14px;padding:22px 26px;text-align:center}
.bl2 .i{font-size:38px}.bl2 h3{font-family:var(--fd);font-size:18px;margin:8px 0 6px;color:#7A4E00}
.bl2 p{margin:0;font-size:14px;color:#8A5A00;line-height:1.6}
.pxb{background:linear-gradient(120deg,var(--nar),#E08600);color:#3B1557;border-radius:16px;padding:22px 25px;margin-top:19px}
.pxb h3{font-family:var(--fd);font-size:20px;margin:0 0 6px;font-weight:700}
.pxb p{margin:0 0 12px;font-size:14px;line-height:1.55}

/* PROGRESO */
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.kp{background:var(--mor);color:#fff;border-radius:14px;padding:16px 19px}
.kp b{display:block;font-family:var(--fd);font-size:29px;line-height:1}
.kp span{font-family:var(--fm);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.82}
.kp.v{background:var(--ver)}.kp.n{background:var(--nar);color:#3B1557}
.lr{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.lr .n{font-family:var(--fm);font-weight:700;font-size:12px;background:var(--morcl);color:var(--mor);padding:5px 9px;border-radius:7px}
.lr .t{flex:1;font-size:14px}
.lr .s{font-family:var(--fm);font-size:12px}

/* MODALES / QUIZ */
.md{position:fixed;inset:0;background:rgba(36,24,51,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md .bx{background:#fff;border-radius:18px;max-width:800px;width:100%;padding:26px 28px;max-height:93vh;overflow-y:auto;animation:up .45s cubic-bezier(.2,.9,.25,1)}
.md h3{font-family:var(--fd);font-size:21px;margin:0 0 4px;font-weight:600}
.md .sb2{font-family:var(--fm);font-size:11.5px;color:var(--sua);margin-bottom:15px}
.cdn{position:fixed;inset:0;background:var(--mor);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cdn .n{font-family:var(--fd);font-size:clamp(88px,25vw,225px);font-weight:700;color:var(--ama);line-height:1;animation:pp .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pp{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.cdn .l{font-family:var(--fm);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px}
.qb{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:15px;flex-wrap:wrap}
.tm{font-family:var(--fm);font-size:24px;font-weight:600;background:var(--mor);color:#fff;padding:8px 14px;border-radius:10px}
.tm.w{background:var(--nar);color:#3B1557}.tm.c{background:var(--mal);color:#fff}
.tm.bt2{animation:bb .9s ease-in-out infinite}
@keyframes bb{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.09)}48%{transform:scale(1)}}
.pg{flex:1;min-width:100px;height:8px;background:var(--morcl);border-radius:5px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ver);border-radius:5px;transition:width .3s}
.qt{font-family:var(--fd);font-size:17.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.op{text-align:left;background:#fff;border:2px solid var(--lin);border-radius:11px;padding:12px 15px;font-family:var(--fb);font-size:14.5px;cursor:pointer;transition:.13s;display:flex;gap:10px;width:100%;margin-bottom:8px}
.op:hover{border-color:var(--mor);background:var(--morcl);transform:translateX(3px)}
.op .l{font-family:var(--fm);font-weight:600;color:var(--mor);flex:0 0 auto}
.rs{text-align:center}
.rs .nt{font-family:var(--fd);font-size:70px;font-weight:700;line-height:1;animation:pp .6s cubic-bezier(.2,1.3,.4,1)}
.rs .nt.o{color:var(--ver)}.rs .nt.m{color:var(--mal)}
.rs .ms{font-size:14.5px;color:var(--sua);margin:6px 0 15px}
.rv{text-align:left;margin-top:17px;border-top:1px solid var(--lin);padding-top:13px}
.rv .it{padding:10px 0;border-bottom:1px solid var(--lin);font-size:13.5px;line-height:1.55}
.rv .it:last-child{border:none}
.rv .s2{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:7px}
.rv .s2.o{background:#E3F6EC;color:var(--ver)}.rv .s2.m{background:#FCE9E9;color:var(--mal)}
.rv .ex{color:var(--sua);margin-top:4px;font-size:13px}
.av2{background:var(--morcl);border:1px solid var(--lin);border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.55;color:var(--sua);margin-top:12px}
.av2 b{color:var(--mor)}
.cod{font-family:var(--fm);font-size:11px;background:#241833;color:#7CFFB2;padding:11px 13px;border-radius:9px;word-break:break-all;line-height:1.5;margin-top:10px}
.wr2{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--lin);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.wr2 input{width:17px;height:17px;accent-color:var(--mor)}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--mor2);color:#fff;padding:13px 21px;border-radius:12px;font-size:14px;z-index:350;opacity:0;transition:.35s;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);width:268px}
 .side.abierta{transform:translateX(0);box-shadow:14px 0 44px rgba(0,0,0,.32)}
 .cls,.burg,.tlogo{display:block}
 .t1,.t2{display:none}
 .wr{padding:17px 14px}.top{padding:9px 13px}
 .hd{padding:21px 19px}.md .bx{padding:19px 15px}
 .th{display:block}
 .nv{flex-direction:column}.nv .bt{width:100%}
 .grid{grid-template-columns:1fr}
}
@media print{
 .side,.top,.nv,.pxb,.dn,#lg{display:none!important}
 body{background:#fff}.wr{max-width:100%;padding:0}.vd{display:none}
}

.tabf{flex:1;border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:9px 6px;border-radius:10px;cursor:pointer;color:var(--sua);transition:.16s}
.tabf.on{background:#fff;color:var(--mor);box-shadow:0 2px 8px rgba(92,36,131,.14)}
#lg .lgc{max-width:430px}

.avisoSeg{background:linear-gradient(135deg,#FFF8EC,#FFF1D9);border:1.5px solid rgba(249,160,27,.55);
  border-radius:14px;padding:16px 18px;margin-top:16px;text-align:left}
.avisoSeg b{color:#7A4E00}
.avisoSeg p{font-size:13.8px;line-height:1.6;color:#7A4E00;margin:8px 0 0}
.avisoSeg p.rojo{background:#FDECEC;border:1px solid rgba(214,69,69,.4);border-radius:10px;
  padding:11px 13px;color:#9A1F1F;margin-top:11px}
.avisoSeg p.rojo b{color:#7A1010}
.avisoSeg .bt{margin-top:13px}

.pestas{display:flex;gap:7px;overflow-x:auto;padding:4px;background:var(--morcl);border-radius:14px;margin-bottom:16px;scrollbar-width:none}
.pestas::-webkit-scrollbar{display:none}
.pst{border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:10px 15px;border-radius:11px;cursor:pointer;color:var(--sua);white-space:nowrap;transition:.16s}
.pst:hover{color:var(--mor)}
.pst.on{background:#fff;color:var(--mor);box-shadow:0 2px 9px rgba(92,36,131,.16)}
.nt{font-family:var(--fm);font-weight:700;font-size:13.5px;padding:3px 9px;border-radius:8px;display:inline-block;position:relative}
.nt.ok{background:#E3F6EC;color:#046B36}
.nt.no{background:#FCE9E9;color:#8A2020}
.nt.na{background:#EFEDF3;color:var(--sua)}
.nt i{font-style:normal;font-size:8.5px;opacity:.7;margin-left:3px;vertical-align:super}
@media(max-width:700px){.pestas{padding:3px}.pst{font-size:12.5px;padding:9px 12px}}

/* ===== PANEL: PESTAÑAS ===== */
.pestas{display:flex;gap:8px;justify-content:center;padding:5px;background:var(--morcl);
  border-radius:16px;margin-bottom:18px;flex-wrap:wrap}
.pst{border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:11px 18px;border-radius:12px;cursor:pointer;color:var(--sua);white-space:nowrap;
  transition:.16s;display:flex;align-items:center;gap:8px}
.pst svg{width:17px;height:17px;flex:0 0 auto}
.pst:hover{color:var(--mor)}
.pst.on{background:#fff;color:var(--mor);box-shadow:0 3px 11px rgba(92,36,131,.17)}
.resumen{background:var(--morcl);border-radius:12px;padding:10px 15px;font-size:13.5px;color:var(--mor);margin-bottom:14px}

/* ===== PANEL: BARRA INFERIOR EN CELULAR ===== */
.pbnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--lin);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:120;box-shadow:0 -4px 18px rgba(59,21,87,.1)}
.pbnav button{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;min-height:58px;padding:8px 2px;cursor:pointer;color:var(--sua);
  font-size:10.5px;font-weight:600;border-radius:14px;touch-action:manipulation}
.pbnav button svg{width:21px;height:21px;pointer-events:none}
.pbnav button span{pointer-events:none}
.pbnav button:active{background:var(--morcl);transform:scale(.95)}
.pbnav button.on{color:var(--mor);background:var(--morcl)}

/* ===== VENTANA DE PROGRESO ===== */
.bxprog{max-width:360px;text-align:center}
.progAro{position:relative;width:110px;height:110px;margin:0 auto 16px}
.progAro svg{transform:rotate(-90deg);width:110px;height:110px}
.progAro .pist{stroke:var(--morcl)}
.progAro .marc{stroke:var(--mor);stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.bxprog.ok .progAro .marc{stroke:var(--ver)}
.bxprog.err .progAro .marc{stroke:var(--mal)}
.pgTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px}
.pgTxt b{font-family:var(--fd);font-size:29px;line-height:1}
.pgTxt span{font-size:14px;color:var(--sua);margin-top:5px}
.pgDet{font-size:13.5px;color:var(--sua);line-height:1.6;margin:8px 0 0}

/* ===== BARRA LATERAL PLEGABLE ===== */
.plegar{position:absolute;right:9px;top:9px;width:27px;height:27px;border-radius:8px;border:none;
  background:rgba(92,36,131,.12);color:var(--mor);cursor:pointer;font-size:13px;line-height:1}
.plegar:hover{background:rgba(92,36,131,.22)}
body.plegado .side{display:none}
.abrirMenu{display:none;background:var(--mor);color:#fff;border:none;border-radius:10px;
  width:38px;height:36px;font-size:16px;cursor:pointer}
body.plegado .abrirMenu{display:block}

/* ===== BOTONES DEL RESULTADO ===== */
.acciones{display:flex;flex-direction:column;gap:9px;margin:16px 0 4px;text-align:left}
.acc{display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid var(--lin);
  border-radius:14px;padding:13px 16px;cursor:pointer;font-family:var(--fb);font-size:14.5px;
  color:var(--tin);text-decoration:none;transition:.16s;width:100%;text-align:left}
.acc:hover{border-color:var(--mor);transform:translateX(3px);box-shadow:0 5px 15px rgba(92,36,131,.12)}
.acc .num{width:29px;height:29px;border-radius:50%;background:var(--mor);color:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13.5px}
.acc.p .num{background:var(--ver)}
.acc.s .num{background:var(--nar);color:#3B1557}
.acc .tx{flex:1;min-width:0}
.acc .tx b{display:block;font-weight:600;line-height:1.25}
.acc .tx span{display:block;font-size:12px;color:var(--sua);margin-top:2px;line-height:1.35}
.acc .fl{color:var(--sua);font-size:16px}

@media(max-width:820px){
  .pestas{display:none}
  .pbnav{display:flex}
  body.panelAbierto .wr{padding-bottom:98px}
}

{n:1,unidad:'MÓDULO 1 · FUNDAMENTOS DEL DOCUMENTO',tema:'La idea de negocio y la portada profesional',
 intro:'Hoy arranca un documento que no se bota al final del semestre. Cada uno va a escoger un <b>negocio que quisiera montar de verdad</b>, y durante ocho encuentros va a construir su plan de negocio. Word deja de ser un ejercicio: es la herramienta con la que usted arma algo que le sirve.',
 objetivo:'Elegir la idea de negocio que se trabajará todo el curso, crear el documento con la configuración correcta y producir una <b>portada profesional</b>.',
 contenido:[
  {t:'Cómo vamos a trabajar: el celular escribe, el computador arma',
   p:'Casi ninguno tiene computador en casa, pero todos tienen celular. Ese es el punto de partida, no un problema.',
   tabla:{c:['Dónde','Qué se hace ahí','Cuándo'],
    f:[['<b>Celular</b>','Escribir el contenido, aplicar estilos de título, tablas simples, fotos','Encuentros 2 a 6, y en la casa'],
       ['<b>Sala de cómputo</b>','Índice automático, encabezados, numeración, exportar a PDF','Encuentros 1, 7 y 8'],
       ['<b>OneDrive</b>','Guarda el mismo archivo y lo sincroniza entre los dos','Siempre']]},
   p2:'<b>Instale Word con su cuenta Microsoft y guarde en OneDrive desde hoy.</b> Si trabaja en Google Docs, al exportar a Word se le daña el formato.'},
  {t:'Qué es un plan de negocio y por qué se escribe',
   lista:['Es el documento con el que usted le explica a otro <b>qué va a hacer, para quién y con cuánto</b>.',
    'Lo pide un banco antes de prestar, una convocatoria antes de asignar recursos, y un socio antes de entrar.',
    'Pero el primer beneficiado es usted: <b>escribirlo obliga a responder preguntas que uno prefiere no hacerse</b>.',
    'La mayoría de las ideas de negocio se caen en el papel, no en la calle. Y caerse en el papel cuesta cero pesos.']},
  {t:'La portada: lo primero que se juzga',
   lista:['Debe traer: <b>nombre del negocio</b>, tipo de documento, autor, ciudad y fecha.',
    'El nombre del archivo también comunica: <code>PlanNegocio_NombreDelNegocio_2026.docx</code>, no <code>Documento1</code>.',
    'Configuración base: márgenes normales, letra legible en 11 o 12 puntos, interlineado 1,15.',
    'La portada va en <b>su propia hoja</b>. Eso se logra con <b>salto de página</b>, nunca dando Enter muchas veces.']}
 ],
 video:{id:'gqTw6fW52pw',t:'Cómo crear y guardar un documento en Word',d:'Lo básico bien hecho: crear, nombrar y guardar donde se pueda encontrar después. Sígalo con su documento abierto.'},
 ejemplos:[
  {t:'Los veinte Enter de la portada',c:'Una estudiante hace su portada bajando el texto con la tecla Enter hasta que queda en la mitad de la hoja. Se ve bien.',
   p:['Al agregar una línea más arriba, <b>todo se corre</b> y la portada se parte en dos hojas.',
    'Cada vez que edita algo, tiene que volver a acomodar los Enter a mano.',
    'Con <b>salto de página</b>, la portada queda fija: pase lo que pase arriba, lo demás empieza en hoja nueva.',
    'Son dos teclas contra veinte, y una hora de correcciones ahorrada al final.'],
   m:'La mayoría de los problemas de formato en Word vienen de resolver con la tecla Enter algo que tiene su propia herramienta.'},
  {t:'La idea que no resistió una pregunta',c:'Un estudiante quiere montar un café internet en su vereda. En la primera clase le hacen una sola pregunta: ¿cuántas personas de la vereda tienen datos en el celular?',
   p:['No lo sabía. Fue, preguntó y contó: casi todos tenían.',
    'El negocio como lo había pensado —vender navegación por horas— ya no tenía cliente.',
    'Pero descubrió otra cosa: nadie tenía <b>impresora ni cómo llenar formularios en línea</b>.',
    'Cambió el negocio a papelería digital con trámites. La idea mejoró porque se escribió.'],
   m:'Escribir el plan no mata las ideas malas: las <b>corrige a tiempo</b>, cuando corregirlas todavía es gratis.'},
  {t:'El documento sin dueño',c:'Llega a una alcaldía una propuesta de proyecto sin portada: empieza directamente con el texto.',
   p:['No decía quién lo presentaba ni cómo contactarlo.',
    'Tenía buena información, pero nadie sabía a quién llamar para pedir aclaraciones.',
    'Se archivó sin respuesta. No por malo: por anónimo.',
    'La portada no es adorno: es la <b>identificación</b> del documento y de quien responde por él.'],
   m:'Un documento sin portada es un documento sin dueño. Y a los documentos sin dueño nadie los llama.'}
 ],
 taller:{t:'Mi idea de negocio y mi portada',modo:'Individual · sala de cómputo · 60 minutos',
  pasos:['Escriba en el cuaderno tres ideas de negocio que le gustaría montar. Piense en lo que hace falta en su municipio.',
   'Escoja una y responda en tres líneas: <b>qué vendo, a quién y por qué me lo comprarían</b>.',
   'Abra Word, cree el documento y guárdelo en OneDrive como <code>PlanNegocio_SuNegocio_2026.docx</code>.',
   'Configure márgenes normales, letra de 12 puntos e interlineado 1,15.',
   'Haga la portada: nombre del negocio, "Plan de Negocio", su nombre, el municipio y la fecha.',
   'Inserte un <b>salto de página</b> al final de la portada y escriba en la hoja 2 el título "Contenido". Ahí irá el índice en el encuentro 7.'],
  logro:'El documento existe en OneDrive con el nombre correcto, la portada en su propia hoja separada por salto de página, y la idea de negocio definida en tres líneas.'},
 tarea:'Termine la portada y <b>verifique desde el celular</b> que el documento abre en la app de Word y se ve igual. Escriba además, en el cuaderno, la respuesta a esta pregunta que vamos a usar la próxima clase: <b>¿qué problema concreto resuelve su negocio y a quién se lo resuelve?</b> Pregúntele a tres personas de su barrio o vereda si ese problema les suena real. Traiga lo que le dijeron.',
 recursos:[{i:'📘',t:'Primeros pasos con Word',d:'Manual oficial en PDF, acceso abierto',u:'https://ast.aragon.es/sites/default/files/primerospasosword2016_0.pdf'}]},

{n:2,unidad:'MÓDULO 1 · FUNDAMENTOS DEL DOCUMENTO',tema:'El problema, la justificación y los objetivos',
 intro:'Hoy escribe la parte que sostiene todo lo demás: <b>por qué su negocio debería existir</b>. Y aprende la herramienta más importante y más ignorada de Word — los <b>estilos de título</b>. Hoy no va a entender del todo para qué sirven. En el encuentro 7 lo va a entender de golpe.',
 objetivo:'Redactar el planteamiento del problema, la justificación y los objetivos del negocio, aplicando <b>estilos de título</b> y listas para estructurar el documento.',
 contenido:[
  {t:'Los estilos de título: el trabajo invisible',
   p:'Poner un texto en negrita y grande <b>no lo convierte en un título</b>. Se ve igual, pero Word no sabe que es un título.',
   lista:['Un <b>estilo</b> le dice a Word: "esto es un título de nivel 1". Word lo recuerda y puede usarlo después.',
    'Con estilos aplicados, Word arma <b>solo</b> el índice, el panel de navegación y la numeración.',
    'Sin estilos, todo eso hay que hacerlo a mano — y se daña cada vez que se agrega una página.',
    '<b>Y esto sí se puede hacer desde el celular.</b> Es de lo poco avanzado que la app permite.']},
  {t:'La jerarquía del documento',
   tabla:{c:['Estilo','Para qué','Ejemplo en su plan'],
    f:[['<b>Título 1</b>','Capítulos principales','"2. Estudio de mercado"'],
       ['<b>Título 2</b>','Secciones dentro de un capítulo','"2.1 Perfil del cliente"'],
       ['<b>Título 3</b>','Detalles dentro de una sección','"2.1.1 Rango de edad"'],
       ['<b>Normal</b>','El texto corriente','Los párrafos']]},
   p:'Regla: si algo va a aparecer en el índice, <b>tiene que llevar estilo de título</b>. Si no lo lleva, no aparece. Así de simple.'},
  {t:'Problema, justificación y objetivos: qué es cada cosa',
   lista:['<b>Problema:</b> qué le falta o qué le duele a alguien. Se escribe en términos de <b>otra persona</b>, no suyos.',
    '<b>Justificación:</b> por qué vale la pena resolverlo. Cuánta gente lo tiene, qué pasa si nadie lo resuelve.',
    '<b>Objetivo general:</b> qué va a lograr el negocio. Un solo verbo, medible.',
    '<b>Objetivos específicos:</b> tres o cuatro pasos concretos para llegar allá. Cada uno con verbo en infinitivo.',
    'Error frecuente: escribir como objetivo "vender mucho". Eso no es objetivo, es deseo. <b>"Vender 200 unidades mensuales al cierre del primer año"</b> sí lo es.']}
 ],
 demoEstilos:true,
 ejemplos:[
  {t:'El problema que era del dueño, no del cliente',c:'Un estudiante escribe: "el problema es que no tengo trabajo y necesito generar ingresos".',
   p:['Eso es cierto y es un problema — pero es <b>suyo</b>, no del cliente.',
    'A nadie le compran algo porque el vendedor necesite plata.',
    'Reescrito desde el cliente: "en la vereda no hay dónde recargar un celular cuando se va la luz, y la gente pierde comunicación por días".',
    'Ahora sí hay un negocio: cargue solar por horas. El mismo estudiante, otro planteamiento.'],
   m:'El problema siempre se escribe desde el lado del que va a pagar. Si el problema es suyo, todavía no hay negocio.'},
  {t:'Los tres objetivos que no se podían medir',c:'Un plan de negocio presenta como objetivos: "crecer", "ser reconocidos" y "dar buen servicio".',
   p:['Los tres suenan bien y ninguno se puede verificar.',
    '¿Crecer cuánto? ¿Reconocidos por quién? ¿Buen servicio medido cómo?',
    'Corregidos: "abrir un segundo punto en el año 2", "alcanzar 300 seguidores locales en 6 meses", "responder todo pedido en menos de 24 horas".',
    'La diferencia: ahora, al año siguiente, se puede decir si se cumplió o no.'],
   m:'Un objetivo que no se puede medir no sirve para dirigir un negocio ni para sustentar una solicitud de crédito.'},
  {t:'El documento de 40 páginas sin estilos',c:'Un estudiante del semestre pasado escribió todo su plan poniendo los títulos en negrita a mano.',
   p:['Al llegar al encuentro del índice automático, Word le mostró un índice <b>vacío</b>.',
    'Word no tenía cómo saber cuáles líneas eran títulos: para él, todo era texto normal en negrita.',
    'Tuvo que volver atrás y aplicar estilo a 34 títulos, uno por uno.',
    'Sus compañeros que sí habían aplicado estilos pulsaron un botón y terminaron en diez segundos.'],
   m:'Los estilos son trabajo invisible que se paga en el encuentro 7. El que no los aplica ahora, los aplica después — pero de afán y todos juntos.'}
 ],
 taller:{t:'La estructura del plan con estilos aplicados',modo:'Individual · celular o computador · 55 minutos',
  pasos:['En su documento, escriba los <b>títulos de los ocho capítulos</b> del plan: Resumen, Problema, Mercado, Producto, Operación, Organización, Finanzas, Conclusiones.',
   'Aplique <b>Título 1</b> a cada uno. En el celular: seleccione el texto y busque Estilos en la barra inferior.',
   'Debajo de "2. Problema", escriba el planteamiento en un párrafo de 5 a 8 líneas, <b>desde el lado del cliente</b>.',
   'Escriba la justificación: cuánta gente tiene ese problema y qué pasa si nadie lo resuelve. Use lo que le dijeron las tres personas.',
   'Escriba el objetivo general y tres específicos. Cada uno con verbo en infinitivo y algo <b>medible</b>.',
   'Ponga los objetivos específicos como <b>lista numerada</b>, no con guiones escritos a mano.'],
  logro:'Los ocho títulos tienen estilo Título 1 aplicado, el problema está escrito desde el cliente y los objetivos son medibles.'},
 tarea:'Complete el problema, la justificación y los objetivos. Verifique que los ocho títulos tengan estilo aplicado — <b>si al abrir el panel de navegación no aparecen todos, algo quedó sin estilo</b>. Para la próxima clase averigüe: ¿quiénes serían sus clientes, cuántos hay aproximadamente en su zona y quién más vende algo parecido? Pregunte, cuente, anote.',
 recursos:[]},

{n:3,unidad:'MÓDULO 2 · CONTENIDO DEL PLAN',tema:'Estudio de mercado y manejo de tablas',
 intro:'Hoy responde la pregunta que hunde más ideas de negocio: <b>¿quién le va a comprar?</b> Y aprende a organizar esa información en tablas, que es como se presenta la información comparativa en cualquier documento profesional. Además cae el <b>primer parcial</b>.',
 objetivo:'Construir el estudio de mercado del negocio —cliente, competencia y precio— presentándolo en <b>tablas con formato profesional</b>.',
 contenido:[
  {t:'Cómo funciona el parcial',
   lista:['<b>10 preguntas</b> sobre los encuentros 1 y 2: Word básico, estilos y estructura del plan.',
    '<b>20 minutos.</b> Antes de comenzar verá la rúbrica.',
    'Primer intento: máxima <b>4.3</b>, aprueba con <b>3.0</b>. Segundo intento: máxima <b>3.8</b>, aprueba con <b>2.9</b>.',
    'En los últimos 10 minutos escuchará latidos que se aceleran; a los 5 minutos, una alerta.']},
  {t:'Las tres preguntas del estudio de mercado',
   lista:['<b>¿Quién es el cliente?</b> No "todo el mundo". Edad, ocupación, dónde vive, cuánto puede pagar.',
    '<b>¿Cuántos hay?</b> Un número aproximado, contado o estimado con criterio. Es lo que define si el negocio cabe.',
    '<b>¿Quién más lo vende?</b> La competencia directa e indirecta. Qué cobra, qué hace bien y qué hace mal.',
    'Y una cuarta que se deriva: <b>¿por qué me comprarían a mí?</b> Eso es la propuesta de valor.']},
  {t:'Tablas: cuándo usarlas y cómo',
   lista:['Una tabla sirve cuando hay que <b>comparar</b> varias cosas por los mismos criterios. Si no hay comparación, use párrafo.',
    'La <b>fila de encabezado</b> va en negrita con fondo. Sin eso no se sabe qué es cada columna.',
    'Para moverse entre celdas se usa la tecla <b>Tab</b>. Al presionarla en la última celda, Word crea una fila nueva.',
    'En el celular las tablas simples salen bien; <b>las de celdas combinadas hágalas en el computador</b>.',
    'Una tabla no lleva más de cinco columnas si va a imprimirse en vertical.']}
 ],
 demoMercado:true,
 ejemplos:[
  {t:'El cliente que era "todo el mundo"',c:'Un estudiante escribe que sus clientes son "todas las personas del municipio que necesiten el servicio".',
   p:['Con esa definición no se puede hacer nada: ni fijar precio, ni saber cuántos son, ni dónde anunciarse.',
    'Le preguntaron: de los que usted conoce, ¿quién ya paga por algo parecido?',
    'La respuesta fue concreta: mototaxistas que necesitan cargar el celular durante el día.',
    'Con eso pudo contar cuántos hay, saber cuánto gastan y dónde encontrarlos.'],
   m:'"Todo el mundo" es la forma elegante de decir "no sé". Un cliente bien definido se puede contar, ubicar y costear.'},
  {t:'La competencia que no se había mirado',c:'Una estudiante planea vender almuerzos. Asegura que en su barrio no hay competencia.',
   p:['Le pidieron contar durante una semana. Encontró <b>tres señoras</b> que vendían almuerzos desde la casa, sin aviso.',
    'No eran negocios formales, por eso no los había visto. Pero le quitaban el mismo cliente.',
    'También encontró competencia <b>indirecta</b>: quien lleva almuerzo de la casa no compra.',
    'Ajustó su propuesta a lo que ninguna de las tres ofrecía: entrega a domicilio en moto.'],
   m:'La competencia que no se ve es la más peligrosa. Y casi siempre está: si nadie vende eso, vale la pena preguntarse por qué.'},
  {t:'La tabla que decidió el precio',c:'Un estudiante no sabía cuánto cobrar. Armó una tabla con cinco competidores, qué ofrecían y a cuánto.',
   p:['Al verlo en tabla, apareció un patrón: todos cobraban entre dos rangos y nadie ofrecía garantía.',
    'Decidió ubicarse en el rango alto <b>ofreciendo garantía de una semana</b>.',
    'La tabla no le dio el precio: le mostró el hueco donde podía ponerse.',
    'Esa tabla fue después lo primero que miró el asesor del banco.'],
   m:'Una tabla no es adorno del documento: es una herramienta para decidir. Ordenar la información hace visible lo que en párrafo se pierde.'}
 ],
 taller:{t:'El mercado de mi negocio en tres tablas',modo:'Individual · 50 minutos',
  pasos:['<b>Tabla 1 — Perfil del cliente:</b> cuatro filas con característica y descripción — edad, ocupación, dónde está, cuánto puede pagar.',
   '<b>Tabla 2 — Competencia:</b> una fila por competidor, con columnas: nombre, qué ofrece, precio, qué hace bien, qué hace mal. Mínimo tres.',
   '<b>Tabla 3 — Mi propuesta de valor:</b> dos columnas — qué ofrece la competencia y qué voy a ofrecer yo distinto.',
   'Dé formato a las tres: encabezado en negrita con fondo, bordes visibles.',
   'Debajo de cada tabla escriba <b>una frase</b> interpretándola. Una tabla sin interpretación no dice nada.',
   'Verifique que el capítulo "3. Estudio de mercado" tenga estilo Título 1 y los subtítulos, Título 2.'],
  logro:'Las tres tablas están completas con datos reales averiguados, con formato de encabezado y con su frase de interpretación.'},
 tarea:'Complete el estudio de mercado con datos <b>que usted haya averiguado</b>, no supuestos. Si dice que hay 40 clientes potenciales, tiene que poder explicar de dónde salió ese 40. Para la próxima clase tome <b>tres fotos</b>: del producto, del lugar donde se haría, o de algo parecido que ya exista. Las vamos a insertar en el documento.',
 recursos:[],
 parcial:'p1'},

{n:4,unidad:'MÓDULO 2 · CONTENIDO DEL PLAN',tema:'El producto o servicio, imágenes y evidencias',
 intro:'Hoy describe <b>exactamente qué va a vender</b> — con el detalle con el que se lo tendría que explicar a alguien que nunca lo ha visto. Y aprende a manejar imágenes en Word, que es donde más documentos se dañan.',
 objetivo:'Elaborar la ficha técnica del producto o servicio e insertar imágenes con <b>ajuste de texto y pie de ilustración</b> correctos.',
 contenido:[
  {t:'La ficha técnica: qué vendo exactamente',
   p:'Si no puede describir su producto con precisión, tampoco puede costearlo ni cotizarlo.',
   lista:['<b>Nombre y presentación:</b> no "arepas", sino "arepa de maíz blanco de 15 cm, empacada individual".',
    '<b>Características:</b> tamaño, peso, duración, materiales, tiempo de servicio.',
    '<b>Qué incluye y qué no.</b> Es donde nacen los reclamos si queda ambiguo.',
    '<b>Garantía o condiciones:</b> qué pasa si el cliente no queda conforme.',
    'Para un servicio, lo mismo: qué se hace, cuánto dura, qué se entrega al final.']},
  {t:'Imágenes: el error que se ve a un kilómetro',
   lista:['Para redimensionar, <b>siempre desde una esquina</b>. Desde el lado la imagen se deforma y se nota de inmediato.',
    '<b>Ajuste de texto:</b> decide cómo se acomoda el texto alrededor. Para documentos formales, "en línea con el texto".',
    'Toda imagen lleva <b>pie de ilustración</b>: qué muestra, dónde y cuándo. Sin eso es una foto suelta.',
    'Las imágenes pesan: un documento con 15 fotos sin comprimir no se puede enviar por correo.',
    'Word tiene <b>comprimir imágenes</b>. Úselo antes de entregar.']},
  {t:'Por qué las fotos importan en un plan de negocio',
   lista:['Un plan sin imágenes se lee como una idea. Con imágenes se lee como <b>algo que ya empezó</b>.',
    'Sirven como <b>evidencia</b>: el lugar existe, el producto se hizo, la máquina está.',
    'Y hacen algo práctico: quien evalúa entiende en dos segundos lo que en párrafo tomaría media página.',
    'Foto útil: el sitio, el producto, el proceso, la competencia. Foto inútil: imágenes bajadas de internet sin relación con su negocio.']}
 ],
 ejemplos:[
  {t:'La foto estirada del plan de negocio',c:'Un estudiante inserta la foto de su producto y la agranda arrastrando desde el lado. Queda achatada.',
   p:['Desde el lado solo cambia el ancho: la proporción se pierde.',
    'Desde la <b>esquina</b>, ancho y alto cambian juntos.',
    'Una foto deformada en un documento formal sugiere descuido en todo lo demás.',
    'Quien lo evalúa no dice nada, pero lo nota.'],
   m:'Los detalles pequeños son los que separan un documento que parece profesional de uno improvisado.'},
  {t:'La ficha que evitó el reclamo',c:'Un estudiante montó servicio de mantenimiento de computadores. Su primera ficha decía solo "mantenimiento: $50.000".',
   p:['El primer cliente esperaba que le formateara el equipo y le instalara programas. No estaba incluido.',
    'Discusión, mal rato y cliente perdido.',
    'Reescribió la ficha: <b>qué incluye</b> —limpieza física, pasta térmica, revisión de disco— y <b>qué no</b> —formateo, instalación de software, repuestos.',
    'Desde entonces, cero reclamos por ese motivo.'],
   m:'Lo que no queda escrito en la ficha se convierte en discusión con el cliente. Definir el alcance es proteger la relación.'},
  {t:'El documento de 40 megas',c:'Una estudiante terminó su plan con doce fotos tomadas con el celular. El archivo pesaba 40 MB y no se pudo enviar por correo.',
   p:['Las fotos de celular vienen en máxima resolución: cada una puede pesar 4 o 5 MB.',
    'En un documento no se necesita esa resolución: se ve igual con la décima parte.',
    'Con <b>comprimir imágenes</b>, el archivo bajó a menos de 3 MB.',
    'Se veía exactamente igual en pantalla y en impresión.'],
   m:'Un documento que no se puede enviar es un documento que no llegó. Comprimir toma diez segundos.'}
 ],
 taller:{t:'La ficha técnica y las evidencias',modo:'Individual · 50 minutos',
  pasos:['Escriba el capítulo "4. Producto o servicio" con estilo Título 1.',
   'Elabore la <b>ficha técnica</b> en tabla: nombre, presentación, características, qué incluye, qué no incluye, garantía.',
   'Inserte las <b>tres fotos</b> que trajo. Ajústelas <b>desde la esquina</b>.',
   'Póngale a cada una su <b>pie de ilustración</b>: qué muestra, dónde y cuándo se tomó.',
   'Ponga el ajuste de texto en "en línea con el texto" para que no se descuadren al agregar párrafos.',
   'Aplique <b>comprimir imágenes</b> y verifique cuánto bajó el peso del archivo.'],
  logro:'La ficha técnica está completa con qué incluye y qué no, las tres fotos tienen pie de ilustración y el archivo pesa menos de 5 MB.'},
 tarea:'Termine el capítulo del producto. <b>Muestre la ficha técnica a una persona que no conozca su negocio</b> y pregúntele si entiende exactamente qué le estarían vendiendo. Anote qué le preguntó — cada pregunta suya es un vacío de la ficha. Para la próxima clase piense: ¿cuáles son los pasos para producir o prestar su servicio, de principio a fin?',
 recursos:[]},
{n:5,unidad:'MÓDULO 2 · CONTENIDO DEL PLAN',tema:'Operación, organigrama y marco legal',
 intro:'Hoy responde <b>cómo se hace</b> y <b>quién lo hace</b>. Y aprende SmartArt, que es la forma de convertir un proceso en un gráfico sin ser diseñador. Es de lo que más impresiona en un documento y de lo más fácil de usar.',
 objetivo:'Describir el proceso de operación y la estructura organizacional del negocio usando <b>SmartArt</b>, e identificar los requisitos legales para funcionar.',
 contenido:[
  {t:'El plan de operación: del insumo al cliente',
   lista:['Escriba los <b>pasos en orden</b>, desde que consigue el insumo hasta que el cliente recibe.',
    'Por cada paso: <b>cuánto tarda</b> y <b>qué se necesita</b>. Ahí aparecen costos que uno no había pensado.',
    'Incluya el sitio: dónde se produce, dónde se guarda, dónde se atiende.',
    'Y la capacidad: <b>cuántas unidades puede hacer al día</b>. Es el techo real del negocio.',
    'Error frecuente: subestimar el tiempo. Un proceso que "toma media hora" casi siempre toma el doble.']},
  {t:'SmartArt: gráficos sin ser diseñador',
   tabla:{c:['Tipo de SmartArt','Para qué sirve','En su plan'],
    f:[['<b>Proceso</b>','Pasos en secuencia','El flujo de producción'],
       ['<b>Jerarquía / Organigrama</b>','Quién depende de quién','La estructura del equipo'],
       ['<b>Ciclo</b>','Etapas que se repiten','El ciclo de atención al cliente'],
       ['<b>Lista</b>','Elementos sin orden','Los requisitos legales']]},
   p:'Se inserta desde <b>Insertar → SmartArt</b>, se elige el tipo y se escribe en el panel de texto lateral. El gráfico se acomoda solo. <b>Esto se hace en computador</b>: el celular no lo permite bien.'},
  {t:'Marco legal: lo mínimo para funcionar en Colombia',
   lista:['<b>RUT</b> ante la DIAN: sin eso no se puede facturar ni contratar con nadie formal.',
    '<b>Matrícula mercantil</b> en la Cámara de Comercio: registra el negocio y da existencia legal.',
    'Definir la figura: persona natural o jurídica. Para empezar solo, casi siempre persona natural.',
    'Según el negocio: concepto sanitario si es alimentos, uso de suelo, seguridad social si contrata.',
    'Anótelo aunque todavía no lo tenga. <b>Un plan que ignora lo legal se cae en la primera revisión.</b>']}
 ],
 video:{id:'CywgP0W8_BI',t:'Insertar SmartArt y organigrama en Word',d:'Cómo insertar y editar un gráfico SmartArt. Lo va a usar dos veces hoy: para el proceso y para el organigrama.'},
 video2:{id:'V9he45O9NAA',t:'Cómo hacer un organigrama en Word con SmartArt',d:'Enfocado en el organigrama. Aunque su negocio sea usted solo, el organigrama muestra cómo crecería.'},
 demoSmart:true,
 ejemplos:[
  {t:'El proceso que tomaba el doble',c:'Una estudiante calculó que hacer 50 empanadas le tomaba dos horas. Cuando lo cronometró, fueron cuatro.',
   p:['Había contado solo el tiempo de armar y freír.',
    'No contó: ir a comprar, preparar la masa, esperar que enfriara, empacar y limpiar.',
    'Con cuatro horas reales, el precio que había fijado dejaba menos del mínimo por hora de trabajo.',
    'Subió el precio y ajustó la cantidad diaria a lo que de verdad podía producir.'],
   m:'Escribir el proceso paso a paso obliga a contar el tiempo completo. Es donde la mayoría de los negocios pequeños descubren que estaban regalando su trabajo.'},
  {t:'El organigrama de una sola persona',c:'Un estudiante dice que no necesita organigrama porque trabaja solo.',
   p:['Se le pidió dibujar las <b>funciones</b>, no las personas: quién compra, quién produce, quién vende, quién cobra.',
    'Aparecieron cinco funciones distintas, todas en su cabeza.',
    'Al verlas separadas entendió cuál podría delegar primero cuando creciera.',
    'Y entendió por qué se sentía desbordado: estaba haciendo cinco trabajos.'],
   m:'El organigrama no es para mostrar cuánta gente tiene: es para ver <b>cuántas funciones existen</b> y cuáles recaen sobre una sola persona.'},
  {t:'El negocio que no podía facturar',c:'Un negocio pequeño consiguió su primer cliente grande: una entidad. No pudo cobrarle.',
   p:['La entidad exigía factura y el negocio no tenía RUT ni matrícula mercantil.',
    'El trámite tomó tres semanas. El cliente no esperó.',
    'Perdió el contrato por no tener un papel que cuesta poco y se saca antes.',
    'Desde entonces lo incluye en el plan como <b>requisito previo</b>, no como algo para después.'],
   m:'Lo legal no es burocracia: es lo que permite cobrarle a un cliente formal. Sin eso, el negocio queda limitado a lo informal.'}
 ],
 taller:{t:'El proceso, el equipo y lo legal',modo:'Individual · sala de cómputo · 55 minutos',
  pasos:['Escriba el capítulo "5. Plan de operación" con estilo Título 1.',
   'Liste los <b>pasos del proceso</b> en orden, con tiempo y recursos de cada uno. Sea honesto con los tiempos.',
   'Convierta esos pasos en un <b>SmartArt de tipo Proceso</b>.',
   'Escriba el capítulo "6. Organización" y haga un <b>SmartArt de organigrama</b> con las funciones del negocio, aunque las haga usted solo.',
   'Agregue una tabla con los <b>requisitos legales</b>: cuál, dónde se tramita, cuánto cuesta aproximadamente y si ya lo tiene.',
   'Calcule y escriba su <b>capacidad diaria</b>: cuántas unidades o servicios puede entregar por día.'],
  logro:'El proceso está en SmartArt con tiempos reales, el organigrama muestra las funciones, y la tabla legal indica qué falta tramitar.'},
 tarea:'Termine operación y organización. <b>Cronometre de verdad</b> el paso que le parezca más largo y corrija el tiempo si estaba mal. Para la próxima clase averigüe y anote: cuánto cuesta cada insumo, cuánto pagaría de arriendo o servicios al mes, y a cuánto vendería cada unidad. <b>Con precios reales averiguados en el pueblo, no calculados en la cabeza.</b>',
 recursos:[{i:'🏛️',t:'Cámara de Comercio · matrícula mercantil',d:'Requisitos y trámite de registro para negocios nuevos',u:'https://www.ccc.org.co/'}]},

{n:6,unidad:'MÓDULO 3 · CIERRE Y ARMADO',tema:'El plan financiero y las tablas de cálculo',
 intro:'Hoy llegan los números, que es donde un plan de negocio se vuelve serio o se cae. Al final de la clase va a saber <b>cuántas unidades tiene que vender al mes para no perder plata</b>. Y cae el <b>segundo parcial</b>.',
 objetivo:'Construir el plan financiero del negocio —inversión, costos, precio y punto de equilibrio— usando <b>tablas con cálculos</b> en Word.',
 contenido:[
  {t:'Los cuatro números que todo plan debe tener',
   tabla:{c:['Número','Qué responde','Cómo se saca'],
    f:[['<b>Inversión inicial</b>','Cuánto necesito para arrancar','Suma de equipos, adecuación, inventario inicial y trámites'],
       ['<b>Costos fijos</b>','Cuánto gasto aunque no venda nada','Arriendo, servicios, internet, sueldo base'],
       ['<b>Costo variable unitario</b>','Cuánto me cuesta cada unidad','Insumos y mano de obra directa por unidad'],
       ['<b>Punto de equilibrio</b>','Cuánto vender para no perder','Costos fijos ÷ (precio − costo variable)']]}},
  {t:'El punto de equilibrio, explicado sin fórmulas',
   lista:['Cada unidad que vende deja un <b>margen</b>: el precio menos lo que le costó hacerla.',
    'Ese margen se va acumulando para pagar los costos fijos del mes.',
    'El <b>punto de equilibrio</b> es cuántas unidades necesita para que ese acumulado cubra exactamente los fijos.',
    'Antes de ese punto, pierde. Después, gana.',
    'Ejemplo: fijos de $600.000, precio $5.000, costo variable $2.000. Margen $3.000. Punto de equilibrio: <b>200 unidades al mes</b>.',
    'Y la pregunta que sigue: <b>¿es realista vender 200 al mes con los clientes que conté en el encuentro 3?</b>']},
  {t:'Tablas de cálculo en Word',
   lista:['Word puede <b>sumar y multiplicar</b> dentro de una tabla: pestaña Presentación → Fórmula.',
    'Se usa <code>=SUM(ABOVE)</code> para totalizar una columna, o <code>=B2*C2</code> para multiplicar celdas.',
    'Word <b>no recalcula solo</b> como Excel: al cambiar un dato hay que actualizar el campo.',
    'Para cálculos complejos, hágalos en Excel y <b>pegue la tabla vinculada</b> en Word.',
    'En números: use separador de miles y el mismo formato en toda la tabla. Un plan con cifras desalineadas se lee mal.']}
 ],
 ejemplos:[
  {t:'El punto de equilibrio que salvó una decisión',c:'Un estudiante quería montar un puesto de comidas. Calculó su punto de equilibrio: 380 almuerzos al mes.',
   p:['Eran unos 15 almuerzos diarios, contando 25 días de venta.',
    'Fue a contar cuánta gente pasaba por el sitio a la hora del almuerzo: unas 40 personas.',
    'Necesitaba que <b>4 de cada 10</b> le compraran. Muy optimista para empezar.',
    'Cambió de sitio a uno con más flujo. Mismo negocio, otra ubicación, otro resultado.'],
   m:'El punto de equilibrio no es un número contable: es la pregunta de si el negocio <b>cabe</b> donde usted lo quiere poner.'},
  {t:'Los costos que no se habían contado',c:'Una estudiante calculó que cada arepa le costaba $800 y las vendía a $2.000. Creía ganar $1.200.',
   p:['Solo había contado el maíz y el queso.',
    'Faltaban: el gas, la energía, el empaque, el transporte al puesto y <b>su propio tiempo</b>.',
    'El costo real por unidad era $1.450. La ganancia era $550, no $1.200.',
    'No cambió el negocio, pero sí el precio y la cantidad mínima que debía vender.'],
   m:'El error más común en un plan financiero no es calcular mal: es <b>olvidar renglones</b>. Si su tiempo no está costeado, usted está trabajando gratis.'},
  {t:'La tabla que no cuadraba',c:'Un plan llega con la suma de la inversión inicial escrita a mano. No coincidía con la suma real de los renglones.',
   p:['El estudiante había cambiado un valor y no actualizó el total.',
    'El evaluador lo notó y perdió confianza en todo el resto de las cifras.',
    'Con <code>=SUM(ABOVE)</code> el total se recalcula al actualizar el campo.',
    'Cifra que se pueda calcular, no se escribe a mano.'],
   m:'Un total escrito a mano tarde o temprano miente. Y en un documento financiero, una cifra que no cuadra pone en duda todas las demás.'}
 ],
 taller:{t:'Los números de mi negocio',modo:'Individual · 55 minutos',
  pasos:['Escriba el capítulo "7. Plan financiero" con estilo Título 1.',
   '<b>Tabla de inversión inicial:</b> concepto, cantidad, valor unitario y total. Use <code>=SUM(ABOVE)</code> para el total.',
   '<b>Tabla de costos fijos mensuales:</b> arriendo, servicios, internet, transporte, lo que aplique.',
   '<b>Costo variable unitario:</b> todos los insumos de una unidad. <b>Incluya su tiempo.</b>',
   'Defina el <b>precio de venta</b> con base en la tabla de competencia del encuentro 3.',
   'Calcule el <b>punto de equilibrio</b> y escriba debajo, en una frase, si es realista con los clientes que contó.',
   'Proyecte los primeros seis meses: unidades esperadas, ingresos, costos y resultado.'],
  logro:'Las cuatro cifras están calculadas con datos reales, el punto de equilibrio está interpretado y ningún total está escrito a mano.'},
 tarea:'Complete el plan financiero. <b>Muéstrele el punto de equilibrio a alguien que tenga un negocio</b> y pregúntele si le parece alcanzable; anote qué le dijo. Traiga el <b>documento completo</b> a la próxima clase: es la sesión de armado en sala de cómputo y vamos a montar el índice automático.',
 recursos:[],
 parcial:'p2'},

{n:7,unidad:'MÓDULO 3 · CIERRE Y ARMADO',tema:'Armado profesional: índice, encabezados y secciones',
 intro:'Esta es la clase donde todo el trabajo invisible se paga. Los estilos de título que viene aplicando desde el encuentro 2 van a <b>construir el índice solos</b>, en un botón. Es la sesión más satisfactoria del curso.',
 objetivo:'Convertir el borrador en un <b>documento profesional</b>: índice automático, encabezado y pie, numeración de páginas por secciones y resumen ejecutivo.',
 contenido:[
  {t:'El índice automático: por qué funciona',
   lista:['Word recorre el documento buscando los textos que tengan <b>estilo de título</b> aplicado.',
    'Con ellos arma la lista, con su número de página, y la actualiza cuando usted se lo pida.',
    'Se inserta desde <b>Referencias → Tabla de contenido</b>.',
    'Si agrega páginas después, se pulsa <b>Actualizar tabla</b> y se recalcula todo.',
    'Si un título no aparece en el índice, <b>no tiene el estilo aplicado</b>. Es la única causa posible.']},
  {t:'Secciones: el concepto que casi nadie entiende',
   p:'Un <b>salto de sección</b> divide el documento en partes independientes. Sirve para que la portada y el índice no lleven número de página, y el contenido empiece en 1.',
   lista:['Se inserta desde <b>Disposición → Saltos → Sección (página siguiente)</b>.',
    'Después, en el encabezado de la sección 2, hay que <b>desactivar "Vincular al anterior"</b>. Sin ese paso, la numeración no se separa.',
    'Es el paso que más se olvida y por el que la portada termina numerada como página 1.',
    'Regla: portada y contenido en la sección 1, sin número. El resto en la sección 2, numerado desde 1.']},
  {t:'El resumen ejecutivo: lo último que se escribe, lo primero que se lee',
   lista:['Va al principio del documento pero <b>se escribe al final</b>, cuando ya sabe todo lo que dice el plan.',
    'Una página, máximo. Es lo único que lee con seguridad quien decide.',
    'Debe responder cinco cosas: <b>qué negocio es, qué problema resuelve, quién es el cliente, cuánto necesita y cuándo empieza a ganar</b>.',
    'Si alguien lee solo el resumen y entiende el negocio completo, está bien escrito.']}
 ],
 demoIndice:true,
 ejemplos:[
  {t:'Los diez segundos contra las dos horas',c:'Dos estudiantes terminan su plan el mismo día. Uno aplicó estilos desde el encuentro 2; el otro puso los títulos en negrita.',
   p:['El primero pulsó Referencias, Tabla de contenido, y el índice apareció completo con las páginas.',
    'El segundo vio un índice vacío: Word no tenía cómo saber cuáles líneas eran títulos.',
    'Tuvo que recorrer 22 páginas aplicando estilo a cada título.',
    'Dos horas de trabajo contra diez segundos, por una decisión tomada cinco encuentros atrás.'],
   m:'Los estilos no se aplican porque se vean bonitos: se aplican porque le dan estructura al documento. Esa estructura es la que después trabaja por usted.'},
  {t:'La portada que quedó numerada',c:'Un plan bien hecho llega con "Página 1" impreso en la portada y "Página 2" en el índice.',
   p:['Se insertó la numeración sin haber dividido el documento en secciones.',
    'Word numeró todo de corrido, incluida la portada.',
    'Con un <b>salto de sección</b> después del índice y desvinculando el encabezado, la numeración arranca donde debe.',
    'Detalle pequeño, pero es lo primero que ve quien recibe el documento.'],
   m:'Es el error de formato más frecuente en trabajos de grado y planes de negocio. Y se resuelve con dos pasos que casi nadie conoce.'},
  {t:'El resumen que consiguió la cita',c:'Una emprendedora envió su plan de 25 páginas a una entidad de apoyo. Le respondieron en dos días.',
   p:['Después supo que el analista <b>solo había leído el resumen ejecutivo</b>.',
    'En esa página estaba todo: el problema, el cliente, la cifra que necesitaba y en cuánto tiempo devolvía.',
    'El resto del documento lo revisaron después, ya con la decisión tomada de reunirse.',
    'El resumen no era un adorno: era el documento que de verdad se leyó.'],
   m:'Escriba el plan completo para usted y el resumen ejecutivo para quien decide. Son dos lectores distintos con dos necesidades distintas.'}
 ],
 taller:{t:'De borrador a documento profesional',modo:'Individual · sala de cómputo · 65 minutos',
  pasos:['Abra su documento y verifique en el <b>panel de navegación</b> que aparezcan todos los capítulos. El que no aparezca, no tiene estilo.',
   'Vaya a la hoja "Contenido" e inserte <b>Referencias → Tabla de contenido</b>. Elija un formato automático.',
   'Inserte un <b>salto de sección</b> al final del índice.',
   'En el encabezado de la sección 2, <b>desactive "Vincular al anterior"</b> y agregue la numeración de página empezando en 1.',
   'Agregue un encabezado con el nombre de su negocio y un pie con su nombre.',
   'Escriba el <b>resumen ejecutivo</b> en una página, respondiendo las cinco preguntas. Va después de la portada.',
   'Actualice la tabla de contenido y verifique que el resumen aparezca.',
   'Revise ortografía y gramática con la herramienta de Word, corrigiendo lo que marque.'],
  logro:'El índice se generó automáticamente y está completo, la portada y el índice no llevan número, el contenido empieza en página 1 y el resumen ejecutivo cabe en una hoja.'},
 tarea:'Deje el documento armado y revisado. <b>Actualice el índice una última vez</b> después de cualquier cambio — es el error más común: corregir el documento y dejar el índice con las páginas viejas. Prepare para la última clase la <b>sustentación de tres minutos</b>: qué negocio es, qué problema resuelve y cuánto necesita para arrancar.',
 recursos:[{i:'📄',t:'CustomGuide · Word en español',d:'Guías escritas de tabla de contenido, secciones y encabezados',u:'https://www.customguide.com/curso/word'}]},

{n:8,unidad:'PARCIAL FINAL · ENTREGA',tema:'Carta de presentación, entrega y sustentación',
 intro:'Último encuentro. Hoy su plan sale del computador: escribe la <b>carta con la que lo presentaría</b> a un banco o a una convocatoria, lo exporta a PDF y lo sustenta ante el grupo. Y cae el <b>parcial final</b>.',
 objetivo:'Producir la carta de presentación con <b>combinar correspondencia</b>, exportar el plan a PDF y sustentar el proyecto en tres minutos.',
 contenido:[
  {t:'Combinar correspondencia: la misma carta para varios destinatarios',
   p:'Su plan puede ir a varias entidades. Escribir una carta por cada una es perder el tiempo.',
   lista:['<b>Documento principal:</b> la carta con el texto fijo.',
    '<b>Lista de datos:</b> una tabla con lo que cambia — entidad, destinatario, cargo, ciudad.',
    '<b>Campos combinados:</b> las marcas donde entra cada dato.',
    'Se pulsa finalizar y salen todas las cartas personalizadas de una vez.',
    'Antes de generar, use <b>vista previa</b>: una carta que salga diciendo «Entidad» en vez del nombre real avergüenza a quien la envía.']},
  {t:'Qué dice una carta de presentación que funciona',
   lista:['<b>Primer párrafo:</b> quién es usted y qué presenta. Dos líneas, sin rodeos.',
    '<b>Segundo:</b> qué problema resuelve el negocio y para quién. Una frase con un dato concreto.',
    '<b>Tercero:</b> qué solicita exactamente — evaluación, financiación, asesoría — y cuánto.',
    '<b>Cierre:</b> cómo contactarlo y agradecimiento breve.',
    'Máximo una página. Nadie lee una carta de presentación de dos.']},
  {t:'Exportar y entregar',
   lista:['Exporte siempre a <b>PDF</b>: se ve igual en cualquier equipo y nadie puede modificarlo.',
    'En Word: <b>Archivo → Exportar → Crear PDF</b>. No es lo mismo que renombrar la extensión.',
    'Revise el PDF antes de enviarlo: que el índice tenga las páginas correctas y que las imágenes se vean.',
    'Complete las <b>propiedades del documento</b> —título y autor—: aparecen en el PDF y dan seriedad.',
    'Conserve el .docx: es el que va a editar cuando el negocio cambie.']}
 ],
 video:{id:'fWZMvID-Mns',t:'Combinar correspondencia en Word',d:'Ejemplo completo del proceso. Es exactamente lo que va a hacer hoy con su carta de presentación.'},
 ejemplos:[
  {t:'La carta de dos páginas que nadie leyó',c:'Un emprendedor envió su plan con una carta de presentación de dos páginas explicando su historia personal.',
   p:['El analista leyó el primer párrafo y pasó directo al plan.',
    'La historia personal era interesante pero no respondía qué solicitaba ni cuánto.',
    'Reescrita en cuatro párrafos, con la cifra exacta en el tercero, obtuvo respuesta.',
    'Lo que sobraba no era malo: <b>estaba en el lugar equivocado</b>. Eso va en el plan, no en la carta.'],
   m:'La carta no cuenta el negocio: <b>abre la puerta para que lean el plan</b>. Son dos documentos con funciones distintas.'},
  {t:'Las ocho cartas en tres minutos',c:'Una estudiante quería presentar su plan a ocho entidades distintas. Calculó una tarde escribiendo cada carta.',
   p:['Escribió <b>una sola</b> plantilla con los espacios variables.',
    'Armó la tabla con las ocho entidades y sus destinatarios.',
    'Insertó los campos, verificó en vista previa y finalizó la combinación.',
    'Salieron las ocho cartas personalizadas. Tiempo real: tres minutos.'],
   m:'Es el momento en que Word deja de ser una máquina de escribir. Lo que resuelve en minutos, a mano toma una tarde.'},
  {t:'El PDF con el índice viejo',c:'Un estudiante entregó su plan en PDF. El índice mostraba páginas que no coincidían con el contenido.',
   p:['Había corregido el documento después de generar el índice y no lo actualizó.',
    'En el .docx no se notaba porque nadie lo abrió; en el PDF quedó congelado el error.',
    'Quien lo revisó buscó el plan financiero en la página 12 y encontró otra cosa.',
    'Regla: <b>actualizar el índice es el último paso antes de exportar</b>, siempre.'],
   m:'Un índice desactualizado es peor que no tener índice: promete una ubicación y entrega otra.'}
 ],
 taller:{t:'Carta, PDF y sustentación',modo:'Individual · sala de cómputo · 65 minutos',
  pasos:['Cree la <b>plantilla de carta</b> en documento aparte, con los cuatro párrafos y los espacios variables.',
   'Arme la <b>lista de datos</b> con mínimo tres entidades reales: banco, cámara de comercio, alcaldía, fondo de emprendimiento.',
   'Inserte los campos combinados, verifique en <b>vista previa</b> que ninguno quede sin reemplazar y finalice la combinación.',
   'Vuelva al plan: <b>actualice la tabla de contenido</b> y complete las propiedades del documento.',
   'Exporte a <b>PDF</b> y ábralo para verificar índice, imágenes y numeración.',
   '<b>Sustentación de 3 minutos:</b> qué negocio es, qué problema resuelve, quién es el cliente, cuánto necesita y cuándo empieza a ganar.',
   'El grupo hace una pregunta a cada expositor, de las que haría un evaluador.'],
  logro:'Existen las cartas personalizadas sin campos sin reemplazar, el PDF abre correctamente con el índice actualizado, y sustentó en tres minutos.'},
 tarea:'Entregue el <b>plan en PDF y en .docx</b> más las cartas de presentación. Y haga algo más, que es lo que le da sentido a todo: <b>envíe el plan a una de las tres entidades de su lista</b>, o muéstreselo a alguien que pueda ayudarle a ejecutarlo. Anote qué le respondieron. Guarde el .docx: cuando el negocio cambie, ese es el documento que va a editar.',
 recursos:[{i:'🚀',t:'Fondo Emprender · SENA',d:'Convocatorias de capital semilla para planes de negocio',u:'https://www.fondoemprender.com/'}],
 parcial:'p3'}
];

const PANEL={enc:null, par:null};
function panelInit(){
  if(PANEL.enc===null){
    const b=habil();
    PANEL.enc=SEM.map((s,i)=>((b>>i)&1)===1);
  }
  if(PANEL.par===null){
    PANEL.par={}; ['p1','p2','p3'].forEach(k=>PANEL.par[k]=parcialAbierto(k));
  }
}
function marcarEnc(i,v){ PANEL.enc[i]=v; pintarCfg(); }
function marcarPar(k,v){ PANEL.par[k]=v; pintarCfg(); }
function todosEnc(){ PANEL.enc=PANEL.enc.map(()=>true); vDoc(); }
const nAbiertos=()=>{ let n=0; PANEL.enc.forEach((v,i)=>{ if(v) n=Math.max(n,i+1); }); return n; };
function textoCfg(){
  const base = CFG ? JSON.parse(JSON.stringify(CFG)) : {};
  base.encuentros_abiertos = nAbiertos();
  if(base.avance_secuencial === undefined) base.avance_secuencial = true;
  base.parciales = Object.assign({}, base.parciales||{}, PANEL.par);
  return JSON.stringify(base, null, 2);
}
function pintarCfg(){
  const o=document.getElementById('cfgOut'); if(o) o.textContent=textoCfg();
  const e=document.getElementById('cfgEstado');
  if(e) e.textContent = CFG
    ? ('config.json leído · '+CFG.encuentros_abiertos+' abierto(s) · avance '+(CFG.avance_secuencial===false?'libre':'secuencial'))
    : 'No se encontró config.json. Se está usando el enlace #h= como respaldo.';
  const r=document.getElementById('resumenPanel');
  if(r) r.innerHTML=`<b>${nAbiertos()}</b> encuentro(s) abierto(s) · parciales:
    ${['p1','p2','p3'].filter(k=>PANEL.par[k]).map(k=>k.toUpperCase()).join(', ')||'ninguno'}`;
}
function copiarCfg(){ navigator.clipboard.writeText(textoCfg())
  .then(()=>toast('Copiado. Péguelo en el config.json de la carpeta.'),()=>toast('Seleccione el texto y cópielo a mano.')); }
function aplicar(){ ST.habil=null; CFG=Object.assign({},CFG,JSON.parse(textoCfg())); buildNav(); pintarCfg(); toast('Aplicado en su vista.'); sOk(); }

/* ==========================================================
   RESTABLECER LA CONTRASEÑA DE UN ESTUDIANTE
   Firebase nunca guarda la contraseña en claro: no se puede
   consultar. Lo que sí se puede es enviarle el enlace de cambio.
   ========================================================== */
async function resetClave(correo){
  if(!confirm('¿Enviar a '+correo+' el enlace para cambiar su contraseña?')) return;
  const ak=CFG&&CFG.firebase&&CFG.firebase.apiKey;
  if(!ak){ toast('Falta la configuración de Firebase.'); return; }
  abrirProg('Enviando enlace','Contactando a Firebase…');
  try{
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+ak,
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({requestType:'PASSWORD_RESET',email:correo})});
    const j=await r.json();
    if(j.error) throw new Error(j.error.message||'error');
    cerrarProg('Le llegó un correo a '+correo+' con el enlace para poner una contraseña nueva.');
  }catch(e){
    const m=String(e.message||'');
    cerrarProg(m.includes('EMAIL_NOT_FOUND')
      ? 'Ese correo no tiene cuenta creada. Pídale que se registre primero.'
      : 'No se pudo enviar ('+m+').', true);
  }
}

/* ===== CONSTANCIA / VERIFICACIÓN ===== */
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(36).toUpperCase()}
const SEC='UNICARIBE-CDI-2026';
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function mkCod(o){const p=[o.nombre,o.correo,o.parcial,o.intento,o.ok,o.tot,o.nota,o.fecha].join('|');return fnv(p+SEC)+'.'+b64e(p)}
function verif(){
 const c=(document.getElementById('cv').value||'').trim(),r=document.getElementById('cr'),pt=c.split('.');
 abrirProg('Verificando constancia','Recalculando la firma del código…');

 const ok=fnv(p+SEC)===pt[0],f=p.split('|');
 r.innerHTML=ok?`<div style="background:#E9F9F0;border:1px solid var(--ver);border-radius:11px;padding:14px">
   <b style="color:var(--ver)">✅ Constancia auténtica — no fue alterada</b>
   <div style="margin-top:8px;font-size:13.5px;line-height:1.7"><b>Estudiante:</b> ${esc(f[0])}<br><b>Correo:</b> ${esc(f[1])}<br>
   <b>Parcial:</b> ${esc(PARCIALES[f[2]]?PARCIALES[f[2]].titulo:f[2])}<br><b>Intento:</b> ${esc(f[3])}<br>
   <b>Aciertos:</b> ${esc(f[4])} de ${esc(f[5])}<br><b>NOTA:</b> <span style="font-size:19px;font-weight:700;color:var(--mor)">${esc(f[6])}</span><br>
   <b>Fecha:</b> ${esc(f[7])}</div></div>`
  :`<div style="background:#FCE9E9;border:1px solid var(--mal);border-radius:11px;padding:14px">
   <b style="color:var(--mal)">⚠️ Código alterado o inválido.</b><div style="margin-top:6px;font-size:13.5px">No acepte este resultado; pida que vuelva a presentar.</div></div>`;

/* ==========================================================
   INGRESO CON GOOGLE
   El estudiante entra con la cuenta de Google que ya tiene
   abierta en su equipo. No hay contraseñas que olvidar.
   ========================================================== */
const CORREO_CC='inbox.nativo@gmail.com';
let GSI_LISTO=false;

function payloadJWT(t){
  try{
    const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}
const normCorreo=c=>String(c||'').trim().toLowerCase();

function esDocente(correo){
  const lista=(CFG&&CFG.docentes)?CFG.docentes:[CORREO_DOC];
  return lista.map(normCorreo).includes(normCorreo(correo));
}
function buscarPorCorreo(correo){
  const c=normCorreo(correo);
  return ESTUDIANTES.find(e=>normCorreo(e.c)===c);
}

function montarIngreso(){
  const cid=CFG&&CFG.google_client_id;
  const zona=document.getElementById('zonaIngreso');
  if(!zona) return;
  if(!cid){
    // Sin identificador configurado se conserva el ingreso por contraseña,
    // para que la plataforma nunca quede inaccesible.
    zona.innerHTML=`<div class="err" style="display:block;background:#FFF8EC;color:#7A4E00;border:1px solid rgba(249,160,27,.5)">
      <b>Falta configurar el ingreso con Google.</b> Mientras tanto, entre con su usuario y contraseña.</div>
      ${formularioClave()}`;
    return;
  }
  zona.innerHTML=`<div id="btnGoogle" style="display:flex;justify-content:center;min-height:44px"></div>
    <div class="err" id="ie"></div>
    <p style="font-size:12.5px;color:var(--sua);text-align:center;line-height:1.55;margin:14px 0 0">
      Use la <b>misma cuenta de Google</b> que tiene en su celular o computador.
      Si le dice que no está en la lista, escríbale al docente indicándole ese correo.</p>`;
  esperarGSI(cid,0);
}
function formularioClave(){
  return `<label>Usuario</label><input class="inp" id="iu" placeholder="Su primer apellido" autocomplete="username">
    <label>Contraseña</label><input class="inp mono" id="ic" type="password" placeholder="ABC-123" autocomplete="current-password">
    <div class="err" id="ie"></div>
    <button class="bt big" style="width:100%" onclick="entrar()">Entrar →</button>`;
}
function esperarGSI(cid,intentos){
  if(window.google&&google.accounts&&google.accounts.id){
    try{
      google.accounts.id.initialize({client_id:cid,callback:llegoGoogle,auto_select:false,cancel_on_tap_outside:true});
      google.accounts.id.renderButton(document.getElementById('btnGoogle'),
        {theme:'filled_blue',size:'large',shape:'pill',text:'continue_with',locale:'es',width:300});
      GSI_LISTO=true;
    }catch(e){ falloGSI('No se pudo iniciar el ingreso con Google.'); }
    return;
  }
  if(intentos>40){ falloGSI('No se pudo cargar Google. Revise su conexión a internet e intente de nuevo.'); return; }
  setTimeout(()=>esperarGSI(cid,intentos+1),250);
}
function falloGSI(msg){
  const e=document.getElementById('ie');
  if(e){ e.textContent=msg; e.style.display='block'; }
  const z=document.getElementById('btnGoogle');
  if(z) z.innerHTML=`<button class="bt g" onclick="location.reload()">↻ Reintentar</button>`;
}
function llegoGoogle(resp){
  const d=payloadJWT(resp&&resp.credential);
  const e=document.getElementById('ie');
  const err=t=>{ if(e){e.textContent=t;e.style.display='block';} sRep(); };
  if(!d||!d.email){ err('No se pudo leer la cuenta de Google. Intente otra vez.'); return; }
  if(d.email_verified===false){ err('Esa cuenta de Google no está verificada.'); return; }

  if(esDocente(d.email)){
    ST.u={u:'docente',n:d.name||'Docente',c:d.email};
    ST.esDoc=true; abrirApp(); return;
  }
  const al=buscarPorCorreo(d.email);
  if(!al){
    err('El correo '+d.email+' no está en la lista de este curso. Escríbale al docente indicándole exactamente ese correo.');
    return;
  }
  ST.u=al; ST.esDoc=false; abrirApp();
}

  const c=CFG&&CFG.firebase;
  if(!c||!c.apiKey) return false;
  const versiones=[CFG.firebase_sdk,'12.19.0','12.18.0','11.10.0'].filter(Boolean);
  for(const v of versiones){
    try{
      const app=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const auth=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
      FBM=auth;
      FBA=auth.getAuth(app.initializeApp(c));
      FBA.languageCode='es';
      FBLISTO=true;
      return true;
    }catch(e){ /* se intenta la siguiente versión */ }
  }
  return false;
}

async function accionFB(){
  if(!FBLISTO){ errFB('El sistema de cuentas todavía no cargó. Espere un momento.'); return; }
  const mail=(document.getElementById('fbMail')||{}).value||'';
  const cla=(document.getElementById('fbClave')||{}).value||'';
  if(!mail.includes('@')){ errFB('Escriba su correo electrónico.'); return; }
  if(cla.length<6){ errFB('La contraseña debe tener al menos 6 caracteres.'); return; }
  try{
    if(MODO==='crear'){
      const nom=((document.getElementById('fbNom')||{}).value||'').trim();
      if(nom.split(/\s+/).length<2){ errFB('Escriba su nombre y su apellido.'); return; }
      const cred=await FBM.createUserWithEmailAndPassword(FBA,mail.trim(),cla);
      await FBM.updateProfile(cred.user,{displayName:nom});
      try{ await FBM.sendEmailVerification(cred.user); }catch(e){}
      await pedirAcceso(mail.trim(),nom);
    }else{
      const cred=await FBM.signInWithEmailAndPassword(FBA,mail.trim(),cla);
      await pedirAcceso(mail.trim(),cred.user.displayName||mail.split('@')[0]);
    }
  }catch(e){ errFB(mensajeFB(e&&e.code)); }
}
async function entrarGoogleFB(){
  if(!FBLISTO){ errFB('El sistema de cuentas todavía no cargó.'); return; }
  try{
    const prov=new FBM.GoogleAuthProvider();
    const cred=await FBM.signInWithPopup(FBA,prov);
    await pedirAcceso(cred.user.email,cred.user.displayName||cred.user.email.split('@')[0]);
  }catch(e){ errFB(mensajeFB(e&&e.code)); }
}
async function recuperarFB(){
