<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aula CDI · UNICARIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mor:#5C2483;--mor2:#3B1557;--morcl:#F3EDF8;--ver:#00A551;--nar:#F9A01B;--ama:#FFC72C;
 --tin:#241833;--sua:#5C5470;--lin:rgba(92,36,131,.15);--gris:#F6F4F9;--mal:#D64545;
 --fd:'Poppins',sans-serif;--fb:'Inter',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--gris);color:var(--tin);-webkit-font-smoothing:antialiased}

/* LOGIN */
#lg{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
 background:linear-gradient(140deg,var(--mor2),var(--mor) 55%,#7A35A8)}
#lg::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(249,160,27,.13);top:-180px;right:-160px}
#lg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(0,165,81,.12);bottom:-140px;left:-120px}
.lgc{background:#fff;border-radius:22px;padding:34px 32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.34);position:relative;z-index:2;animation:up .6s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.lgc img{width:186px;display:block;margin:0 auto 16px}
.lgc h1{font-family:var(--fd);font-size:20px;margin:0 0 4px;text-align:center;font-weight:600}
.lgc .s{font-size:13.5px;color:var(--sua);text-align:center;margin-bottom:20px;line-height:1.5}
label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mor);font-weight:700;margin-bottom:5px}
.inp{width:100%;font-family:var(--fb);font-size:15px;padding:12px 14px;border:1.5px solid var(--lin);border-radius:11px;margin-bottom:13px;transition:.15s}
.inp:focus{outline:none;border-color:var(--mor);box-shadow:0 0 0 3px rgba(92,36,131,.12)}
.inp.mono{font-family:var(--fm);letter-spacing:.09em;text-transform:uppercase}
.err{color:var(--mal);font-size:13px;margin:-6px 0 12px;display:none;background:#FCE9E9;padding:9px 12px;border-radius:9px}
.lk{display:block;text-align:center;font-size:12.5px;color:var(--mor);margin-top:13px;cursor:pointer;text-decoration:underline}

/* APP */
#ap{display:none;min-height:100vh}
#ap.on{display:flex}
.side{width:255px;flex:0 0 255px;background:var(--mor);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:90}
.side .lo{background:#fff;padding:15px;border-bottom:4px solid var(--nar);position:relative}
.side .lo img{width:100%;display:block}
.cls{display:none;position:absolute;top:7px;right:7px;background:var(--mor);color:#fff;border:none;width:31px;height:31px;border-radius:9px;font-size:15px;cursor:pointer}
.me{padding:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.me .r{display:flex;gap:11px;align-items:center}
.me .av{width:42px;height:42px;border-radius:50%;background:var(--ama);color:var(--mor2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;flex:0 0 auto}
.me .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.me .us{font-family:var(--fm);font-size:10.5px;color:rgba(255,255,255,.68)}
.pr{margin-top:12px}
.pr .b{height:7px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
.pr .b i{display:block;height:100%;background:linear-gradient(90deg,var(--ver),var(--ama));border-radius:5px;transition:width .5s}
.pr .t{font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.72);margin-top:5px}
.side nav{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nb{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:rgba(255,255,255,.86);font-family:var(--fb);font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nb:hover{background:rgba(255,255,255,.13)}
.nb.on{background:#fff;color:var(--mor);font-weight:600}
.nb .ic{font-size:15px}
.sep{font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ama);padding:12px 11px 5px;font-weight:600}
.side .ft{padding:13px 15px 17px;border-top:1px solid rgba(255,255,255,.15)}
.side .ft .fi{background:#fff;border-radius:9px;padding:5px 7px;margin-bottom:8px}
.side .ft .fi img{width:100%;max-height:50px;object-fit:contain;display:block}
.side .ft p{margin:0;font-size:11px;color:rgba(255,255,255,.72);line-height:1.55}
.side .ft b{display:block;color:#fff;font-size:12px}
.sb{margin-top:9px;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;font-family:var(--fm);font-size:10.5px;padding:7px;border-radius:8px;cursor:pointer}
.sb:hover{background:rgba(255,255,255,.26)}
main{flex:1;min-width:0;padding-bottom:50px}
.top{background:#fff;border-bottom:1px solid var(--lin);padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:60}
.tl{display:flex;align-items:center;gap:11px;min-width:0}
.tlogo{display:none;height:28px}
.burg{display:none;background:var(--mor);color:#fff;border:none;border-radius:9px;width:38px;height:36px;font-size:16px;cursor:pointer}
.t1{font-family:var(--fd);font-weight:600;font-size:14.5px}
.t2{font-family:var(--fm);font-size:10.5px;color:var(--sua)}
.wr{max-width:1020px;margin:0 auto;padding:24px 26px}
.rin{opacity:0;transform:translateY(15px);animation:ri .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes ri{to{opacity:1;transform:translateY(0)}}

/* AULA */
.hd{background:linear-gradient(120deg,var(--mor),var(--mor2));color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(249,160,27,.2);animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
.hd h1{font-family:var(--fd);font-size:clamp(20px,3vw,28px);margin:0 0 7px;font-weight:600;position:relative}
.hd p{margin:0;font-size:14.5px;color:rgba(255,255,255,.87);line-height:1.6;max-width:60ch;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.cw{background:#fff;border:1px solid var(--lin);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;display:flex;flex-direction:column}
.cw:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(92,36,131,.14)}
.cw.bl{opacity:.6;cursor:not-allowed}.cw.bl:hover{transform:none;box-shadow:none}
.cw .bn{height:78px;background:linear-gradient(120deg,var(--mor),#7A35A8);display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#fff}
.cw.u2 .bn{background:linear-gradient(120deg,#0E7A52,var(--ver))}
.cw.u3 .bn{background:linear-gradient(120deg,#B06E00,var(--nar))}
.cw .bn .n{font-family:var(--fd);font-size:31px;font-weight:700;line-height:1}
.cw .bn .st{font-size:21px}
.cw .bd{padding:14px 17px 17px;flex:1;display:flex;flex-direction:column}
.cw h3{font-family:var(--fd);font-size:15px;margin:0 0 6px;font-weight:600;line-height:1.3}
.cw p{margin:0;font-size:12.5px;color:var(--sua);line-height:1.5;flex:1}
.cw .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{font-family:var(--fm);font-size:9.5px;background:var(--morcl);color:var(--mor);padding:4px 8px;border-radius:12px;font-weight:600}
.tag.n{background:#FFF3DC;color:#9A6100}
.tag.v{background:#E3F6EC;color:#046B36}

/* SEMANA */
h2.sc{font-family:var(--fd);font-weight:600;font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sc::before{content:'';width:5px;height:20px;background:var(--nar);border-radius:3px}
.cd{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.cd h3{font-family:var(--fd);font-size:16px;margin:0 0 9px;font-weight:600}
.cd p{margin:0 0 8px;font-size:14.5px;line-height:1.62;color:var(--sua)}
.cd p:last-child{margin:0}
.cd b{color:var(--tin)}
ul.pt{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
ul.pt li{font-size:14.5px;line-height:1.55;color:var(--sua)}
ul.pt li b{color:var(--tin)}
.ob{background:var(--mor);color:#fff;border-radius:14px;padding:18px 21px}
.ob .k{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ama);font-weight:600;margin-bottom:5px}
.ob p{margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.95)}
.tw{overflow-x:auto;border-radius:10px}
.tw::-webkit-scrollbar{height:7px}.tw::-webkit-scrollbar-thumb{background:var(--lin);border-radius:5px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;min-width:470px}
table.tb th{background:var(--mor);color:#fff;text-align:left;padding:9px 12px;font-family:var(--fm);font-size:10px;text-transform:uppercase;white-space:nowrap}
table.tb td{border:1px solid var(--lin);padding:9px 12px;line-height:1.5;vertical-align:top}
table.tb tr:nth-child(even) td{background:var(--morcl)}
.th{display:none;font-family:var(--fm);font-size:10.5px;color:var(--sua);margin-top:5px}
.vd{background:#000;border-radius:14px;overflow:hidden;position:relative;padding-top:56.25%}
.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{font-size:12.5px;color:var(--sua);margin-top:7px;line-height:1.5}
.ejc{background:#fff;border:1px solid var(--lin);border-left:5px solid var(--ver);border-radius:0 14px 14px 0;padding:16px 19px;margin-bottom:11px;transition:.2s}
.ejc:hover{transform:translateX(4px)}
.ejc .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ver);font-weight:600}
.ejc h3{font-family:var(--fd);font-size:16px;margin:5px 0 7px;font-weight:600}
.ejc p{margin:0 0 7px;font-size:14px;line-height:1.58;color:var(--sua)}
.ejc ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.ejc li{font-size:13.5px;line-height:1.5;color:var(--sua)}
.tl2{background:linear-gradient(135deg,#FFF8EC,#FFF1D6);border:1px solid rgba(249,160,27,.42);border-radius:14px;padding:18px 21px;margin-bottom:12px}
.tl2 .h{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A6100;font-weight:700}
.tl2 h3{font-family:var(--fd);font-size:17px;margin:5px 0 3px;font-weight:600;color:#5A3A00}
.tl2 .m{font-family:var(--fm);font-size:11px;color:#9A6100;margin-bottom:9px}
.tl2 ol{margin:0 0 9px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tl2 li{font-size:14px;line-height:1.55;color:#4A3200}
.tl2 .lo{background:rgba(255,255,255,.8);border-radius:9px;padding:9px 12px;font-size:13px;color:#5A3A00}
.rcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px}
.rc{display:flex;gap:11px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:13px 15px;text-decoration:none;color:inherit;transition:.16s}
.rc:hover{border-color:var(--mor);transform:translateY(-3px)}
.rc .i{width:31px;height:31px;border-radius:9px;background:var(--morcl);color:var(--mor);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rc b{display:block;font-size:13.5px}.rc span{display:block;font-size:12px;color:var(--sua);line-height:1.45;margin-top:2px}
.dn{background:linear-gradient(135deg,#E9F9F0,#DCF5E8);border:1.5px solid rgba(0,165,81,.4);border-radius:14px;padding:19px 22px;margin-top:20px;text-align:center}
.dn h3{font-family:var(--fd);font-size:16.5px;margin:0 0 6px;color:#046B36;font-weight:600}
.dn p{margin:0 0 13px;font-size:14px;color:#0A5B31;line-height:1.55}
.nv{display:flex;justify-content:space-between;gap:11px;margin-top:24px}
.bt{font-family:var(--fd);font-weight:600;font-size:14px;border:none;border-radius:10px;padding:12px 19px;cursor:pointer;background:var(--mor);color:#fff;transition:.16s}
.bt:hover:not(:disabled){background:var(--mor2);transform:translateY(-1px)}
.bt:disabled{opacity:.34;cursor:not-allowed}
.bt.g{background:#fff;color:var(--mor);border:1px solid var(--lin)}
.bt.v{background:var(--ver)}.bt.n{background:var(--nar);color:#3B1557}
.bt.big{font-size:15.5px;padding:14px 27px}
.bl2{background:#FFF3DC;border:1px solid var(--nar);border-radius:14px;padding:22px 26px;text-align:center}
.bl2 .i{font-size:38px}.bl2 h3{font-family:var(--fd);font-size:18px;margin:8px 0 6px;color:#7A4E00}
.bl2 p{margin:0;font-size:14px;color:#8A5A00;line-height:1.6}
.pxb{background:linear-gradient(120deg,var(--nar),#E08600);color:#3B1557;border-radius:16px;padding:22px 25px;margin-top:19px}
.pxb h3{font-family:var(--fd);font-size:20px;margin:0 0 6px;font-weight:700}
.pxb p{margin:0 0 12px;font-size:14px;line-height:1.55}

/* PROGRESO */
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
.kp{background:var(--mor);color:#fff;border-radius:14px;padding:16px 19px}
.kp b{display:block;font-family:var(--fd);font-size:29px;line-height:1}
.kp span{font-family:var(--fm);font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.82}
.kp.v{background:var(--ver)}.kp.n{background:var(--nar);color:#3B1557}
.lr{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--lin);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.lr .n{font-family:var(--fm);font-weight:700;font-size:12px;background:var(--morcl);color:var(--mor);padding:5px 9px;border-radius:7px}
.lr .t{flex:1;font-size:14px}
.lr .s{font-family:var(--fm);font-size:12px}

/* MODALES / QUIZ */
.md{position:fixed;inset:0;background:rgba(36,24,51,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md .bx{background:#fff;border-radius:18px;max-width:800px;width:100%;padding:26px 28px;max-height:93vh;overflow-y:auto;animation:up .45s cubic-bezier(.2,.9,.25,1)}
.md h3{font-family:var(--fd);font-size:21px;margin:0 0 4px;font-weight:600}
.md .sb2{font-family:var(--fm);font-size:11.5px;color:var(--sua);margin-bottom:15px}
.cdn{position:fixed;inset:0;background:var(--mor);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cdn .n{font-family:var(--fd);font-size:clamp(88px,25vw,225px);font-weight:700;color:var(--ama);line-height:1;animation:pp .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pp{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.cdn .l{font-family:var(--fm);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px}
.qb{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:15px;flex-wrap:wrap}
.tm{font-family:var(--fm);font-size:24px;font-weight:600;background:var(--mor);color:#fff;padding:8px 14px;border-radius:10px}
.tm.w{background:var(--nar);color:#3B1557}.tm.c{background:var(--mal);color:#fff}
.tm.bt2{animation:bb .9s ease-in-out infinite}
@keyframes bb{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.09)}48%{transform:scale(1)}}
.pg{flex:1;min-width:100px;height:8px;background:var(--morcl);border-radius:5px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ver);border-radius:5px;transition:width .3s}
.qt{font-family:var(--fd);font-size:17.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.op{text-align:left;background:#fff;border:2px solid var(--lin);border-radius:11px;padding:12px 15px;font-family:var(--fb);font-size:14.5px;cursor:pointer;transition:.13s;display:flex;gap:10px;width:100%;margin-bottom:8px}
.op:hover{border-color:var(--mor);background:var(--morcl);transform:translateX(3px)}
.op .l{font-family:var(--fm);font-weight:600;color:var(--mor);flex:0 0 auto}
.rs{text-align:center}
.rs .nt{font-family:var(--fd);font-size:70px;font-weight:700;line-height:1;animation:pp .6s cubic-bezier(.2,1.3,.4,1)}
.rs .nt.o{color:var(--ver)}.rs .nt.m{color:var(--mal)}
.rs .ms{font-size:14.5px;color:var(--sua);margin:6px 0 15px}
.rv{text-align:left;margin-top:17px;border-top:1px solid var(--lin);padding-top:13px}
.rv .it{padding:10px 0;border-bottom:1px solid var(--lin);font-size:13.5px;line-height:1.55}
.rv .it:last-child{border:none}
.rv .s2{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-right:7px}
.rv .s2.o{background:#E3F6EC;color:var(--ver)}.rv .s2.m{background:#FCE9E9;color:var(--mal)}
.rv .ex{color:var(--sua);margin-top:4px;font-size:13px}
.av2{background:var(--morcl);border:1px solid var(--lin);border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.55;color:var(--sua);margin-top:12px}
.av2 b{color:var(--mor)}
.cod{font-family:var(--fm);font-size:11px;background:#241833;color:#7CFFB2;padding:11px 13px;border-radius:9px;word-break:break-all;line-height:1.5;margin-top:10px}
.wr2{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--lin);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.wr2 input{width:17px;height:17px;accent-color:var(--mor)}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--mor2);color:#fff;padding:13px 21px;border-radius:12px;font-size:14px;z-index:350;opacity:0;transition:.35s;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);width:268px}
 .side.abierta{transform:translateX(0);box-shadow:14px 0 44px rgba(0,0,0,.32)}
 .cls,.burg,.tlogo{display:block}
 .t1,.t2{display:none}
 .wr{padding:17px 14px}.top{padding:9px 13px}
 .hd{padding:21px 19px}.md .bx{padding:19px 15px}
 .th{display:block}
 .nv{flex-direction:column}.nv .bt{width:100%}
 .grid{grid-template-columns:1fr}
}
@media print{
 .side,.top,.nv,.pxb,.dn,#lg{display:none!important}
 body{background:#fff}.wr{max-width:100%;padding:0}.vd{display:none}
}

.tabf{flex:1;border:none;background:transparent;font-family:var(--fb);font-size:13.5px;font-weight:600;
  padding:9px 6px;border-radius:10px;cursor:pointer;color:var(--sua);transition:.16s}
.tabf.on{background:#fff;color:var(--mor);box-shadow:0 2px 8px rgba(92,36,131,.14)}
#lg .lgc{max-width:430px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

{n:1,unidad:'UNIDAD I · GENERALIDADES',tema:'Conceptos básicos de computación y encendido correcto',
 intro:'Bienvenidos. En ocho semanas usted va a pasar de encender un equipo a construir una hoja de cálculo que le diga si un negocio gana o pierde. Empezamos por lo básico, y lo básico importa: un equipo mal apagado pierde archivos.',
 objetivo:'Reconocer qué es un sistema de información, identificar las partes de un computador y encender y apagar un equipo por el procedimiento correcto.',
 contenido:[
  {t:'¿Qué es un sistema de información?',p:'Es el conjunto de <b>datos, personas, procesos y equipos</b> que trabajan juntos para producir información útil. En una tienda: el cuaderno de ventas, quien lo llena, la rutina de llenarlo y la calculadora ya son un sistema de información — solo que en papel.',
   lista:['<b>Dato</b>: un hecho suelto. “25.000”.','<b>Información</b>: el dato con contexto. “El martes se vendieron $25.000”.','<b>Conocimiento</b>: la información que permite decidir. “Los martes vendemos poco, conviene abrir más tarde”.']},
  {t:'Las partes que sí hay que saber nombrar',tabla:{c:['Parte','Qué hace','Por qué le importa'],
   f:[['<b>Torre / CPU</b>','Procesa y almacena','Ahí viven sus archivos'],
      ['<b>Monitor</b>','Muestra la imagen','No guarda nada; se cambia sin perder datos'],
      ['<b>Teclado y mouse</b>','Entrada de datos','Lo más barato de reemplazar'],
      ['<b>Puertos USB</b>','Conectan memorias e impresoras','Entran de un solo lado; forzarlos los parte'],
      ['<b>Cable de poder</b>','Alimenta el equipo','Con los bajones de luz, un regulador salva el equipo']]}},
  {t:'Encender y apagar: el gesto que más equipos daña',p:'Apagar con el botón de fuerza deja archivos a medias. Repetido, daña el sistema operativo. <b>Regla del curso: se apaga siempre por el menú de inicio.</b>',
   lista:['Encender: botón de la torre, esperar a que cargue <b>completamente</b> antes de abrir algo.','Apagar: menú Inicio → Apagar. Esperar a que la pantalla se apague sola.','Si se traba: Ctrl+Alt+Supr antes de recurrir al botón de fuerza.']}
 ],
 video:null,
 demoApagado:true,
 ejemplos:[
  {t:'El computador “dañado” del almacén',c:'En un almacén de Barranco hay un computador que “no sirve”. El dueño quiere botarlo y comprar otro.',
   p:['Primera pregunta: ¿el problema es de <b>hardware</b> o de <b>software</b>? Si prende y muestra imagen, el hardware básico funciona.','Si va lentísimo pero prende, casi siempre es software: programas acumulados o disco lleno.','Si no prende nada, se revisa lo más barato primero: cable de poder y tomacorriente.','Conclusión: no necesitaba computador nuevo. Necesitaba limpieza y un regulador de voltaje.'],
   m:'Saber distinguir hardware de software le acaba de ahorrar dos millones de pesos a un negocio.'},
  {t:'Los archivos que se perdieron por un apagón',c:'Una auxiliar trabaja dos horas en un informe. Se va la luz —cosa común acá— y el equipo se apaga de golpe.',
   p:['El archivo nunca se había guardado con nombre, así que no existía todavía en el disco.','La autorrecuperación de Office solo funciona bien si el archivo <b>ya fue guardado alguna vez</b>.','Se perdieron las dos horas completas.','La solución cuesta diez segundos: guardar antes de escribir la primera palabra.'],
   m:'En esta región, guardar antes de escribir no es una buena práctica: es una necesidad.'},
  {t:'El dato que no era información',c:'El dueño de una tienda dice “vendemos bien los sábados”. Le preguntan cuánto y no sabe.',
   p:['“Vendemos bien” es una <b>impresión</b>, no un dato.','Se midió una semana: sábado $340.000, martes $95.000.','Con eso ya se puede decidir: horarios, pedidos, personal de apoyo.','La impresión era cierta — pero con ella no se puede tomar ninguna decisión.'],
   m:'Todo este curso trata de convertir impresiones en datos, y datos en decisiones.'}
 ],
 taller:{t:'Reconoce, enciende y apaga',modo:'Individual · 25 minutos',
  pasos:['Encienda un equipo y espere a que cargue <b>completamente</b> antes de tocar nada.','Identifique y nombre en voz alta 8 componentes: monitor, torre, teclado, mouse, cable de poder, cable de datos, puertos USB y unidad de disco.','Abra cualquier programa, escriba su nombre y guárdelo en Documentos.','Apague el equipo por el <b>menú de inicio</b>. Cronometre cuánto tarda.','Escriba en su cuaderno tres tareas que hoy hace en papel y que podrían hacerse en computador.'],
  logro:'Encendió y apagó correctamente, nombró los 8 componentes y tiene sus tres tareas identificadas.'},
 tarea:'Elija un <b>negocio real</b> de su municipio (tienda, taller, aserrío, oficina, JAC) y levante su ficha: nombre, dueño, a qué se dedica, cuántas personas trabajan. Pregunte si tienen computador y cómo llevan hoy las cuentas. Ese negocio lo va a acompañar las 8 semanas.',
 recursos:[{i:'📘',t:'MinTIC · cursos gratuitos',d:'Formación certificada en competencias digitales',u:'https://www.mintic.gov.co/'},
           {i:'🔎',t:'Common Sense Education',d:'Recursos abiertos sobre ciudadanía digital',u:'https://www.commonsense.org/education'}]},

{n:2,unidad:'UNIDAD I · GENERALIDADES',tema:'Software, escritorio y conexión de dispositivos',
 intro:'Hoy abrimos la máquina: qué es hardware, qué es software, y cómo se conecta un dispositivo sin dañar nada.',
 objetivo:'Distinguir hardware de software, moverse con soltura por el escritorio de Windows y conectar y expulsar correctamente un dispositivo externo.',
 contenido:[
  {t:'Hardware es lo que se golpea. Software es lo que se maldice.',p:'Esa frase vieja de los técnicos resume bien la diferencia.',
   lista:['<b>Hardware</b>: todo lo físico. Monitor, teclado, torre, cables, memorias.','<b>Software</b>: los programas y el sistema operativo. Windows es software. Excel es software. El virus también.','Regla práctica: <b>si se moja es hardware; si se borra es software</b>.','Y hay una tercera cosa: los <b>datos</b>. Su informe no es hardware ni software — y es lo único verdaderamente irremplazable.']},
  {t:'El escritorio: su mesa de trabajo digital',
   lista:['<b>Iconos</b>: los accesos. Un icono con flechita es un atajo, no el archivo real.','<b>Barra de tareas</b>: muestra qué está abierto ahora. Sirve para saber si el equipo trabaja o está trabado.','<b>Ventanas</b>: minimizar no es lo mismo que cerrar. Minimizar deja el programa corriendo.','<b>Configuración</b>: volumen, hora, red, impresoras. Ahí se resuelve el 80% de los problemas antes de llamar a un técnico.']},
  {t:'Conectar y expulsar: dos segundos que salvan un semestre',p:'Cuando usted copia un archivo, el sistema no termina de escribirlo al instante. Si retira la memoria en ese momento, el archivo queda a medias y la memoria pierde su índice.',
   lista:['Conectar: el USB entra <b>de un solo lado</b>. Si hay que forzarlo, está al revés.','Verificar: debe aparecer una unidad nueva en el explorador.','<b>Expulsar siempre</b> antes de retirar. Esperar el mensaje de “se puede retirar”.']}
 ],
 video:{id:'gqTw6fW52pw',t:'Cómo crear y guardar un documento',d:'Repaso práctico del gesto más importante de la semana: crear un archivo y guardarlo donde se pueda encontrar después.'},
 ejemplos:[
  {t:'La memoria USB que se dañó',c:'Un estudiante retira la memoria de un golpe. Al reconectarla, el sistema pide formatearla. Adentro estaba todo el semestre.',
   p:['El archivo quedó a medias porque el sistema aún estaba escribiendo.','La memoria perdió su índice: los datos están pero el sistema no sabe dónde.','Recuperar eso es caro y casi nunca funciona del todo.','Dos segundos de paciencia contra un semestre de trabajo.'],
   m:'Es la causa número uno de pérdida de archivos en cursos como este. Expulsar siempre, sin excepción.'},
  {t:'La impresora que “no imprime”',c:'En una oficina nadie logra imprimir. Llaman a un técnico de otro municipio, que cobra el viaje.',
   p:['Se revisa el <b>hardware</b>: ¿encendida?, ¿tiene papel?, ¿el cable está en ese equipo?','Se revisa el <b>software</b>: ¿aparece en configuración de impresoras?, ¿está predeterminada?','Se revisa la <b>cola de impresión</b>: había tres documentos trabados desde la semana anterior.','Se canceló la cola y todo imprimió.'],
   m:'El técnico cobró el viaje por algo que se resuelve en dos minutos si uno sabe dónde mirar.'},
  {t:'El equipo lento del consultorio',c:'Un equipo tarda cinco minutos en abrir un documento. El dueño cree que está viejo.',
   p:['En la barra de tareas había <b>once programas abiertos</b>, todos minimizados desde hacía días.','Minimizar no cierra: el programa sigue consumiendo memoria.','Se cerraron todos y el equipo volvió a responder normal.','Costo de la solución: cero pesos.'],
   m:'Confundir minimizar con cerrar es el hábito que más “envejece” un computador que está bien.'}
 ],
 taller:{t:'Reconoce, conecta y configura',modo:'Parejas · 30 minutos',
  pasos:['Identifiquen 8 componentes y clasifíquenlos con la letra <b>H</b> (hardware). Luego nombren 3 programas y márquenlos con <b>S</b>.','Conecten una memoria USB y verifiquen que el sistema la reconoce.','Creen dentro de ella una carpeta con su nombre y copien un archivo de prueba.','<b>Expúlsenla correctamente</b> y espere el mensaje. Repitan el proceso completo dos veces.','Ajusten volumen, hora y resolución de pantalla. Cierren todos los programas abiertos desde la barra de tareas.'],
  logro:'La memoria fue conectada y expulsada correctamente dos veces, sin advertencia de retiro inseguro.'},
 tarea:'Levante el <b>inventario de equipos</b> del negocio que eligió: computadores, impresoras, celulares de trabajo, memorias. Anote el estado de cada uno. Si no tienen ninguno, escriba qué necesitarían como mínimo para sistematizarse, con precios reales averiguados en el pueblo.',
 recursos:[{i:'🖥️',t:'Explorador de Windows · guía UAEH',d:'Gestión de archivos y carpetas, PDF abierto',u:'https://www.uaeh.edu.mx/docencia/P_Presentaciones/prepa3/2017/Informatica_Sistemas_operativos_Francisco.pdf'}]},

{n:3,unidad:'UNIDAD I · GENERALIDADES',tema:'Archivos y carpetas: organización, búsqueda y propiedades',
 intro:'Hoy construimos la carpeta que va a recibir todo lo que usted produzca en el curso. Parece el tema más aburrido. Es el que decide si en la semana 8 entrega un trabajo completo o anda buscando archivos perdidos.',
 objetivo:'Construir una estructura de carpetas que resista todo el curso, nombrar archivos con una regla que sirva para encontrarlos, y localizar un documento en segundos.',
 contenido:[
  {t:'Una carpeta no es una caja: es un archivador',
   lista:['Una carpeta puede contener archivos <b>y otras carpetas</b>. Eso se llama jerarquía.','Regla: si una carpeta tiene más de 20 archivos sueltos, le falta una subcarpeta.','El <b>escritorio no es un archivador</b>: es la mesa. Se usa para lo del momento y se despeja.','La <b>extensión</b> dice con qué programa abre: .docx Word, .xlsx Excel, .pdf cualquiera, .jpg foto.']},
  {t:'La regla de oro para nombrar archivos',p:'El nombre es la única pista que usted va a tener dentro de seis meses. “Documento1” y “nuevo (2)” no son pistas: son problemas futuros.',
   tabla:{c:['Mal nombrado','Bien nombrado','Por qué'],
   f:[['Documento1.docx','COTIZACION_FerreteriaLuz_2026-03-14.docx','Dice qué es, de quién y cuándo'],
      ['foto 001.jpg','EVIDENCIA_Bodega_2026-03-14.jpg','Se sabe qué muestra sin abrirla'],
      ['informe final FINAL v2','INFORME_Ventas_Marzo_2026-04-02.docx','No hay que adivinar cuál es el bueno'],
      ['lista.xlsx','INVENTARIO_Tienda_2026-04.xlsx','Se ordena solo al lado de los otros meses']]}},
  {t:'Buscar y verificar',
   lista:['El <b>buscador</b> encuentra por nombre, por tipo y por fecha. No hay que recordar dónde quedó: hay que recordar cómo se llama.','La fecha se escribe <b>año-mes-día</b>: así la lista se ordena sola en orden cronológico.','Las <b>propiedades</b> (clic derecho) muestran tamaño, tipo y fecha de modificación.','Un archivo de <b>0 KB</b> está vacío o corrupto aunque el nombre se vea bien. Revíselo antes de enviar.']}
 ],
 video:null,
 demoCarpetas:true,
 ejemplos:[
  {t:'El archivo que nadie volvió a encontrar',c:'En un taller guardaron la lista de proveedores con precios. La llamaron “lista” y la dejaron en el escritorio.',
   p:['Seis meses después, cuando llegó el momento de comprar, nadie la encontró.','El archivo <b>sí estaba</b>: pero el escritorio tenía 40 archivos y tres se llamaban parecido.','Ninguno tenía fecha en el nombre. Abrieron uno por uno hasta que se cansaron.','Costo real: dos días de trabajo repetido y una compra aplazada un mes.'],
   m:'El archivo no se perdió: se volvió inencontrable, que en la práctica es lo mismo.'},
  {t:'La auditoría que encontró todo en dos minutos',c:'A una oficina le piden tres soportes de un contrato. El auditor está sentado esperando.',
   p:['La carpeta tenía cinco subcarpetas numeradas, no archivos sueltos.','Los documentos estaban nombrados con año-mes-día, así que salían ordenados solos.','El buscador los encontró escribiendo solo una palabra.','Tiempo total: dos minutos. El auditor anotó que había control documental.'],
   m:'No fue suerte: alguien se tomó veinte minutos, un día, en crear bien una estructura de carpetas.'},
  {t:'El correo con el archivo vacío',c:'Un trabajo se envía a tiempo. Al abrirlo está en blanco: 0 KB.',
   p:['El programa se cerró antes de terminar de escribir el archivo.','El nombre y el ícono se veían normales. Por fuera nada indicaba el problema.','La única señal estaba en las <b>propiedades</b>: 0 KB de tamaño.','Regla desde hoy: antes de enviar, abrir el archivo y mirar su peso.'],
   m:'Verificar toma diez segundos. Perder una nota por un archivo vacío duele todo un corte.'}
 ],
 taller:{t:'La carpeta madre del curso',modo:'Individual · 35 minutos',
  pasos:['Cree una carpeta con el nombre de su negocio: <b>GESTION_NombreNegocio_2026</b>. Sin tildes ni espacios.','Dentro, cree cinco subcarpetas: <b>01_Documentos · 02_Presentaciones · 03_Datos · 04_Evidencias · 05_Entregas</b>.','Los números al inicio hacen que se ordenen como usted quiere, no alfabéticamente.','Cree un archivo <b>FICHA_NEGOCIO</b> con los datos que levantó la semana 1.','Renombre tres fotos del negocio con la regla: <b>QUÉ ES _ DE QUIÉN _ AÑO-MES-DÍA</b>.','Cierre todo y encuentre la ficha usando <b>solo el buscador</b>. Reto: menos de 15 segundos.'],
  logro:'La carpeta existe con sus cinco subcarpetas, los archivos siguen la regla y superó el reto del buscador.'},
 tarea:'Envíe una <b>captura de pantalla</b> donde se vea su estructura de carpetas completa y abierta, con al menos tres archivos ya renombrados según la regla del curso. Copie además toda la carpeta a una memoria USB: <b>todo vive en dos lugares</b>.',
 recursos:[],
 parcial:'p1'},

{n:4,unidad:'UNIDAD II · WORD Y POWERPOINT',tema:'Word: tablas, objetos y combinar correspondencia',
 intro:'Hoy es la clase que más impresiona del curso: van a generar <b>decenas de cartas personalizadas en tres minutos</b>, sin escribir una por una.',
 objetivo:'Construir tablas con formato, insertar imágenes sin deformarlas y generar documentos personalizados en serie con combinar correspondencia.',
 contenido:[
  {t:'La tabla: el formato natural de la información administrativa',
   lista:['Se inserta desde <b>Insertar → Tabla</b>. Para moverse entre celdas: la tecla <b>Tab</b>.','Si presiona Tab en la última celda, Word crea una fila nueva sola.','La <b>fila de encabezado</b> en negrita con fondo no es decoración: permite leer la tabla de un vistazo.','En tablas largas, active <b>repetir fila de encabezado</b> para que reaparezca en cada página.']},
  {t:'Imágenes: la evidencia que sustenta un documento',
   lista:['Cambie el tamaño <b>siempre desde una esquina</b>, nunca desde el lado: desde el lado la deforma.','El <b>ajuste de texto</b> decide cómo se acomoda. Para documentos formales, “en línea con el texto”.','Toda foto de evidencia lleva <b>pie explicativo</b>: qué muestra, dónde y cuándo.']},
  {t:'Combinar correspondencia: un día de trabajo en tres minutos',
   tabla:{c:['Pieza','Qué es','En nuestro caso'],
   f:[['<b>Documento principal</b>','La plantilla con el texto fijo','La carta o el certificado'],
      ['<b>Lista de datos</b>','Una tabla con lo que cambia','Los nombres de clientes o empleados'],
      ['<b>Campos combinados</b>','Las marcas donde entra cada dato','Donde dice «Nombre»'],
      ['<b>Resultado</b>','Un documento por registro','30 cartas personalizadas']]},
   p:'Sirve para mucho más que cartas: certificados, citaciones, notificaciones, recibos. <b>Todo lo que sea el mismo texto con distinto nombre.</b>'}
 ],
 video:{id:'fWZMvID-Mns',t:'Combinar correspondencia en Word · ejemplo práctico',d:'Ejemplo completo y sencillo, con documentos de práctica descargables. Es exactamente el taller de hoy.'},
 video2:{id:'D1UB0MzVH3M',t:'Combinar Word con una lista de Excel',d:'La variante más usada en oficina: la lista de datos vive en Excel y la plantilla en Word.'},
 ejemplos:[
  {t:'Las 30 cartas en tres minutos',c:'Una oficina debe enviar constancia a 30 personas. La secretaria calcula dos días escribiendo nombre por nombre.',
   p:['Se escribe <b>una sola vez</b> la plantilla con los espacios variables.','Se prepara la lista con los 30 nombres en una tabla.','Se insertan los <b>campos combinados</b> donde van los datos.','Se pulsa finalizar y combinar: salen las 30 cartas de golpe.','Si mañana entran dos personas más, se agregan a la lista y se vuelve a generar.'],
   m:'Este es el momento en que alguien recién llegado se gana el respeto de una oficina: resuelve en minutos lo que otros hacen en días.'},
  {t:'La foto deformada del informe',c:'Un auxiliar agranda la foto de la bodega arrastrando desde el lado. Queda estirada y aplastada.',
   p:['Desde el lado solo cambia el ancho; la proporción se pierde.','Desde la <b>esquina</b>, ancho y alto cambian juntos.','Una foto deformada en un informe resta credibilidad: sugiere descuido en todo lo demás.','Se corrigió reinsertando la imagen y ajustando desde la esquina.'],
   m:'Los detalles pequeños son los que separan un informe que parece profesional de uno improvisado.'},
  {t:'La tabla partida en dos páginas',c:'Una lista de precios de 15 filas queda cortada: el encabezado en una página y ocho filas huérfanas en la otra.',
   p:['Por defecto Word corta la tabla donde se acaba la hoja, sin repetir el encabezado.','Se activa <b>repetir fila de encabezado</b> y la primera fila reaparece arriba en cada página.','También se puede impedir que una fila se parta por la mitad.','Con eso la tabla se lee igual de bien en la página 1 que en la 4.'],
   m:'Una tabla que se lee mal es una tabla que nadie usa.'}
 ],
 taller:{t:'Lista de precios + cartas en serie',modo:'Individual · 45 minutos',
  pasos:['Cree una tabla de 4 columnas: <b>Producto · Presentación · Precio · Observación</b>, con mínimo 6 productos reales de su negocio.','Dé formato a la fila de encabezado y active repetir encabezado.','Inserte una foto del negocio, ajústela <b>desde la esquina</b> y póngale pie de foto.','Cree la plantilla de una carta: “Señor(a) ____, le informamos que ____”.','Cree la lista con mínimo 5 nombres reales de clientes o compañeros.','Inserte los campos, use <b>vista previa</b> para verificar que ninguno quedó sin reemplazar, y finalice la combinación.'],
  logro:'Existen tantas cartas como nombres en la lista, ninguna con campos sin reemplazar, y la tabla se lee completa.'},
 tarea:'Envíe la carpeta con la <b>lista de precios</b> en tabla, la foto con su pie, y las <b>cartas generadas</b> en serie. Si el dueño del negocio lo autoriza, imprima una y entréguela de verdad: escriba en el correo qué reacción tuvo.',
 recursos:[{i:'📄',t:'CustomGuide · Combinar correspondencia',d:'Guía escrita paso a paso, en español',u:'https://www.customguide.com/curso/word/combinar-correspondencia'},
           {i:'📘',t:'Primeros pasos con Word 2016',d:'Manual oficial en PDF, acceso abierto',u:'https://ast.aragon.es/sites/default/files/primerospasosword2016_0.pdf'}]},

{n:5,unidad:'UNIDAD II · WORD Y POWERPOINT',tema:'PowerPoint: vistas, diapositivas y patrón',
 intro:'Pasamos a las presentaciones. Y arrancamos por donde casi nadie arranca: <b>el patrón de diapositivas</b>. Se hace una sola vez y sirve para toda la presentación.',
 objetivo:'Crear una presentación, moverse entre sus vistas y montar el patrón para que todas las láminas salgan iguales sin repetir trabajo.',
 contenido:[
  {t:'Una presentación no es un documento proyectado',
   lista:['Un <b>documento</b> se lee solo, sin nadie al lado. Por eso lleva todo el detalle.','Una <b>presentación acompaña a quien habla</b>. La lámina apoya; el detalle lo pone su voz.','Regla: <b>máximo seis líneas por diapositiva</b>. Si necesita más, son dos diapositivas.','Si usted lee la lámina en voz alta, sobra usted.']},
  {t:'Las vistas: cada una para su momento',
   tabla:{c:['Vista','Para qué sirve','Cuándo se usa'],
   f:[['<b>Normal</b>','Editar cada lámina','Mientras arma la presentación'],
      ['<b>Clasificador</b>','Ver todas en miniatura','Para reordenar y revisar el hilo'],
      ['<b>Presentación</b>','Pantalla completa','Frente al público'],
      ['<b>Patrón</b>','Editar el diseño de todas','Al comenzar, una sola vez'],
      ['<b>Notas</b>','Escribir lo que usted va a decir','Para preparar sin llenar la lámina']]}},
  {t:'El patrón de diapositivas',p:'Define colores, tipo de letra, posición del título, logo y pie. Todo lo que ponga ahí <b>aparece automáticamente</b> en cada lámina nueva. Si cambia un color en el patrón, cambian todas de golpe.',
   lista:['Se entra por <b>Vista → Patrón de diapositivas</b> y se sale con “Cerrar vista patrón”.','Si el negocio tiene logo, va en el patrón: así aparece en todas sin volver a insertarlo.','Dos colores y dos tipos de letra, máximo. Más no es más bonito: es más desordenado.']}
 ],
 video:{id:'WMfkT_l5pt4',t:'Cómo usar el patrón de diapositivas en PowerPoint',d:'El tema central de la semana, explicado paso a paso: definir una vez y aplicar a todas.'},
 video2:{id:'vZTPOsVzGWs',t:'PowerPoint · curso completo desde cero',d:'Repaso general para quien viene sin base. Útil como refuerzo del trabajo independiente.'},
 ejemplos:[
  {t:'La presentación que cambió de color en diez segundos',c:'Un auxiliar tiene lista una presentación de 20 láminas. A última hora le piden usar los colores corporativos.',
   p:['Si el formato está puesto <b>lámina por lámina</b>, son 20 correcciones a mano. Media hora larga y con riesgo de que alguna quede distinta.','Si está en el <b>patrón</b>, se cambia el color una sola vez.','Las 20 láminas se actualizan solas, incluidas las que agregue después.','Tiempo real de la corrección: diez segundos.'],
   m:'Media hora contra diez segundos, por una decisión que se toma al comenzar.'},
  {t:'La lámina que nadie leyó',c:'Se proyecta una diapositiva con doce líneas de texto en una reunión. Nadie la lee; algunos miran el celular.',
   p:['El texto era correcto: el problema era el formato y el tamaño de letra.','El público no puede leer y escuchar al mismo tiempo.','Se rehízo con una imagen grande, un título de seis palabras y tres puntos cortos.','La misma información, pero esta vez la gente miró la pantalla y después a quien hablaba.'],
   m:'Una presentación no busca entregar información: busca que alguien decida o cambie algo.'},
  {t:'La presentación que se veía distinta en cada equipo',c:'Se prepara en un computador y al proyectarla en otro las letras cambian y los títulos se corren.',
   p:['Se usó un tipo de letra instalado en un equipo pero no en el otro.','PowerPoint la reemplazó por la que encontró y se movió todo.','Solución 1: usar tipos de letra comunes.','Solución 2: llevar también la presentación <b>exportada a PDF</b>.'],
   m:'Nunca llegue a presentar con un solo formato. El PDF es su seguro.'}
 ],
 taller:{t:'El patrón de mi negocio',modo:'Individual · 40 minutos',
  pasos:['Cree la presentación y guárdela en <code>02_Presentaciones</code>.','Entre a <b>Vista → Patrón de diapositivas</b>.','Elija <b>dos colores</b>: uno oscuro para títulos, uno claro de fondo. Solo dos.','Defina el tipo de letra: uno para títulos, otro para el cuerpo. Tamaño grande.','Si consiguió el logo del negocio, insértelo en una esquina del patrón. Agregue el nombre en el pie.','Cierre la vista patrón y agregue tres láminas nuevas: compruebe que salen ya con el diseño.'],
  logro:'Las láminas nuevas salen con los colores, la letra y el logo aplicados, sin formatear ninguna a mano.'},
 tarea:'Entregue la presentación con el <b>patrón montado</b> y la portada lista: título de la presentación, nombre del negocio y fecha. Agregue tres láminas vacías para comprobar que el patrón funciona en todas. Traiga los <b>datos de ventas o inventario</b> del negocio: se usan la próxima semana para el gráfico.',
 recursos:[]},

{n:6,unidad:'UNIDAD II · WORD Y POWERPOINT',tema:'Texto, tablas, gráficos y autoformas · preparación de la salida',
 intro:'Hoy la presentación se llena: tabla, gráfico, autoformas para señalar lo importante, y la preparamos para imprimir o proyectar.',
 objetivo:'Completar una presentación con texto breve, tabla, gráfico y autoformas, y dejarla lista para proyectar o imprimir como material de apoyo.',
 contenido:[
  {t:'Texto en diapositiva: menos palabras, más grandes',
   lista:['Frases cortas, no párrafos. La diapositiva es un titular.','Tamaño mínimo para proyectar: <b>24 puntos</b> en el cuerpo, 32 o más en títulos.','Si una idea no cabe en seis líneas, son dos diapositivas. <b>Nunca reduzca la letra para que quepa.</b>','Lo que usted va a decir va en el <b>panel de notas</b>, no en la lámina.']},
  {t:'Tablas y gráficos: cuándo usar cada uno',
   tabla:{c:['Herramienta','Sirve para','Ejemplo administrativo'],
   f:[['<b>Tabla</b>','Consultar un dato exacto','Lista de precios por producto'],
      ['<b>Barras</b>','Comparar cantidades','Ventas por producto o por mes'],
      ['<b>Líneas</b>','Ver evolución en el tiempo','Ventas mes a mes'],
      ['<b>Circular</b>','Mostrar proporción del total','Qué porcentaje representa cada categoría']]},
   p:'Regla simple: si el público necesita <b>buscar un dato</b>, use tabla. Si necesita <b>entender una tendencia</b>, use gráfico.'},
  {t:'Autoformas y preparación de la salida',
   lista:['Se insertan desde <b>Insertar → Formas</b>: flechas, círculos, llamadas de texto.','Quíteles el relleno y déjeles solo el borde grueso, para que no tapen la imagen.','<b>Documento de apoyo</b>: Archivo → Imprimir → Documentos, 3 diapositivas por página. Deja renglones para anotar.','<b>Exportar a PDF</b>: se ve igual en cualquier equipo, incluso en un celular.']}
 ],
 video:{id:'vZTPOsVzGWs',t:'PowerPoint completo · tablas, gráficos y objetos',d:'Repase desde el minuto donde se trabajan tablas, gráficos e inserción de objetos.'},
 ejemplos:[
  {t:'El gráfico que consiguió el presupuesto',c:'Un administrador llevaba dos meses pidiendo recursos y solo presentaba tablas. Nadie decidía.',
   p:['La tabla obligaba a leer quince filas para entender la magnitud.','Cambió a un <b>gráfico circular</b>: mostraba de un vistazo la proporción del problema.','Debajo, una sola frase con el costo total de resolverlo.','La decisión se tomó en esa misma reunión.'],
   m:'Los mismos datos, presentados distinto, producen decisiones distintas.'},
  {t:'El gráfico de veinte barras',c:'Se grafican los veinte productos del inventario en un solo gráfico. Se ve impresionante y no se entiende nada.',
   p:['Veinte barras juntas hacen ilegibles las etiquetas.','El mensaje se pierde: no se distingue cuál es el más importante.','Se agrupó: los cinco principales y el resto sumado como “otros”.','Seis barras, un mensaje claro, y el detalle quedó en la tabla.'],
   m:'Un gráfico no es para mostrar todos los datos: es para mostrar <b>un mensaje</b>.'},
  {t:'La presentación que se dio sin luz',c:'Se va la energía justo antes de la reunión. El video beam no sirve.',
   p:['Traía la presentación <b>impresa como documento de apoyo</b>: tres diapositivas por hoja.','Repartió las hojas y dio la reunión igual.','Cada asistente se quedó con el material — cosa que no pasa cuando solo se proyecta.','La firma de asistencia se recogió en la misma hoja.'],
   m:'En esta región, preparar la salida impresa no es plan B: es lo que garantiza que la reunión ocurra.'}
 ],
 taller:{t:'La presentación del negocio en 6 diapositivas',modo:'Individual · 50 minutos',
  pasos:['<b>Lámina 1</b>: portada con nombre del negocio y fecha.','<b>Lámina 2</b>: foto del negocio con una <b>autoforma</b> señalando algo relevante y una llamada de texto de máximo seis palabras.','<b>Lámina 3</b>: la tabla de precios traída desde Word, con la letra agrandada para proyección.','<b>Lámina 4</b>: un gráfico con los datos que trajo. Máximo seis datos, con título y etiquetas.','<b>Lámina 5</b>: cuál es el problema del negocio y qué propone usted.','<b>Lámina 6</b>: cierre. Exporte a <b>PDF</b> y configure la impresión a 3 diapositivas por página.'],
  logro:'Seis láminas con el patrón aplicado, ninguna con más de seis líneas, y la presentación existe en .pptx y .pdf.'},
 tarea:'Entregue la presentación completa en <b>.pptx y .pdf</b>. Y traiga los datos para Excel: lista de productos con <b>precio de compra y de venta</b>, ventas de una semana día por día, y los gastos fijos del mes. <b>Sin esos datos no hay clase la próxima semana.</b>',
 recursos:[],
 parcial:'p2'},

{n:7,unidad:'UNIDAD III · EXCEL',tema:'Hoja de cálculo: celdas, formato y fórmulas básicas',
 intro:'Hoy su negocio entra al computador. Al final de la jornada va a saber, con un número exacto, <b>cuánto gana de verdad</b> por cada producto.',
 objetivo:'Montar la base de datos del negocio, dar formato legible a la hoja y calcular con fórmulas el margen real de cada producto.',
 contenido:[
  {t:'Una hoja de cálculo es una tabla que piensa',p:'En Word usted escribe los números. En Excel escribe <b>la relación entre los datos</b> y el resultado se actualiza solo.',
   lista:['<b>Celda</b>: el cuadrito. Se nombra con letra y número: C7.','<b>Columna</b>: vertical, con letras. <b>Fila</b>: horizontal, con números.','<b>Hoja</b>: una página del libro. Nómbrelas: PRODUCTOS, VENTAS, GASTOS.','<b>Barra de fórmulas</b>: en la celda ve el resultado; en la barra ve cómo se obtuvo.']},
  {t:'Las cuatro reglas de una base de datos',
   lista:['<b>Una fila = un registro.</b> Cada producto ocupa una fila completa.','<b>Una columna = un tipo de dato.</b> No se mezclan precios con nombres.','<b>Encabezados una sola vez</b>, en la primera fila. Nunca repetidos en la mitad.','<b>Sin filas vacías</b> en medio: Excel cree que ahí se acabó la tabla.']},
  {t:'Las cuatro fórmulas que resuelven casi todo',
   tabla:{c:['Operación','Se escribe','Ejemplo administrativo'],
   f:[['<b>Multiplicación</b>','=A2*B2','Cantidad × precio unitario'],
      ['<b>Resta</b>','=C2-B2','Margen: precio de venta menos el de compra'],
      ['<b>Suma</b>','=SUMA(D2:D20)','Total de ventas de la semana'],
      ['<b>División</b>','=D2/C2','Margen en porcentaje']]},
   p:'Todas empiezan con el signo <b>=</b>. Sin él, Excel lo toma como texto y no calcula. Es el error número uno de quien empieza.'}
 ],
 video:{id:'TFLM5EGCQ0w',t:'Control de inventario en Excel: entradas, salidas y stock',d:'Plantilla pensada para negocios pequeños. Es exactamente el destino del taller de hoy.'},
 video2:{id:'kP1qcrsTyu4',t:'Control de caja de un negocio en Excel',d:'Ingresos, egresos y saldo. Se conecta directo con la hoja de GASTOS que va a construir.'},
 ejemplos:[
  {t:'El cuaderno contra la hoja de Excel',c:'Una tienda lleva sus cuentas en un cuaderno. El proveedor sube el precio de un producto.',
   p:['En el <b>cuaderno</b>: borrar el precio viejo, recalcular el costo, recalcular la ganancia, corregir el total. Cuatro operaciones a mano, con riesgo en cada una.','En <b>Excel</b>: se cambia el precio en su celda y todo lo demás se actualiza solo.','Si al mes siguiente suben tres precios, en el cuaderno son doce operaciones; en Excel son tres cambios.','Y no hay riesgo de error de cálculo, porque nadie está sumando a mano.'],
   m:'Esa es la única razón por la que Excel existe: que el cálculo no dependa de que una persona no se equivoque.'},
  {t:'La celda que decía $ pero era texto',c:'Se escriben los precios así: “$ 25.000”. La hoja se ve perfecta. Al sumar la columna, el resultado da cero.',
   p:['Excel no vio números: vio <b>texto</b>. El signo y los puntos escritos a mano convierten la celda en palabra.','La pista está en la alineación: los números se alinean solos a la <b>derecha</b>; el texto, a la izquierda.','Solución: escribir 25000 limpio y aplicar <b>formato de moneda</b> desde el menú.','Se ve igual, pero ahora sí se puede sumar.'],

function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(36).toUpperCase()}
const SEC='UNICARIBE-CDI-2026';
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function mkCod(o){const p=[o.nombre,o.correo,o.parcial,o.intento,o.ok,o.tot,o.nota,o.fecha].join('|');return fnv(p+SEC)+'.'+b64e(p)}

 const c=(document.getElementById('cv').value||'').trim(),r=document.getElementById('cr'),pt=c.split('.');

 let p;try{p=b64d(pt[1])}catch(e){r.innerHTML='<b style="color:var(--mal)">No se pudo leer el código.</b>';return}
 const ok=fnv(p+SEC)===pt[0],f=p.split('|');
 r.innerHTML=ok?`<div style="background:#E9F9F0;border:1px solid var(--ver);border-radius:11px;padding:14px">

   <b>Aciertos:</b> ${esc(f[4])} de ${esc(f[5])}<br><b>NOTA:</b> <span style="font-size:19px;font-weight:700;color:var(--mor)">${esc(f[6])}</span><br>
   <b>Fecha:</b> ${esc(f[7])}</div></div>`
  :`<div style="background:#FCE9E9;border:1px solid var(--mal);border-radius:11px;padding:14px">
   <b style="color:var(--mal)">⚠️ Código alterado o inválido.</b><div style="margin-top:6px;font-size:13.5px">No acepte este resultado; pida que vuelva a presentar.</div></div>`;

}

/* ==========================================================
   INGRESO CON GOOGLE
   El estudiante entra con la cuenta de Google que ya tiene
   abierta en su equipo. No hay contraseñas que olvidar.
   ========================================================== */
const CORREO_CC='inbox.nativo@gmail.com';
let GSI_LISTO=false;

function payloadJWT(t){
  try{
    const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }catch(e){ return null; }
}
const normCorreo=c=>String(c||'').trim().toLowerCase();

function esDocente(correo){
  const lista=(CFG&&CFG.docentes)?CFG.docentes:[CORREO_DOC];
  return lista.map(normCorreo).includes(normCorreo(correo));
}
function buscarPorCorreo(correo){
  const c=normCorreo(correo);
  return ESTUDIANTES.find(e=>normCorreo(e.c)===c);
}

function montarIngreso(){
  const cid=CFG&&CFG.google_client_id;
  const zona=document.getElementById('zonaIngreso');
  if(!zona) return;
  if(!cid){
    // Sin identificador configurado se conserva el ingreso por contraseña,
    // para que la plataforma nunca quede inaccesible.
    zona.innerHTML=`<div class="err" style="display:block;background:#FFF8EC;color:#7A4E00;border:1px solid rgba(249,160,27,.5)">
      <b>Falta configurar el ingreso con Google.</b> Mientras tanto, entre con su usuario y contraseña.</div>
      ${formularioClave()}`;
    return;
  }
  zona.innerHTML=`<div id="btnGoogle" style="display:flex;justify-content:center;min-height:44px"></div>
    <div class="err" id="ie"></div>
    <p style="font-size:12.5px;color:var(--sua);text-align:center;line-height:1.55;margin:14px 0 0">
      Use la <b>misma cuenta de Google</b> que tiene en su celular o computador.
      Si le dice que no está en la lista, escríbale al docente indicándole ese correo.</p>`;
  esperarGSI(cid,0);
}
function formularioClave(){
  return `<label>Usuario</label><input class="inp" id="iu" placeholder="Su primer apellido" autocomplete="username">
    <label>Contraseña</label><input class="inp mono" id="ic" type="password" placeholder="ABC-123" autocomplete="current-password">
    <div class="err" id="ie"></div>
    <button class="bt big" style="width:100%" onclick="entrar()">Entrar →</button>`;
}
function esperarGSI(cid,intentos){
  if(window.google&&google.accounts&&google.accounts.id){
    try{
      google.accounts.id.initialize({client_id:cid,callback:llegoGoogle,auto_select:false,cancel_on_tap_outside:true});
      google.accounts.id.renderButton(document.getElementById('btnGoogle'),
        {theme:'filled_blue',size:'large',shape:'pill',text:'continue_with',locale:'es',width:300});
      GSI_LISTO=true;
    }catch(e){ falloGSI('No se pudo iniciar el ingreso con Google.'); }
    return;
  }
  if(intentos>40){ falloGSI('No se pudo cargar Google. Revise su conexión a internet e intente de nuevo.'); return; }
  setTimeout(()=>esperarGSI(cid,intentos+1),250);
}
function falloGSI(msg){
  const e=document.getElementById('ie');
  if(e){ e.textContent=msg; e.style.display='block'; }
  const z=document.getElementById('btnGoogle');
  if(z) z.innerHTML=`<button class="bt g" onclick="location.reload()">↻ Reintentar</button>`;
}
function llegoGoogle(resp){
  const d=payloadJWT(resp&&resp.credential);
  const e=document.getElementById('ie');
  const err=t=>{ if(e){e.textContent=t;e.style.display='block';} sRep(); };
  if(!d||!d.email){ err('No se pudo leer la cuenta de Google. Intente otra vez.'); return; }
  if(d.email_verified===false){ err('Esa cuenta de Google no está verificada.'); return; }

  if(esDocente(d.email)){
    ST.u={u:'docente',n:d.name||'Docente',c:d.email};
    ST.esDoc=true; abrirApp(); return;
  }
  const al=buscarPorCorreo(d.email);
  if(!al){
    err('El correo '+d.email+' no está en la lista de este curso. Escríbale al docente indicándole exactamente ese correo.');
    return;
  }
  ST.u=al; ST.esDoc=false; abrirApp();
}


/* ==========================================================
   REGISTRO E INICIO DE SESIÓN CON FIREBASE
   El estudiante crea su cuenta con correo y contraseña o con
   Google. El docente aprueba el acceso desde la hoja de Google.
   ========================================================== */
let FBA=null, FBM=null, FBLISTO=false;

async function cargarFirebase(){
  const c=CFG&&CFG.firebase;
  if(!c||!c.apiKey) return false;
  const versiones=[CFG.firebase_sdk,'12.19.0','12.18.0','11.10.0'].filter(Boolean);
  for(const v of versiones){
    try{
      const app=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const auth=await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
      FBM=auth;
      FBA=auth.getAuth(app.initializeApp(c));
      FBA.languageCode='es';
      FBLISTO=true;
      return true;
    }catch(e){ /* se intenta la siguiente versión */ }
  }
  return false;
}

async function accionFB(){
  if(!FBLISTO){ errFB('El sistema de cuentas todavía no cargó. Espere un momento.'); return; }
  const mail=(document.getElementById('fbMail')||{}).value||'';
  const cla=(document.getElementById('fbClave')||{}).value||'';
  if(!mail.includes('@')){ errFB('Escriba su correo electrónico.'); return; }
  if(cla.length<6){ errFB('La contraseña debe tener al menos 6 caracteres.'); return; }
  try{
    if(MODO==='crear'){

/* ---------- autorización contra la hoja de Google ---------- */
function jsonpPuente(url,payload){
  return new Promise((res,rej)=>{
    const cb='ac'+Date.now()+Math.floor(Math.random()*9999);
    const sc=document.createElement('script'); let listo=false;
    const limpiar=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();};
    const tm=setTimeout(()=>{if(listo)return;limpiar();rej(new Error('tiempo'));},20000);
    window[cb]=j=>{listo=true;limpiar();res(j);};
    sc.onerror=()=>{if(listo)return;limpiar();rej(new Error('red'));};
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&d='+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(sc);
  });
}
async function pedirAcceso(correo,nombre){
  const c=normCorreo(correo);
  if(esDocente(c)){ ST.u={u:c,n:nombre||'Docente',c}; ST.esDoc=true; abrirApp(); return; }

  const puente=CFG&&CFG.puente_url;
  if(!puente){
    // Sin puente configurado se usa la lista incrustada en el archivo.
    const al=buscarPorCorreo(c);
    if(!al){ errFB('El correo '+c+' no está en la lista de este curso. Escríbale al docente.'); salirFB(); return; }
    ST.u=al; ST.esDoc=false; abrirApp(); return;
  }
  okFB('Verificando su autorización…');
  try{
    const j=await jsonpPuente(puente,{accion:'acceso',clave:CFG.clave_publica||'',
      datos:{curso:CODIGO,correo:c,nombre:nombre||''}});
    if(!j||!j.ok){ errFB('No se pudo verificar su acceso. Intente de nuevo.'); salirFB(); return; }
    if(j.estado==='aprobado'){
      ST.u={u:c,n:j.nombre||nombre||c,c}; ST.esDoc=false; abrirApp(); return;
    }
    if(j.estado==='rechazado'){ errFB('Su solicitud fue rechazada. Hable con el docente.'); salirFB(); return; }
    pantallaEspera(c);
  }catch(e){
    errFB('No se pudo contactar el sistema de autorización. Intente más tarde.');
    salirFB();
  }
}

function ghCfg(){
  try{ return JSON.parse(lsG('gh_cfg')||'{}'); }catch(e){ return {}; }
}
function ghGuardar(o){ lsS('gh_cfg',JSON.stringify(o)); }
async function publicarCfg(){
  const g=ghCfg();
  const repo=(document.getElementById('ghRepo')||{}).value||g.repo||'';
  const ruta=(document.getElementById('ghRuta')||{}).value||g.ruta||'config.json';
  const tok=(document.getElementById('ghTok')||{}).value||g.tok||'';
  const res=document.getElementById('ghRes');
  const di=t=>{ if(res) res.innerHTML=t; };
  if(!repo.includes('/')){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta el repositorio.</b> Escríbalo así: <code>usuario/repositorio</code></div>'); return; }
  if(!tok){ di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>Falta la llave de acceso.</b></div>'); return; }
  ghGuardar({repo,ruta,tok});
  di('<div class="av2">Publicando…</div>');
  const api='https://api.github.com/repos/'+repo+'/contents/'+ruta;
  const cab={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'};
  try{
    let sha=null;
    const r1=await fetch(api+'?t='+Date.now(),{headers:cab});
    if(r1.status===200){ sha=(await r1.json()).sha; }
    else if(r1.status===404){ sha=null; }
    else if(r1.status===401||r1.status===403){ throw new Error('La llave no tiene permiso sobre ese repositorio.'); }
    else { throw new Error('GitHub respondió '+r1.status); }

    const texto=textoCfg();
    const cuerpo={message:'Actualizar configuración del aula',
      content:btoa(unescape(encodeURIComponent(texto)))};
    if(sha) cuerpo.sha=sha;
    const r2=await fetch(api,{method:'PUT',headers:{...cab,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)});
    if(!r2.ok){ const j=await r2.json().catch(()=>({})); throw new Error(j.message||('GitHub respondió '+r2.status)); }
    di('<div class="av2" style="background:#E9F9F0;color:#0A5B31"><b>✅ Publicado.</b> Los estudiantes lo ven al recargar, en uno o dos minutos.</div>');
    sOk();
  }catch(e){
    di('<div class="av2" style="background:#FCE9E9;color:#8A2020"><b>No se pudo publicar.</b> '+esc(e.message)+
       '<br>Puede copiar el texto y pegarlo a mano en GitHub.</div>');
  }
}
