  <!-- Apertura: contador 0–100 ligado a la carga real; máximo 2 s; se salta tocando -->

    <div class="ap-orbe ap-o1"></div><div class="ap-orbe ap-o2"></div><div class="ap-orbe ap-o3"></div>
    <div class="ap-centro">
      <div class="ap-anillo">
        <svg class="ap-aro" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" class="ap-pista"/>
          <circle cx="60" cy="60" r="54" class="ap-avance" id="ap-avance"/>
        </svg>
        <div class="ap-logo" id="ap-logo">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <circle cx="48" cy="48" r="45" fill="#fff" opacity=".14"/>
            <circle cx="48" cy="48" r="45" fill="none" stroke="#fff" stroke-width="2.5"/>
            <path class="ap-casa" d="M48 20 L72 40 h-7v24H31V40h-7Z" fill="#fff"/>
            <circle cx="48" cy="45" r="6" fill="#36347A"/>
            <path d="M37 62c0-6 5-11 11-11s11 5 11 11Z" fill="#36347A"/>
            <path class="ap-linea" d="M20 76h56" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/>

        </div>
      </div>

      <div class="ap-nombre" aria-hidden="true">
        <b>ASOCOMUNAL</b>
        <span>San Martín de Loba · Bolívar</span>
      </div>
    </div>
    <p class="ap-pie">Toque para continuar</p>
  </div>

  <a class="saltar" href="#app">Saltar al contenido</a>
  <div id="banner" class="banner" role="status" hidden>
    <svg class="ico" aria-hidden="true"><use href="#i-sinsenal"/></svg>
    <span>Sin señal. Todo sigue funcionando.</span>
  </div>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <nav id="nav" class="nav" aria-label="Navegación principal" hidden>
